# TOR clean dedicated VPS: loopback acceptance only, not public activation.
include /var/lib/tor-edge/current/nginx-http.conf;

server {
    listen 127.0.0.1:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 127.0.0.1:80;
    server_name pandaolate.ru;
    return 308 https://pandaolate.ru$request_uri;
}

server {
    listen 127.0.0.1:443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 127.0.0.1:443 ssl;
    server_name pandaolate.ru;
    ssl_certificate /etc/letsencrypt/live/pandaolate.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pandaolate.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;
    access_log off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 34m;
    client_header_timeout 15s;
    client_body_timeout 30s;
    keepalive_timeout 20s;
    gzip off;

    include /var/lib/tor-edge/current/nginx-server.conf;

    location = /internal/metrics { return 404; }
    location = /metrics { return 404; }
    location ~ /\. { return 404; }

    # Existing release acceptance requires real local HTTPS readiness.
    # Do not expose readiness or health diagnostics to remote visitors.
    location = /readyz {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host pandaolate.ru;
    }
    location = /healthz {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host pandaolate.ru;
    }
    location / {
        include /var/lib/tor-edge/current/nginx-proxy.conf;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host pandaolate.ru;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Server "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Original-URL "";
        proxy_set_header X-Rewrite-URL "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_redirect off;
    }
}
