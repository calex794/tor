# Include once in http{}; classify the original request before error_page redirects.
# Only reviewed public HTML navigations receive the game. No API/admin/auth writes.
map "$request_method:$uri:$http_accept" $tor_fallback_target {
    default /_tor-fallback/plain.txt;
    ~*^(GET|HEAD):/(|catalog|collections|books/[0-9]+|reader/[0-9]+|layers/[0-9]+):.*text/html /_tor-fallback/index.html;
}
