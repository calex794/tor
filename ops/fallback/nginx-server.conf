# Include in the existing TLS server{}. Independent of /opt/tor/current.
location = /_tor-fallback/index.html {
    internal;
    alias /var/lib/tor-fallback/index.html;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
}
location = /_tor-fallback/plain.txt {
    internal;
    alias /var/lib/tor-fallback/plain.txt;
    default_type text/plain;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
}
location = /_tor-fallback/style.css {
    alias /var/lib/tor-fallback/style.css;
    default_type text/css;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}
location = /_tor-fallback/game.js {
    alias /var/lib/tor-fallback/game.js;
    default_type application/javascript;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}
location = /_tor-fallback/config.json {
    alias /var/lib/tor-fallback/config.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}
location ^~ /_tor-fallback/ { return 404; }
