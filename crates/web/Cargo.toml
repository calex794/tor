[package]
name = "tor-web"
version.workspace = true
edition.workspace = true

[features]
default = []
s3-covers = ["tor-ingest/s3", "dep:aws-config", "dep:aws-sdk-s3"]

[dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["time"] }
tor-books = { path = "../books" }
tor-search = { path = "../search" }
tor-recommendations = { path = "../recommendations" }
tor-ingest = { path = "../ingest" }
aws-config = { version = "1", optional = true }
aws-sdk-s3 = { version = "1", optional = true }
async-trait.workspace = true
tor-reading = { path = "../reading" }
tor-accounts = { path = "../accounts" }
tor-route_intelligence = { path = "../route_intelligence" }
tor-traffic_behavior = { path = "../traffic_behavior" }
tor-observability = { path = "../observability" }
serde.workspace = true
tracing = "0.1"
tracing-subscriber = "0.3"
base64 = "0.22"
sha2 = "0.10"

[dev-dependencies]
sqlx.workspace = true
serde_json = "1"
tower = { version = "0.5", features = ["util"] }

image = { version = "0.25", default-features = false, features = ["png"] }
