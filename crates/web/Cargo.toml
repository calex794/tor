[package]
name = "tor-web"
version.workspace = true
edition.workspace = true
publish.workspace = true
license-file.workspace = true

[features]
default = []
# Explicitly selected only by isolated PG/MinIO/CDN HTTP tests; not a runtime flag.
test-cdn-loopback = []
s3-covers = ["tor-ingest/s3", "dep:aws-config", "dep:aws-sdk-s3"]
s3-paid = ["dep:tor-storage", "dep:aws-config", "dep:aws-sdk-s3"]
s3-free = ["dep:tor-storage", "dep:aws-config", "dep:aws-sdk-s3"]
s3-chapter-import = ["tor-imports/s3", "dep:aws-config", "dep:aws-sdk-s3"]

[dependencies]
tor-ads = { path = "../ads", version = "=0.1.0" }
axum = { workspace = true, features = ["multipart"] }
tokio = { workspace = true, features = ["time", "io-util", "signal"] }
tor-books = { path = "../books", version = "=0.1.0" }
tor-social = { path = "../social", version = "=0.1.0" }
tor-support = { path = "../support", version = "=0.1.0" }
tor-discussions = { path = "../discussions", version = "=0.1.0" }
tor-commerce = { path = "../commerce", version = "=0.1.0" }
tor-contracts = { path = "../contracts", version = "=0.1.0" }
tor-storage = { path = "../storage", version = "=0.1.0", features = ["pg", "s3"], optional = true }
tor-search = { path = "../search", version = "=0.1.0" }
tor-recommendations = { path = "../recommendations", version = "=0.1.0" }
tor-ingest = { path = "../ingest", version = "=0.1.0" }
tor-imports = { path = "../imports", version = "=0.1.0" }
aws-config = { version = "1", optional = true }
aws-sdk-s3 = { version = "1", optional = true, default-features = false, features = ["default-https-client", "http-1x", "rt-tokio", "sigv4a"] }
async-trait.workspace = true
tor-reading = { path = "../reading", version = "=0.1.0" }
tor-accounts = { path = "../accounts", version = "=0.1.0" }
tor-mail = { path = "../mail", version = "=0.1.0" }
tor-referrals = { path = "../referrals", version = "=0.1.0" }
tor-route_intelligence = { path = "../route_intelligence", version = "=0.1.0" }
tor-traffic_behavior = { path = "../traffic_behavior", version = "=0.1.0" }
tor-observability = { path = "../observability", version = "=0.1.0" }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
tracing = "0.1"
tracing-subscriber = "0.3"
base64 = "0.22"
sha2 = "0.10"
zeroize = "1"

hex = "0.4"

[dev-dependencies]
zstd = "0.13"
tower = { version = "0.5", features = ["util"] }

image = { version = "0.25", default-features = false, features = ["png"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
