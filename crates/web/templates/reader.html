<!-- NEwBOO public free-chapter reader; independent of protected/purchased JS. -->
<section class="section reader-page reader-public" data-free-reader aria-labelledby="reader-title">
  <div class="container reader-width">
    <header class="reader-topbar" aria-label="Панель чтения">
      <a class="reader-topbar__back" href="/books/<!--BOOK_ID-->">
        <span aria-hidden="true">←</span> К книге
      </a>
      <div class="reader-topbar__title">
        <span class="reader-topbar__book"><!--BOOK_TITLE--></span>
        <span class="reader-topbar__chapter"><!--CHAPTER_TITLE--></span>
      </div>
      <div class="reader-topbar__actions free-reader-actions">
        <details class="reader-topbar__toc reader-free-toc" data-free-toc data-free-toc-book="<!--BOOK_ID-->" data-free-toc-chapter="<!--CHAPTER_ID-->">
          <summary class="reader-free-toc__trigger" aria-label="Открыть оглавление">Оглавление</summary>
          <button type="button" class="reader-free-toc__backdrop" data-free-toc-backdrop tabindex="-1" aria-label="Закрыть оглавление"></button>
          <div class="reader-free-toc__menu" data-free-toc-modal role="dialog" aria-modal="true" aria-label="Оглавление книги">
            <header class="reader-free-toc__head">
              <div><strong>Оглавление</strong><small data-free-toc-total>Главы книги</small></div>
              <button type="button" class="reader-free-toc__close" data-free-toc-close aria-label="Закрыть оглавление">×</button>
            </header>
            <div class="reader-free-toc__scroll" data-free-toc-scroll tabindex="0" aria-label="Прокрутка оглавления">
              <ol class="reader-free-toc__list" data-free-toc-list aria-label="Главы книги"></ol>
            </div>
            <p class="reader-free-toc__status" role="status" data-free-toc-status>Оглавление загружается при открытии.</p>
          </div>
        </details>
        <button class="reader-topbar__settings" type="button" data-free-settings-open aria-controls="free-reader-settings" aria-expanded="false" aria-label="Настройки чтения">Aa</button>
        <button class="reader-topbar__theme" type="button" data-free-theme-cycle aria-label="Сменить тему">☾</button>
      </div>
    </header>
    <div class="reader-free-settings" id="free-reader-settings" data-free-reader-settings hidden>
      <button type="button" class="reader-free-settings__backdrop" data-free-settings-backdrop aria-label="Закрыть настройки чтения"></button>
      <section class="reader-free-settings__panel" role="dialog" aria-modal="true" aria-labelledby="free-reader-settings-title" tabindex="-1">
        <div class="reader-free-settings__head"><h2 id="free-reader-settings-title">Настройки чтения</h2><button type="button" data-free-settings-close>Закрыть</button></div>
        <div class="reader-free-settings__field" role="group" aria-label="Тема чтения"><span>Тема</span>
          <div class="reader-free-settings__choices">
            <button type="button" data-free-theme="system" aria-pressed="true">Системная</button>
            <button type="button" data-free-theme="light" aria-pressed="false">Светлая</button>
            <button type="button" data-free-theme="sepia" aria-pressed="false">Сепия</button>
            <button type="button" data-free-theme="dark" aria-pressed="false">Тёмная</button>
          </div>
        </div>
        <div class="reader-free-settings__field" role="group" aria-label="Шрифт чтения"><span>Шрифт</span>
          <div class="reader-free-settings__choices"><button type="button" data-free-font-family="serif" aria-pressed="true">С засечками</button><button type="button" data-free-font-family="sans" aria-pressed="false">Без засечек</button></div>
        </div>
        <label class="reader-free-settings__field">Размер текста<input type="range" min="80" max="140" step="5" value="100" data-free-font-scale><output data-free-font-output>100%</output></label>
        <label class="reader-free-settings__field">Межстрочный интервал<input type="range" min="150" max="220" step="5" value="185" data-free-line-height><output data-free-line-output>1.85</output></label>
        <label class="reader-free-settings__field">Ширина текста<input type="range" min="620" max="980" step="20" value="860" data-free-reader-width><output data-free-width-output>860 px</output></label>
        <button type="button" data-free-settings-reset>Сбросить настройки</button>
      </section>
    </div>
    <div class="reader-page__header">
      <p class="reader-page__meta">Бесплатная глава · Версия <!--CHAPTER_VERSION--></p>
      <h1 class="reader-page__title" id="reader-title"><!--CHAPTER_TITLE--></h1>
      <p class="reader-page__subtitle"><!--READER_SUBTITLE--></p>
    </div>
    <!--CHAPTER_NAVIGATION-->
    <article class="chapter-content reader-markdown" id="chapter-text" <!--FREE_PROGRESS_ATTRS--> aria-label="Текст главы"><!--CHAPTER_CONTENT--></article>
    <p class="reader-free-progress__notice" data-free-progress-notice role="status" hidden></p>
    <!--FREE_ISSUES_PANEL-->
    <!--FREE_CHAPTER_COMMENTS-->
    <!--CHAPTER_NAVIGATION-->
    <!--CONTINUATION_STATUS-->
    <!--CHAPTER_THANKS_LINK-->
    <p class="reader-page__return"><a class="text-link" href="/books/<!--BOOK_ID-->">Вернуться к оглавлению</a></p>
  </div>
  <script src="/assets/newboo-free-reader.js" defer></script>
  <script src="/assets/newboo-free-s3-reader.js" defer></script>
</section>
