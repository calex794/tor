<section class="section auth-section">
  <div class="container">
    <div class="auth-card auth-card--newboo">
      <!--AUTH_PANDA-->
      <header class="auth-card__header">
        <p class="auth-card__kicker">Пандаолейт</p>
        <h1 class="auth-card__title">Регистрация</h1>
        <p class="auth-card__text">Создайте аккаунт, чтобы читать, собирать библиотеку и работать с книгами.</p>
      </header>
      <form class="auth-form" method="post" action="/register" autocomplete="on" novalidate>
        <!--FORM_ERROR-->
        <input type="hidden" name="csrf_token" value="<!--CSRF_TOKEN-->">
        <!--AUTH_RETURN_FIELD-->
        <label for="register-name">Отображаемое имя</label>
        <input id="register-name" name="display_name" type="text" autocomplete="nickname" required maxlength="80" value="<!--DISPLAY_NAME-->">
        <label for="register-email">Электронная почта</label>
        <input id="register-email" name="email" type="email" autocomplete="email" required maxlength="254" value="<!--EMAIL-->">
        <label for="register-password">Пароль (12–128 символов)</label>
        <input id="register-password" name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="128" aria-describedby="register-password-hint">
        <p class="auth-form__help" id="register-password-hint">Минимум 12 символов, максимум 128.</p>
        <label for="register-invite">Код приглашения (необязательно)</label>
        <input id="register-invite" name="manual_invite_code" type="text" autocomplete="off" maxlength="64" value="">
        <button class="button" type="submit">Создать учётную запись</button>
      </form>
      <p class="auth-card__footer">Уже есть учётная запись? <a href="/login<!--AUTH_LOGIN_NEXT-->">Войти</a></p>
    </div>
  </div>
</section>
