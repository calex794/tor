<section class="section auth-section">
  <div class="container">
    <div class="auth-card auth-card--newboo">
      <!--AUTH_PANDA-->
      <header class="auth-card__header">
        <p class="auth-card__kicker">Пандаолейт</p>
        <h1 class="auth-card__title">Вход</h1>
        <p class="auth-card__text">Войдите, чтобы продолжить чтение и открыть личную библиотеку.</p>
      </header>
      <form class="auth-form" method="post" action="/login" autocomplete="on" novalidate>
        <input type="hidden" name="csrf_token" value="<!--CSRF_TOKEN-->">
        <!--AUTH_RETURN_FIELD-->
        <label for="login-email">Электронная почта</label>
        <input id="login-email" name="email" type="email" autocomplete="email" required maxlength="254">
        <label for="login-password">Пароль</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required maxlength="512">
        <button class="button" type="submit">Войти</button>
      </form>
      <p><a href="/forgot-password">Забыли пароль?</a></p>
      <p class="auth-card__footer">Нет учётной записи? <a href="/register<!--AUTH_REGISTER_NEXT-->">Зарегистрироваться</a></p>
    </div>
  </div>
</section>
