<section class="section auth-section">
  <div class="container">
    <div class="auth-card auth-card--newboo">
      <header class="auth-card__header">
        <h1 class="auth-card__title">Смена пароля</h1>
        <p class="auth-card__text">После изменения пароля все остальные устройства выйдут из аккаунта.</p>
      </header>
      <!--FORM_ERROR-->
      <form class="auth-form" method="post" action="/me/settings/password" autocomplete="on" novalidate>
        <input type="hidden" name="csrf_token" value="<!--CSRF_TOKEN-->">
        <label for="current-password">Текущий пароль</label>
        <input id="current-password" name="current_password" type="password" autocomplete="current-password" maxlength="512" required>
        <label for="new-password">Новый пароль</label>
        <input id="new-password" name="new_password" type="password" autocomplete="new-password" maxlength="512" minlength="12" required>
        <label for="confirm-password">Повторите новый пароль</label>
        <input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" maxlength="512" required>
        <button class="button" type="submit">Сменить пароль</button>
      </form>
      <p class="auth-card__footer"><a href="/me">Вернуться в кабинет</a></p>
    </div>
  </div>
</section>
