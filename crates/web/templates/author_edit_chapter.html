<section class="me-page author-workspace author-editor">
  <div class="container account-layout">
    <!--ACCOUNT_NAVIGATION-->
    <div class="account-main">
      <header class="ui-page-header"><div class="ui-page-header__content">
          <p class="ui-page-header__kicker">Кабинет автора · <!--EDIT_EYEBROW--></p>
          <h1 class="ui-page-header__title">Редактировать главу: <!--TITLE_HEADING--></h1>
          <p class="ui-page-header__text">Редакция №<!--REVISION-->. <!--EDIT_DESCRIPTION--></p>
      </div></header>
      <form class="author-editor__form" method="post" action="/me/books/<!--BOOK_ID-->/chapters/<!--CHAPTER_ID-->/edit" autocomplete="off">
        <input type="hidden" name="csrf_token" value="<!--CSRF_TOKEN-->">
        <input type="hidden" name="command_key" value="<!--COMMAND_KEY-->">
        <input type="hidden" name="expected_revision" value="<!--REVISION-->">
        <fieldset class="author-editor__panel"><legend>Параметры главы</legend>
          <div class="author-editor__fields">
            <div class="author-editor__field">
              <label for="edit-chapter-title">Название главы</label>
              <input class="ui-input" id="edit-chapter-title" name="title" type="text" value="<!--TITLE-->" maxlength="200" <!--TITLE_READONLY--> required>
            </div>
            <div class="author-editor__field">
              <label for="edit-chapter-number">Номер главы</label>
              <input class="ui-input" id="edit-chapter-number" name="number" type="number" min="1" max="1000000" value="<!--NUMBER-->" readonly required>
            </div>
            <!--EDIT_PRICE-->
          </div>
        </fieldset>
        <fieldset class="author-editor__panel"><legend>Текст главы</legend>
          <div class="author-editor__field">
            <label for="edit-chapter-body">Текст главы (Markdown, до 50 000 символов)</label>
            <textarea class="ui-textarea author-editor__body" id="edit-chapter-body" name="body" rows="18" maxlength="50000" required><!--BODY--></textarea>
          </div>
          <p class="author-editor__notice">Если глава изменена в другой вкладке, сохранение будет отклонено. Откройте страницу заново, чтобы получить последнюю редакцию.</p>
        </fieldset>
        <div class="author-editor__actions">
          <button class="ui-button" type="submit">Сохранить изменения</button>
          <a class="ui-button ui-button--ghost" href="/me/books/<!--BOOK_ID-->">Вернуться к книге</a>
        </div>
      </form>
    </div>
  </div>
</section>
