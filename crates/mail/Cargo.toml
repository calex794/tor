[package]
name = "tor-mail"
version.workspace = true
edition.workspace = true
publish.workspace = true
license-file.workspace = true

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
lettre = { version = "=0.11.24", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "ring", "webpki-roots"] }
tokio = { workspace = true, features = ["time"] }
hex = "0.4"
rand = "0.8"
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
zeroize = "1.9"
sqlx.workspace = true
tor-contracts = { path = "../contracts", version = "=0.1.0" }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
