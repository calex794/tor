[package]
name = "tor-storage"
version.workspace = true
edition.workspace = true
publish.workspace = true
license-file.workspace = true

[dependencies]
async-trait.workspace = true
tor-contracts = { path = "../contracts", version = "=0.1.0" }
aes-gcm = "0.10"
base64 = "0.22"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
getrandom = "0.2"
hex = "0.4"
sha2 = "0.10"
zeroize = "1"
zstd = "0.13"
serde.workspace = true
serde_json = "1"
tokio = { workspace = true, features = ["io-util", "time"] }
aws-sdk-s3 = { version = "1", optional = true, default-features = false, features = ["default-https-client", "http-1x", "rt-tokio", "sigv4a"] }
sqlx = { workspace = true, optional = true }

[features]
default = []
s3 = ["dep:aws-sdk-s3"]
pg = ["dep:sqlx"]

[dev-dependencies]
aws-smithy-runtime-api = { version = "1.22", features = ["client"] }
tokio = { workspace = true, features = ["test-util"] }
