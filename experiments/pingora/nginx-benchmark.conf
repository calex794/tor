# Only used on a disposable GitHub Actions runner; all ports are loopback.
worker_processes 1;
pid /tmp/tor-pingora-benchmark-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 4096; }
http {
    access_log off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    upstream fixture_backend {
        server 127.0.0.1:6194;
        keepalive 32;
    }
    upstream pingora_backend {
        server 127.0.0.1:6193;
        keepalive 32;
    }
    server {
        listen 127.0.0.1:6195;
        server_name _;
        location / {
            proxy_pass http://fixture_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
    server {
        listen 127.0.0.1:6196;
        server_name _;
        location / {
            proxy_pass http://pingora_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
