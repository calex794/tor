name: REC feedback acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/rec-feedback-acceptance.yml'
      - 'crates/recommendations/**'
      - 'crates/web/src/recommendation*'
      - 'crates/web/tests/recommendation*'
      - 'migrations/*rec_*'
      - 'tools/rec_*'
permissions:
  contents: read
concurrency:
  group: rec-feedback-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  source:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reproducible source bundle
        run: |
          git fetch origin pull/309/head:refs/heads/source-rec309 pull/320/head:refs/heads/source-rec320 pull/326/head:refs/heads/source-rec326
          git bundle create "$RUNNER_TEMP/tor-source.bundle" --all
          sha256sum "$RUNNER_TEMP/tor-source.bundle" > "$RUNNER_TEMP/tor-source.bundle.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: rec-source-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/tor-source.bundle
            ${{ runner.temp }}/tor-source.bundle.sha256
          retention-days: 1
          if-no-files-found: error
  offline-tools:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.title, 'WIP') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Offline Cargo source cache and compiler (no environment or credentials)
        run: |
          cargo fetch
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock"
          tar -C "$HOME/.cargo" -czf "$RUNNER_TEMP/cargo-registry.tar.gz" registry
          toolchain="$(rustc --print sysroot)"
          tar -C "$toolchain" -czf "$RUNNER_TEMP/rust-compiler.tar.gz" bin lib libexec
          docker run --rm -v "$RUNNER_TEMP:/out" postgres:18 sh -c 'tar -czf /out/pg18-runtime.tar.gz /usr/lib/postgresql/18 /usr/share/postgresql/18 /usr/lib/x86_64-linux-gnu'
      - uses: actions/upload-artifact@v4
        with:
          name: rec-offline-tools-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/cargo-registry.tar.gz
            ${{ runner.temp }}/rust-compiler.tar.gz
            ${{ runner.temp }}/pg18-runtime.tar.gz
            ${{ runner.temp }}/Cargo.lock
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
