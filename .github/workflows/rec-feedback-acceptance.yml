name: REC feedback acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/rec-feedback-acceptance.yml'
      - 'crates/**'
      - 'migrations/*rec_*'
      - 'tools/rec13_*'
permissions:
  contents: read
concurrency:
  group: rec-feedback-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  prepare-source:
    if: ${{ github.repository == 'calex794/tor' && github.event.pull_request.number == 328 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/f/rec-feedback-system-20261031' }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Exact source wiring in isolated checkout
        run: |
          python3 tools/rec13_integrate.py
          python3 tools/rec13_harden.py
      - name: Canonical Rust formatting
        run: cargo fmt --all
      - name: Publish source blobs only (no ref update or deployment)
        env:
          GH_TOKEN: ${{ github.token }}
          REC_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REC_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: python3 tools/rec13_publish_tree.py
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: isolated-ci-only
      TEST_DATABASE_URL: postgresql://tor_app:isolated-app@127.0.0.1:5432/tor_ci
      MIGRATOR_URL: postgresql://tor_migrator:isolated-migrate@127.0.0.1:5432/tor_ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Exact source wiring in isolated checkout
        run: |
          python3 tools/rec13_integrate.py
          python3 tools/rec13_harden.py
      - name: Prepare isolated database
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE tor_migrator LOGIN PASSWORD 'isolated-migrate';
          CREATE ROLE tor_app LOGIN PASSWORD 'isolated-app';
          CREATE DATABASE tor_ci OWNER tor_migrator;
          SQL
          psql -X -v ON_ERROR_STOP=1 -d tor_ci <<'SQL'
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          GRANT USAGE ON SCHEMA public TO tor_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE tor_migrator IN SCHEMA public GRANT SELECT,INSERT,UPDATE,DELETE ON TABLES TO tor_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE tor_migrator IN SCHEMA public GRANT USAGE,SELECT ON SEQUENCES TO tor_app;
          SQL
      - name: Apply real SQLx migrations twice
        run: |
          DATABASE_URL="$MIGRATOR_URL" cargo run -p tor-migrations --bin tor-migrate
          DATABASE_URL="$MIGRATOR_URL" cargo run -p tor-migrations --bin tor-migrate
      - name: Unit and PostgreSQL acceptance
        run: |
          cargo test -p tor-recommendations --all-targets
          cargo test -p tor-recommendations --test feedback_pg -- --ignored --test-threads=1
          cargo test -p tor-recommendations --test generations_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test recommendation_feedback_http_pg -- --ignored --test-threads=1
      - name: Browser acceptance
        run: bash tools/rec13_browser_acceptance.sh
      - name: Read-only source checks
        if: always()
        run: |
          python3 tools/check_feature_layout.py
          python3 tools/check_ril_governance.py
          python3 tools/check_contracts.py
      - name: Formatting evidence
        if: always()
        run: |
          cargo fmt --all
          git diff -- '*.rs' > "$RUNNER_TEMP/rec-rustfmt.patch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rec-evidence-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/rec-rustfmt.patch
            ${{ runner.temp }}/rec13-browser/shots/*.png
          retention-days: 1
