name: REC feedback acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/rec-feedback-acceptance.yml'
      # A specialist receipt: core PRs already run REC-13 in TOR postgres-runtime.
      # Keep this additional run only for recommendation-owned source/evidence
      # and schema changes that can alter the feedback contract.
      - 'crates/recommendations/**'
      - 'crates/web/src/recommendation_http/**'
      - 'crates/web/src/recommendation_worker.rs'
      - 'crates/web/assets/recommendations.js'
      - 'crates/web/tests/recommendation_feedback_http_pg.rs'
      - 'crates/web/tests/recommendation_preferences_http_pg.rs'
      - 'crates/web/tests/recommendation_preferences_http_pg/**'
      - 'crates/migrations/tests/rec_preferences_installed_upgrade_pg.rs'
      - 'crates/books/src/repositories/recommendation_policy.rs'
      # REC-13 SQL has its own _rec_ prefix. Other migrations are still
      # exercised by mandatory TOR integration (PostgreSQL, including REC),
      # but must not launch this redundant specialist workflow.
      - 'migrations/*_rec_*.sql'
      - 'tools/rec13_*'
      - 'crates/web/assets/surprise.js'
      - 'crates/web/assets/surprise.css'
      - 'crates/web/src/auth/surprise_http.rs'
      - 'crates/web/src/auth/surprise_admin.rs'
      - 'crates/web/tests/surprise_http_pg.rs'
      - 'tools/surprise_pg_browser.cjs'
      - 'tools/recommendation_preferences_pg_browser.cjs'
      - 'tools/audience_retirement_fixtures.cjs'
      - 'tools/audience_retired_pg_helpers.cjs'
      - 'tools/ci_browser_preview.cjs'
  push:
    branches: ['feat/f/rec-feedback-system-20261031']
permissions:
  contents: read
concurrency:
  group: rec-feedback-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  source-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve exact source for offline review
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/rec-source-sha.txt"
          git bundle create "$RUNNER_TEMP/rec-source.bundle" --all
      - uses: actions/upload-artifact@v4
        with:
          name: rec-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/rec-source.bundle
            ${{ runner.temp }}/rec-source-sha.txt
          retention-days: 3
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: isolated-ci-only
      TEST_DATABASE_URL: postgresql://tor_app:isolated-app@127.0.0.1:5432/tor_ci
      MIGRATOR_URL: postgresql://tor_migrator:isolated-migrate@127.0.0.1:5432/tor_ci
      LEGACY_ANALYTICS_DATABASE_URL: postgresql://tor_app:isolated-app@127.0.0.1:5432/tor_ci_legacy_analytics
      LEGACY_ANALYTICS_MIGRATOR_URL: postgresql://tor_migrator:isolated-migrate@127.0.0.1:5432/tor_ci_legacy_analytics
      COLLECTION_RETIREMENT_UPGRADE_DATABASE_URL: postgresql://tor_migrator:isolated-migrate@127.0.0.1:5432/tor_ci_collection_retirement_upgrade
      COLLECTION_RETIREMENT_APP_DATABASE_URL: postgresql://tor_app:isolated-app@127.0.0.1:5432/tor_ci_collection_retirement_upgrade
      COLLECTION_RETIREMENT_STARTUP_MIGRATOR_URL: postgresql://tor_migrator:isolated-migrate@127.0.0.1:5432/tor_ci_collection_retirement_startup
      COLLECTION_RETIREMENT_STARTUP_APP_DATABASE_URL: postgresql://tor_app:isolated-app@127.0.0.1:5432/tor_ci_collection_retirement_startup
      # Reuse the compact profiles already required by tor-integration.yml.
      # REC runs several full workspace builds and otherwise exhausts runner disk.
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check committed source without rewriting it
        run: |
          cargo fmt --all -- --check
          python3 tools/check_feature_layout.py
          python3 tools/check_ril_governance.py
          python3 tools/check_contracts.py
      - name: Prepare isolated database
        run: |
          # GitHub ubuntu-24.04 typically includes psql and pg_isready already.
          # Fall back to apt if a future runner image removes either binary.
          if command -v psql >/dev/null 2>&1 && command -v pg_isready >/dev/null 2>&1; then
            psql --version
            echo "Using preinstalled PostgreSQL client"
          else
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE tor_migrator LOGIN PASSWORD 'isolated-migrate';
          CREATE ROLE tor_app LOGIN PASSWORD 'isolated-app';
          CREATE DATABASE tor_ci OWNER tor_migrator;
          SQL
          psql -X -v ON_ERROR_STOP=1 -d tor_ci <<'SQL'
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          GRANT USAGE ON SCHEMA public TO tor_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE tor_migrator IN SCHEMA public GRANT SELECT,INSERT,UPDATE,DELETE ON TABLES TO tor_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE tor_migrator IN SCHEMA public GRANT USAGE,SELECT ON SEQUENCES TO tor_app;
          SQL
      - name: Apply real SQLx migrations twice
        run: |
          DATABASE_URL="$MIGRATOR_URL" cargo run -p tor-migrations --bin tor-migrate
          DATABASE_URL="$MIGRATOR_URL" cargo run -p tor-migrations --bin tor-migrate
      - name: Chromium for native fresh-schema HTML quality
        run: |
          bash tools/ci_prepare_ubuntu_mirror.sh
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps --only-shell chromium
      - name: Native HTML quality on the fresh schema
        env:
          TOR_AUDIENCE_SHOTS: ${{ runner.temp }}/rec13-browser/shots
          TOR_HTML_HEALTH_LOG: ${{ runner.temp }}/rec13-browser/server-html-health.log
          TOR_FLOW_EMIT_SCREENSHOTS: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/rec13-browser"
          cargo build -p tor-web
          bash tools/flow_html_health_browser_acceptance.sh
      - name: FLOW catalogue index migration and recovery (disposable databases)
        run: |
          psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          CREATE DATABASE tor_ci_flow_index_fresh OWNER tor_migrator;
          CREATE DATABASE tor_ci_flow_index_upgrade OWNER tor_migrator;
          CREATE DATABASE tor_ci_flow_index_invalid OWNER tor_migrator;
          CREATE DATABASE tor_ci_flow_index_unrecorded OWNER tor_migrator;
          SQL
          FLOW_BOOK_INDEX_MIGRATOR_URL="${MIGRATOR_URL%/tor_ci}/tor_ci_flow_index_fresh" \
            cargo test -p tor-migrations --test flow_book_indexes_pg -- --ignored --test-threads=1 --nocapture
      - name: REC explicit preferences installed upgrade (disposable database)
        run: |
          psql -X -v ON_ERROR_STOP=1 -d postgres -c 'CREATE DATABASE tor_ci_rec_preferences_upgrade OWNER tor_migrator'
          REC_PREFERENCES_UPGRADE_DATABASE_URL='postgresql://tor_migrator:isolated-migrate@127.0.0.1:5432/tor_ci_rec_preferences_upgrade' \
            cargo test -p tor-migrations --test rec_preferences_installed_upgrade_pg -- --ignored --test-threads=1
      - name: Prepare explicit legacy and installed-upgrade analytics databases
        run: |
          psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          CREATE DATABASE tor_ci_legacy_analytics OWNER tor_migrator;
          CREATE DATABASE tor_ci_collection_retirement_upgrade OWNER tor_migrator;
          CREATE DATABASE tor_ci_collection_retirement_startup OWNER tor_migrator;
          SQL
          for fixture_database in tor_ci_legacy_analytics tor_ci_collection_retirement_upgrade tor_ci_collection_retirement_startup; do
            psql -X -v ON_ERROR_STOP=1 -v fixture_database="$fixture_database" -d "$fixture_database" <<'SQL'
          REVOKE ALL ON DATABASE :"fixture_database" FROM PUBLIC;
          GRANT CONNECT ON DATABASE :"fixture_database" TO tor_app;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          GRANT USAGE ON SCHEMA public TO tor_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE tor_migrator IN SCHEMA public
            GRANT SELECT,INSERT,UPDATE,DELETE ON TABLES TO tor_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE tor_migrator IN SCHEMA public
            GRANT USAGE,SELECT ON SEQUENCES TO tor_app;
          SQL
          done
          cargo test -p tor-migrations --test legacy_analytics_baseline_pg -- --ignored --test-threads=1
          cargo test -p tor-migrations --test collection_retirement_startup_baseline_pg -- --ignored --test-threads=1
      - name: Installed 190 to current analytics retirement with canonical and preference preservation
        run: cargo test -p tor-migrations --test collection_retirement_installed_upgrade_pg -- --ignored --test-threads=1 --nocapture
      - name: Unit and PostgreSQL acceptance
        run: |
          mkdir -p "$RUNNER_TEMP/rec13-browser"
          exec > >(tee "$RUNNER_TEMP/rec13-browser/acceptance.log") 2>&1
          cargo test -p tor-recommendations --all-targets
          cargo test -p tor-recommendations --test surprise_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test surprise_http_pg -- --ignored --test-threads=1
          cargo test -p tor-recommendations --test feedback_pg -- --ignored --test-threads=1
          cargo test -p tor-recommendations --test recommendation_preferences_pg -- --ignored --test-threads=1
          cargo test -p tor-recommendations --test recommendation_preferences_legacy_pg -- --ignored --test-threads=1
          cargo test -p tor-recommendations --test catalog_feed_pg -- --ignored --test-threads=1
          cargo test -p tor-recommendations --test catalog_legacy_history_pg -- --ignored --test-threads=1
          cargo test -p tor-recommendations --test analytics_invalidation_pg -- --ignored --test-threads=1
          cargo test -p tor-recommendations --test generations_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test recommendation_feedback_http_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test recommendation_preferences_http_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test audience_retirement_http_pg -- --ignored --test-threads=1
          cargo test -p tor-recommendations --test flow_visits_pg -- --ignored --test-threads=1
          cargo test -p tor-recommendations --test exposure_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test exposure_http_pg -- --ignored --test-threads=1
          cargo test -p tor-recommendations --test flow_signals_pg -- --ignored --test-threads=1
          cargo test -p tor-recommendations --test exposure_health_pg -- --ignored --test-threads=1
          cargo test -p tor-recommendations --test flow_genres_pg -- --ignored --test-threads=1
          cargo test -p tor-search --test seo_pg -- --ignored --test-threads=1
          cargo test -p tor-search --test public_pages_pg -- --ignored --test-threads=1
          cargo test -p tor-reading --test audience_closed_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test exposure_report_http_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test flow_signals_http_pg -- --ignored --test-threads=1
          cargo test -p tor-ads --test editorial_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test editorial_http_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test flow_visits_http_pg -- --ignored --test-threads=1
          cargo test -p tor-reading --test flow_capture_pg -- --ignored --test-threads=1
          cargo test -p tor-reading --test collection_retirement_pg -- --ignored --test-threads=1
          cargo test -p tor-recommendations --test flow_funnel_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test flow_funnel_http_pg -- --ignored --test-threads=1
      - name: Browser acceptance
        run: bash tools/rec13_browser_acceptance.sh
      # The full-workspace Rust/Clippy and architecture baselines are already
      # mandatory in integration/demo and Repository rules; do not rebuild them
      # a second time merely to collect the REC-13 browser evidence.
      - name: Confirm tested source is the committed source
        if: always()
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rec-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/rec13-browser/*.log
            ${{ runner.temp }}/rec13-browser/shots/*.png
          retention-days: 3
