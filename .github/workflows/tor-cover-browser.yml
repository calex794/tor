name: TOR author cover real browser
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  select:
    uses: ./.github/workflows/ci-selection.yml
    with:
      caller: cover_browser
  author-cover:
    needs: select
    if: ${{ !cancelled() && (needs.select.result != 'success' || fromJSON(needs.select.outputs.suites || '{"cover_browser":true}').cover_browser) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: tor-cover-browser-ci-superuser
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: tor-cover-browser-ci-superuser
      APP_URL: postgresql://tor_app:tor-cover-browser-ci-app@127.0.0.1:5432/tor_ci
      MIGRATION_URL: postgresql://tor_migrator:tor-cover-browser-ci-migrator@127.0.0.1:5432/tor_ci
      TOR_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      TOR_TEST_S3_ACCESS_KEY: tor-cover-ci-user
      TOR_TEST_S3_SECRET_KEY: tor-cover-ci-secret-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create disposable PostgreSQL roles and apply canonical migrations
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE tor_migrator LOGIN PASSWORD 'tor-cover-browser-ci-migrator';
          CREATE ROLE tor_app LOGIN PASSWORD 'tor-cover-browser-ci-app';
          CREATE DATABASE tor_ci OWNER tor_migrator;
          SQL
          psql -X -v ON_ERROR_STOP=1 -d tor_ci <<'SQL'
          REVOKE ALL ON DATABASE tor_ci FROM PUBLIC;
          GRANT CONNECT ON DATABASE tor_ci TO tor_app;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          GRANT USAGE ON SCHEMA public TO tor_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE tor_migrator IN SCHEMA public
            GRANT SELECT,INSERT,UPDATE,DELETE ON TABLES TO tor_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE tor_migrator IN SCHEMA public
            GRANT USAGE,SELECT ON SEQUENCES TO tor_app;
          SQL
          DATABASE_URL="$MIGRATION_URL" cargo run -p tor-migrations --bin tor-migrate
      - name: Start checksum-verified MinIO on loopback
        run: |
          set -euo pipefail
          release=minio.linux-amd64.RELEASE.2025-09-07T16-13-09Z
          url=https://github.com/minio/minio/releases/download/RELEASE.2025-09-07T16-13-09Z
          curl --fail --location --silent --show-error --retry 3 \
            "$url/$release" --output "$RUNNER_TEMP/$release"
          curl --fail --location --silent --show-error --retry 3 \
            "$url/$release.sha256sum" --output "$RUNNER_TEMP/$release.sha256sum"
          expected=$(grep -Eo '[0-9a-f]{64}' "$RUNNER_TEMP/$release.sha256sum" | head -n 1)
          test "$expected" = "$(sha256sum "$RUNNER_TEMP/$release" | cut -d ' ' -f1)"
          chmod 700 "$RUNNER_TEMP/$release"
          mkdir -p "$RUNNER_TEMP/tor-cover-minio"
          MINIO_ROOT_USER="$TOR_TEST_S3_ACCESS_KEY" MINIO_ROOT_PASSWORD="$TOR_TEST_S3_SECRET_KEY" \
            MINIO_API_CORS_ALLOW_ORIGIN="http://127.0.0.1:3098" \
            nohup "$RUNNER_TEMP/$release" server "$RUNNER_TEMP/tor-cover-minio" \
              --address 127.0.0.1:9000 --console-address 127.0.0.1:9001 \
              > "$RUNNER_TEMP/minio.log" 2>&1 &
          ready=0
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
      - name: Prepare isolated reset test mailbox
        run: |
          mkdir -m 700 -p "$RUNNER_TEMP/account-reset-mail"
          cat > "$RUNNER_TEMP/account-reset-sendmail" <<'PYMAIL'
          #!/usr/bin/env python3
          import hashlib, os, pathlib, sys
          message = sys.stdin.read()
          recipient = next(line[4:].strip() for line in message.splitlines() if line.startswith('To: '))
          if not recipient.endswith('@example.invalid'):
              sys.exit(2)
          dest = pathlib.Path(os.environ['TOR_RESET_TEST_MAIL_DIR']) / hashlib.sha256(recipient.encode()).hexdigest()
          fd = os.open(dest, os.O_CREAT | os.O_WRONLY | os.O_TRUNC, 0o600)
          with os.fdopen(fd, 'w') as output:
              output.write(message)
          PYMAIL
          chmod 700 "$RUNNER_TEMP/account-reset-sendmail"
      - name: Create private test bucket using existing verified S3 provider test
        run: |
          cargo test -p tor-ingest --features s3 --test s3_provider -- --ignored --test-threads=1
      - name: Build real Rust server with private S3 enabled
        run: cargo build -p tor-web --features s3-covers
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Real owner session, S3 upload, PostgreSQL worker, browser layout and public WebP
        env:
          TOR_COVER_S3_BUCKET: tor-private-cover-ci
          TOR_COVER_S3_DIRECT_ORIGIN: http://127.0.0.1:9000
          TOR_DIRECT_COVER_BROWSER: '1'
          TOR_COVER_WORKER_ENABLED: '1'
          TOR_AUTH_ENABLED: '1'
          TOR_PUBLIC_ORIGIN: http://127.0.0.1:3098
          TOR_LISTEN_ADDR: 127.0.0.1:3098
          DATABASE_URL: ${{ env.APP_URL }}
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: tor-cover-ci-user
          AWS_SECRET_ACCESS_KEY: tor-cover-ci-secret-only
          AWS_ENDPOINT_URL_S3: http://127.0.0.1:9000
          AWS_EC2_METADATA_DISABLED: 'true'
          TOR_COVER_BROWSER_SHOTS: ${{ runner.temp }}/cover-browser-shots
          TOR_PASSWORD_RESET_ENABLED: '1'
          TOR_RESET_SENDMAIL: ${{ runner.temp }}/account-reset-sendmail
          TOR_RESET_MAIL_FROM: no-reply@example.invalid
          TOR_RESET_TEST_MAIL_DIR: ${{ runner.temp }}/account-reset-mail
        run: |
          set -euo pipefail
          mkdir -p "$TOR_COVER_BROWSER_SHOTS"
          ./target/debug/tor-web > "$RUNNER_TEMP/cover-web.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3098/readyz >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat "$RUNNER_TEMP/cover-web.log"; exit 1; fi
          node tools/author_cover_pg_visual_smoke.cjs
          node tools/account_line_browser.cjs
          # The private bucket must stay inaccessible to anonymous browsers.
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:9000/tor-private-cover-ci/staging/covers/variants/provider-card.webp)
          test "$code" = 403
      - name: Diagnostic logs if the browser journey fails
        if: failure()
        run: |
          tail -n 140 "$RUNNER_TEMP/minio.log" 2>/dev/null || true
          tail -n 140 "$RUNNER_TEMP/cover-web.log" 2>/dev/null || true
      - name: Save real browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tor-owner-cover-real-pg-s3-390-1440
          path: ${{ runner.temp }}/cover-browser-shots/*.png
          if-no-files-found: warn
          retention-days: 14
