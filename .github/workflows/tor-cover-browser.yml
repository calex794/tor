name: TOR author cover real browser
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  select:
    uses: ./.github/workflows/ci-selection.yml
    with:
      caller: cover_browser
  author-cover:
    needs: select
    if: ${{ !cancelled() && (needs.select.result != 'success' || fromJSON(needs.select.outputs.suites || '{"cover_browser":true}').cover_browser) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: tor-cover-browser-ci-superuser
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: tor-cover-browser-ci-superuser
      APP_URL: postgresql://tor_app:tor-cover-browser-ci-app@127.0.0.1:5432/tor_ci
      MIGRATION_URL: postgresql://tor_migrator:tor-cover-browser-ci-migrator@127.0.0.1:5432/tor_ci
      TOR_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      TOR_TEST_S3_ACCESS_KEY: tor-cover-ci-user
      TOR_TEST_S3_SECRET_KEY: tor-cover-ci-secret-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare authenticated Ubuntu mirror fallback
        run: bash tools/ci_prepare_ubuntu_mirror.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run shared PostgreSQL cover browser acceptance
        uses: ./.github/actions/pg-cover-browser
      - name: Diagnostic logs if the browser journey fails
        if: failure()
        run: |
          tail -n 140 "$RUNNER_TEMP/minio.log" 2>/dev/null || true
          tail -n 140 "$RUNNER_TEMP/cover-web.log" 2>/dev/null || true
      - name: Save real browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tor-owner-cover-real-pg-s3-390-1440
          path: ${{ runner.temp }}/cover-browser-shots/*.png
          if-no-files-found: warn
          retention-days: 14
