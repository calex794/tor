name: TOR private S3 cover compile
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  select:
    uses: ./.github/workflows/ci-selection.yml
    with:
      caller: cover_s3
  s3-cover-build:
    needs: select
    if: ${{ !cancelled() && (needs.select.result != 'success' || fromJSON(needs.select.outputs.suites || '{"cover_s3":true}').cover_s3) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: tor-obs09-pg
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: tor-obs09-pg
      TEST_DATABASE_URL: postgresql://tor_app:tor-obs09-app@127.0.0.1:5432/tor_ci
      MIGRATOR_URL: postgresql://tor_migrator:tor-obs09-migrator@127.0.0.1:5432/tor_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run shared private S3 cover acceptance
        uses: ./.github/actions/pg-cover-s3
      # This parallel S3 runner has spare time after real MinIO/PG acceptance.
      # Required CI only: run the shared lint here when both Rust and PG run.
      - name: Combined S3 feature Clippy (paired Rust and PostgreSQL)
        if: ${{ github.workflow == 'TOR integration CI' && needs.select.result == 'success' && fromJSON(needs.select.outputs.suites || '{"rust":false}').rust && fromJSON(needs.select.outputs.suites || '{"postgres":false}').postgres }}
        run: cargo clippy -p tor-web --all-targets --features 's3-covers,s3-paid,s3-free,s3-chapter-import' -- -D warnings
      - name: Build the exact production profile and prove actual startup with S3 configured
        run: |
          bash tools/build_tor_production_web.sh
          bash tools/test_tor_production_web_startup.sh
      - name: MinIO diagnostics on failure
        if: failure()
        run: tail -n 80 "$RUNNER_TEMP/tor-cover-minio.log" || true
