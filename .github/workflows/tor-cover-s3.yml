name: TOR private S3 cover compile
on:
  pull_request:
    paths:
      - 'crates/web/Cargo.toml'
      - 'crates/web/src/main.rs'
      - 'crates/web/src/cover_delivery.rs'
      - 'crates/web/src/cover_http.rs'
      - 'crates/ingest/Cargo.toml'
      - 'crates/ingest/src/repositories/s3.rs'
      - '.github/workflows/tor-cover-s3.yml'
  push:
    branches: [main]
    paths:
      - 'crates/web/Cargo.toml'
      - 'crates/web/src/main.rs'
      - 'crates/web/src/cover_delivery.rs'
      - 'crates/web/src/cover_http.rs'
      - 'crates/ingest/Cargo.toml'
      - 'crates/ingest/src/repositories/s3.rs'
      - '.github/workflows/tor-cover-s3.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tor-private-cover-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  s3-cover-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compile private S3 cover adapter without provider credentials
        run: cargo check -p tor-web --features s3-covers
