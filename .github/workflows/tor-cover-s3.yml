name: TOR private S3 cover compile
on:
  pull_request:
    paths:
      - 'crates/web/Cargo.toml'
      - 'crates/web/src/main.rs'
      - 'crates/web/src/cover_delivery.rs'
      - 'crates/web/src/cover_http.rs'
      - 'crates/ingest/Cargo.toml'
      - 'crates/ingest/src/repositories/s3.rs'
      - 'crates/ingest/tests/s3_provider.rs'
      - '.github/workflows/tor-cover-s3.yml'
  push:
    branches: [main]
    paths:
      - 'crates/web/Cargo.toml'
      - 'crates/web/src/main.rs'
      - 'crates/web/src/cover_delivery.rs'
      - 'crates/web/src/cover_http.rs'
      - 'crates/ingest/Cargo.toml'
      - 'crates/ingest/src/repositories/s3.rs'
      - 'crates/ingest/tests/s3_provider.rs'
      - '.github/workflows/tor-cover-s3.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tor-private-cover-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  s3-cover-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compile private S3 cover adapter without provider credentials
        run: cargo check -p tor-web --features s3-covers
      - name: Start upstream release of MinIO on loopback with SHA-256 verification
        run: |
          release=minio.linux-amd64.RELEASE.2025-09-07T16-13-09Z
          url=https://github.com/minio/minio/releases/download/RELEASE.2025-09-07T16-13-09Z
          curl --fail --location --silent --show-error --retry 3 \
            "$url/$release" --output "$RUNNER_TEMP/$release"
          curl --fail --location --silent --show-error --retry 3 \
            "$url/$release.sha256sum" --output "$RUNNER_TEMP/$release.sha256sum"
          expected=$(grep -Eo '[0-9a-f]{64}' "$RUNNER_TEMP/$release.sha256sum" | head -n 1)
          test "${#expected}" -eq 64
          actual=$(sha256sum "$RUNNER_TEMP/$release" | cut -d ' ' -f1)
          test "$actual" = "$expected"
          chmod 700 "$RUNNER_TEMP/$release"
          mkdir -p "$RUNNER_TEMP/tor-minio-data"
          MINIO_ROOT_USER=tor-cover-ci-user MINIO_ROOT_PASSWORD=tor-cover-ci-secret-only \
            nohup "$RUNNER_TEMP/$release" server "$RUNNER_TEMP/tor-minio-data" \
              --address 127.0.0.1:9000 --console-address 127.0.0.1:9001 \
              > "$RUNNER_TEMP/tor-cover-minio.log" 2>&1 &
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            tail -n 80 "$RUNNER_TEMP/tor-cover-minio.log"
            exit 1
          fi
      - name: Test signed S3 PUT HEAD GET, integrity and strict size bounds
        env:
          TOR_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          TOR_TEST_S3_ACCESS_KEY: tor-cover-ci-user
          TOR_TEST_S3_SECRET_KEY: tor-cover-ci-secret-only
        run: |
          cargo fmt --all -- --check
          cargo test -p tor-ingest --features s3 --test s3_provider -- --ignored --test-threads=1
          cargo clippy -p tor-ingest --features s3 --test s3_provider -- -D warnings
      - name: Assert direct anonymous URL cannot read the private cover
        run: |
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:9000/tor-private-cover-ci/staging/covers/variants/provider-card.webp)
          test "$code" = 403
      - name: MinIO diagnostics on failure
        if: failure()
        run: tail -n 80 "$RUNNER_TEMP/tor-cover-minio.log" || true
