name: FLOW CI mirror install validation (not application acceptance)
on:
  push:
    branches: ['wip/flow-ci-network-probe-20261111-1428']
permissions:
  contents: read
jobs:
  apt-and-chromium-with-full-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check helper and preserve Ubuntu sources and trust root
        shell: bash
        run: |
          bash -n tools/ci_prepare_ubuntu_mirror.sh
          flow_ci_sources_before="$(sha256sum /etc/apt/sources.list.d/ubuntu.sources /usr/share/keyrings/ubuntu-archive-keyring.gpg)"
          bash tools/ci_prepare_ubuntu_mirror.sh
          test "$flow_ci_sources_before" = "$(sha256sum /etc/apt/sources.list.d/ubuntu.sources /usr/share/keyrings/ubuntu-archive-keyring.gpg)"
          flow_ci_mirrors_before="$(sha256sum /etc/apt/apt-mirrors.txt)"
          bash tools/ci_prepare_ubuntu_mirror.sh
          test "$flow_ci_mirrors_before" = "$(sha256sum /etc/apt/apt-mirrors.txt)"
      - name: Install unchanged Playwright version with all Chromium dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Launch headless shell and full Chromium
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright');
          (async () => {
            for (const options of [{}, { channel: 'chromium' }]) {
              const browser = await chromium.launch({ headless: true, ...options });
              try {
                const page = await browser.newPage();
                await page.setContent('<p lang="ru">Проверка браузера</p>');
                assert.equal(await page.locator('p').textContent(), 'Проверка браузера');
                console.log('Browser launch passed:', options.channel || 'chromium-headless-shell');
              } finally {
                await browser.close();
              }
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS
