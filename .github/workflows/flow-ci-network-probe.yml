name: FLOW CI network diagnostics (not acceptance)
on:
  push:
    branches: ['wip/flow-ci-network-probe-20261111-1428']
permissions:
  contents: read
jobs:
  dns-and-signed-ubuntu-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read-only DNS and Ubuntu signature probes
        shell: bash
        run: |
          set -u
          flow_probe_failed=0
          for flow_probe_host in github.com registry.npmjs.org azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com mirrors.edge.kernel.org; do
            printf 'DNS host=%s\n' "$flow_probe_host"
            if timeout 4s getent ahosts "$flow_probe_host"; then
              printf 'DNS result=resolved\n'
            else
              printf 'DNS result=failed\n'
              flow_probe_failed=1
            fi
          done
          flow_probe_file="$(mktemp)"
          trap 'rm -f "$flow_probe_file"' EXIT
          for flow_probe_url in \
            https://archive.ubuntu.com/ubuntu/dists/noble/InRelease \
            https://security.ubuntu.com/ubuntu/dists/noble-security/InRelease \
            https://mirrors.edge.kernel.org/ubuntu/dists/noble/InRelease; do
            printf 'SIGNED_METADATA url=%s\n' "$flow_probe_url"
            if curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
              --connect-timeout 3 --max-time 8 --max-filesize 1048576 --retry 0 \
              --output "$flow_probe_file" --write-out 'HTTP status=%{http_code} remote_ip=%{remote_ip}\n' \
              "$flow_probe_url"; then
              if gpgv --keyring /usr/share/keyrings/ubuntu-archive-keyring.gpg "$flow_probe_file"; then
                printf 'SIGNED_METADATA result=ubuntu_signature_verified\n'
              else
                printf 'SIGNED_METADATA result=signature_unverified\n'
                flow_probe_failed=1
              fi
            else
              printf 'SIGNED_METADATA result=download_failed\n'
              flow_probe_failed=1
            fi
          done
          printf 'DIAGNOSTIC_ONLY application_acceptance=not_tested\n'
          exit "$flow_probe_failed"
