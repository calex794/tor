name: Doppelscan audit (advisory)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/reuse-audit.yml'
      - 'docs/architecture/reuse-experiment.md'
permissions:
  contents: read
jobs:
  scan:
    name: reuse / doppelscan
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    env:
      SCAN_SHA: ${{ github.sha }}
      TOOL: doppelscan
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare immutable Rust-only snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reuse-source" "$RUNNER_TEMP/reuse-bin" "$RUNNER_TEMP/reuse-report"
          test "$(git rev-parse HEAD)" = "$SCAN_SHA"
          git archive "$SCAN_SHA" crates | tar -x -C "$RUNNER_TEMP/reuse-source"
          find "$RUNNER_TEMP/reuse-source" -type f ! -name '*.rs' -delete
          find "$RUNNER_TEMP/reuse-source" -type l -delete
          cd "$RUNNER_TEMP/reuse-source"
          find . -type f -name '*.rs' -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/reuse-report/input.sha256"
          printf 'commit=%s\nfiles=%s\n' "$SCAN_SHA" "$(wc -l < "$RUNNER_TEMP/reuse-report/input.sha256")" | tee "$RUNNER_TEMP/reuse-report/input.txt"
      - name: Install pinned analyzer (no source mounted)
        shell: bash
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/reuse-bin"
          url=https://github.com/CMaintz/doppelscan/releases/download/v0.9.0/doppelscan-v0.9.0-x86_64-unknown-linux-gnu.tar.gz
          sha=e5d5abd63abfb74dddfc52d60d58144f402218aa49b3b6b6e610d1e3171f355f
          mkdir -p "$bin/bin" "$RUNNER_TEMP/reuse-unpack"
          curl --fail --silent --show-error --location --retry 3 "$url" -o "$RUNNER_TEMP/reuse-tool.tar.gz"
          printf '%s  %s\n' "$sha" "$RUNNER_TEMP/reuse-tool.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/reuse-tool.tar.gz" -C "$RUNNER_TEMP/reuse-unpack"
          executable="$(find "$RUNNER_TEMP/reuse-unpack" -type f -name "$TOOL" -print -quit)"
          test -n "$executable"
          install -m 0755 "$executable" "$bin/bin/$TOOL"
          docker pull ubuntu:24.04
      - name: Run offline, bounded, read-only scan
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/reuse-report"
          run_scan() {
            local label="$1"
            shift
            local name="reuse-$TOOL-$label"
            local start status elapsed
            start=$(date +%s)
            set +e
            timeout --kill-after=10s 300s docker run --name "$name" --network none --read-only \
              --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 --cpus 2 --memory 4g \
              --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,nosuid,nodev,size=128m \
              -e HOME=/tmp -v "$RUNNER_TEMP/reuse-source:/src:ro" \
              -v "$RUNNER_TEMP/reuse-bin/bin:/tools:ro" -v "$report:/reports:rw" -w /src ubuntu:24.04 \
              sh -c '"$@"; rc=$?; printf "memory_peak_bytes=" >&2; cat /sys/fs/cgroup/memory.peak >&2 || true; exit "$rc"' sh "$@" \
              > "$report/$label.stdout" 2> "$report/$label.stderr"
            status=$?
            set -e
            elapsed=$(($(date +%s)-start))
            docker inspect -f '{{.State.OOMKilled}}' "$name" > "$report/$label.oom" 2>/dev/null || true
            docker rm -f "$name" >/dev/null 2>&1 || true
            printf '%s exit=%s wall_seconds=%s\n' "$label" "$status" "$elapsed" | tee -a "$report/status.txt"
            if [[ "$status" != 0 ]]; then
              printf '::warning::%s/%s exited %s; not a successful scan\n' "$TOOL" "$label" "$status"
              return 1
            fi
          }
          failed=0
          run_scan version "/tools/$TOOL" --version || failed=1
          run_scan exact /tools/doppelscan --format json --limit 0 --only rust --min-tokens 50 --strict || failed=1
          run_scan renamed /tools/doppelscan --format json --limit 0 --only rust --min-tokens 50 || failed=1
          run_scan near /tools/doppelscan near --format json --limit 0 --only rust --min-tokens 50 --similarity 0.8 || failed=1
          exit "$failed"
      - name: Verify report and print summary
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "reuse-report"
          if (root / "version.stdout").read_text().strip() != "doppelscan 0.9.0":
              raise SystemExit("Unexpected analyzer version")
          expected = len((root / "input.sha256").read_text().splitlines())
          if expected == 0:
              raise SystemExit("No input files")
          summary = {}
          for mode in ("exact", "renamed", "near"):
              report = json.loads((root / (mode + ".stdout")).read_text())
              stats = report["summary"]
              if stats["groups"] != len(report["groups"]) or not 0 < stats["files"] <= expected:
                  raise SystemExit("Invalid scanner report: " + mode)
              if stats["files"] != expected:
                  print("::warning::Scanner excluded input files in " + mode)
              summary[mode] = stats
          result = {"commit": os.environ["SCAN_SHA"], "input_files": expected,
                    "version": "0.9.0", "modes": summary}
          (root / "summary.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps(result, sort_keys=True))
          PY
      - name: Retain audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reuse-doppelscan
          path: ${{ runner.temp }}/reuse-report/
          retention-days: 7
          if-no-files-found: warn
