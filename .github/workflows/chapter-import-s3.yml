name: TOR chapter import private S3
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  private-s3:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Start verified upstream MinIO on loopback
        run: |
          release=minio.linux-amd64.RELEASE.2025-09-07T16-13-09Z
          url=https://github.com/minio/minio/releases/download/RELEASE.2025-09-07T16-13-09Z
          curl --fail --location --silent --show-error --retry 3 \
            "$url/$release" --output "$RUNNER_TEMP/$release"
          curl --fail --location --silent --show-error --retry 3 \
            "$url/$release.sha256sum" --output "$RUNNER_TEMP/$release.sha256sum"
          expected=$(grep -Eo '[0-9a-f]{64}' "$RUNNER_TEMP/$release.sha256sum" | head -n 1)
          test "${#expected}" -eq 64
          actual=$(sha256sum "$RUNNER_TEMP/$release" | cut -d ' ' -f1)
          test "$actual" = "$expected"
          chmod 700 "$RUNNER_TEMP/$release"
          mkdir -p "$RUNNER_TEMP/tor-chapter-import-minio"
          MINIO_ROOT_USER=tor-chapter-ci-user MINIO_ROOT_PASSWORD=tor-chapter-ci-secret-only \
            nohup "$RUNNER_TEMP/$release" server "$RUNNER_TEMP/tor-chapter-import-minio" \
              --address 127.0.0.1:9000 --console-address 127.0.0.1:9001 \
              > "$RUNNER_TEMP/tor-chapter-import-minio.log" 2>&1 &
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            tail -n 80 "$RUNNER_TEMP/tor-chapter-import-minio.log"
            exit 1
          fi
      - name: Test private immutable source objects
        env:
          TOR_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          TOR_TEST_S3_ACCESS_KEY: tor-chapter-ci-user
          TOR_TEST_S3_SECRET_KEY: tor-chapter-ci-secret-only
        run: |
          cargo test -p tor-imports --features s3 \
            repositories::s3::tests::s023_private_source_put_get_conflict_and_delete \
            -- --ignored --test-threads=1
      - name: Compile and lint the S3 adapter and every target
        run: |
          cargo fmt -p tor-imports -- --check
          cargo clippy -p tor-imports --features s3 --all-targets -- -D warnings
      - name: MinIO diagnostics without object keys
        if: failure()
        run: tail -n 80 "$RUNNER_TEMP/tor-chapter-import-minio.log" || true
