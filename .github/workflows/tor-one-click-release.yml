name: "TOR — Обновить сайт"
on:
  workflow_dispatch:
    inputs:
      stage_only:
        description: "Только подготовить подписанный выпуск на VPS (без установки)"
        type: boolean
        default: false
      prepare_v2:
        description: "Только подготовить подписанный комплект v2 для первичной настройки"
        type: boolean
        default: false
      export_v2:
        description: "Экспортировать подписанный комплект v2 без подключения к VPS"
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: tor-vps-staging-single-flight
  cancel-in-progress: false

jobs:
  release:
    name: "Проверить, сохранить копию и обновить сайт"
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: tor-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      TARGET_SHA: ${{ github.sha }}
      STAGE_ONLY: ${{ inputs.stage_only }}
      PREPARE_V2: ${{ inputs.prepare_v2 }}
      EXPORT_V2: ${{ inputs.export_v2 }}
      REQUIRE_V2: ${{ vars.TOR_REQUIRE_RELEASE_V2 }}
      TOR_DEPLOY_HOST: ${{ vars.TOR_DEPLOY_HOST }}
      TOR_DEPLOY_USER: ${{ vars.TOR_DEPLOY_USER }}
    steps:
      - name: "Проверить сервер и выбранную ветку"
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$STAGE_ONLY:$PREPARE_V2:$EXPORT_V2" in
            false:false:false|true:false:false|false:true:false|false:false:true) ;;
            *) echo "Choose only one preparation/export mode" >&2; exit 1;;
          esac
          if [[ "$EXPORT_V2" == true ]]; then
            echo "TOR_RELEASE_PROTOCOL=v2" >> "$GITHUB_ENV"
          else
            [[ "$TOR_DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
            [[ "$TOR_DEPLOY_USER" == tor-deploy ]]
          fi
          echo "TOR_RELEASE_SHA $TARGET_SHA"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: "Проверить зафиксированный SHA исходников"
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]

      - name: "Дождаться успешных проверок того же коммита"
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/check_one_click_release_ci.py \
            --repo ${{ github.repository }} --sha "$TARGET_SHA" \
            --timeout-seconds 1200 --pinned-main

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: "Установить SSH с проверкой ключа сервера / Определить установленный протокол выпуска"
        if: inputs.export_v2 == false
        env:
          TOR_DEPLOY_SSH_KEY: ${{ secrets.TOR_DEPLOY_SSH_KEY }}
          TOR_DEPLOY_KNOWN_HOSTS: ${{ secrets.TOR_DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$TOR_DEPLOY_SSH_KEY" && -n "$TOR_DEPLOY_KNOWN_HOSTS" ]]
          trap 'rm -f "$RUNNER_TEMP/tor_id_ed25519" "$RUNNER_TEMP/tor_known_hosts"' EXIT
          printf '%s\n' "$TOR_DEPLOY_SSH_KEY" > "$RUNNER_TEMP/tor_id_ed25519"
          printf '%s\n' "$TOR_DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/tor_known_hosts"
          chmod 0600 "$RUNNER_TEMP/tor_id_ed25519" "$RUNNER_TEMP/tor_known_hosts"
          ssh-keygen -F "$TOR_DEPLOY_HOST" -f "$RUNNER_TEMP/tor_known_hosts" >/dev/null
          destination="$TOR_DEPLOY_USER@$TOR_DEPLOY_HOST"
          opts=(-F /dev/null -i "$RUNNER_TEMP/tor_id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/tor_known_hosts" -o ConnectTimeout=5)
          protocol=$(ssh "${opts[@]}" "$destination" '
            set -eu
            marker=/var/lib/tor-release/release-format
            helper=/usr/local/sbin/tor-one-click-release
            test -x "$helper" && test ! -L "$helper"
            test "$(stat -c "%U:%G:%a:%h" "$helper")" = root:root:755:1
            if test -e "$marker" || test -L "$marker"; then
              test -f "$marker" && test ! -L "$marker"
              test "$(stat -c "%U:%G:%a:%h" "$marker")" = root:root:644:1
              test "$(cat "$marker")" = 2
              grep -Fxq "# TOR RELEASE PROTOCOL 2" "$helper"
              printf "v2\n"
            elif grep -Fxq "# TOR RELEASE PROTOCOL 2" "$helper"; then
              printf "pending-v2\n"
            else
              printf "v1\n"
            fi
          ')
          case "$PREPARE_V2" in true|false) ;; *) exit 1;; esac
          case "$REQUIRE_V2" in ""|0|1) ;; *) exit 1;; esac
          case "$protocol" in v1|v2|pending-v2) ;; *) exit 1;; esac
          if [[ "$PREPARE_V2" == true ]]; then
            protocol=v2
          elif [[ "$protocol" == pending-v2 || ( "$REQUIRE_V2" == 1 && "$protocol" != v2 ) ]]; then
            echo "TOR_V2_SETUP_REQUIRED: no downgrade to v1" >&2
            exit 1
          fi
          echo "TOR_RELEASE_PROTOCOL=$protocol" >> "$GITHUB_ENV"
          echo "TOR_RELEASE_PROTOCOL $protocol"

      - name: "Собрать сайт, миграции и писатель трасс на GitHub"
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_feature_layout.py
          git ls-files --error-unmatch Cargo.lock
          test -s Cargo.lock
          git diff --exit-code HEAD -- Cargo.lock
          cp Cargo.lock "$RUNNER_TEMP/tor-release-input.lock"
          # Same reviewed compiled production capabilities for both protocols.
          bash tools/build_tor_production_web.sh
          cargo build --release --locked -p tor-migrations --bin tor-migrate
          cargo build --release --locked -p tor-observability --bin tor-trace-store
          cmp Cargo.lock "$RUNNER_TEMP/tor-release-input.lock"
          git ls-files --error-unmatch Cargo.lock
          git diff --exit-code HEAD -- Cargo.lock
          sha256sum Cargo.lock > "$RUNNER_TEMP/tor-release-lock.sha256"
          sha256sum target/release/tor-web | sed 's#target/release/##' \
            > "$RUNNER_TEMP/tor-web.sha256"
          sha256sum target/release/tor-migrate | sed 's#target/release/##' \
            > "$RUNNER_TEMP/tor-migrate.sha256"
          sha256sum target/release/tor-trace-store | sed 's#target/release/##' \
            > "$RUNNER_TEMP/tor-trace-store.sha256"

      - name: "Проверить реальный NGINX и откат для выбранного SHA"
        if: env.TOR_RELEASE_PROTOCOL == 'v2'
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ci_prepare_ubuntu_mirror.sh
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nginx iproute2 util-linux openssl openssh-client
          sudo unshare --net -- bash -ec 'ip link set lo up; exec python3 tests/edge/managed_edge_smoke.py' | tee "$RUNNER_TEMP/tor-v2-edge.log"

      - name: "Подписать сборку существующим ключом GitHub"
        if: env.TOR_RELEASE_PROTOCOL == 'v1' && inputs.export_v2 == false
        env:
          TOR_DEPLOY_SSH_KEY: ${{ secrets.TOR_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$RUNNER_TEMP/tor_id_ed25519"' EXIT
          test -n "$TOR_DEPLOY_SSH_KEY"
          printf '%s\n' "$TOR_DEPLOY_SSH_KEY" > "$RUNNER_TEMP/tor_id_ed25519"
          {
            printf 'TOR_RELEASE_SHA %s\n' "$TARGET_SHA"
            cat "$RUNNER_TEMP/tor-web.sha256"
            cat "$RUNNER_TEMP/tor-migrate.sha256"
            cat "$RUNNER_TEMP/tor-trace-store.sha256"
          } > "$RUNNER_TEMP/tor-release-manifest"
          ssh-keygen -Y sign -f "$RUNNER_TEMP/tor_id_ed25519" \
            -n tor-release "$RUNNER_TEMP/tor-release-manifest" >/dev/null
          test -s "$RUNNER_TEMP/tor-release-manifest.sig"

      - name: "Передать проверенную сборку на VPS без остановки сайта"
        if: env.TOR_RELEASE_PROTOCOL == 'v1' && inputs.export_v2 == false
        env:
          TOR_DEPLOY_SSH_KEY: ${{ secrets.TOR_DEPLOY_SSH_KEY }}
          TOR_DEPLOY_KNOWN_HOSTS: ${{ secrets.TOR_DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$TOR_DEPLOY_SSH_KEY" && -n "$TOR_DEPLOY_KNOWN_HOSTS" ]]
          trap 'rm -f "$RUNNER_TEMP/tor_id_ed25519" "$RUNNER_TEMP/tor_known_hosts"' EXIT
          printf '%s\n' "$TOR_DEPLOY_SSH_KEY" > "$RUNNER_TEMP/tor_id_ed25519"
          printf '%s\n' "$TOR_DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/tor_known_hosts"
          chmod 0600 "$RUNNER_TEMP/tor_id_ed25519" "$RUNNER_TEMP/tor_known_hosts"
          ssh-keygen -F "$TOR_DEPLOY_HOST" -f "$RUNNER_TEMP/tor_known_hosts" >/dev/null
          destination="$TOR_DEPLOY_USER@$TOR_DEPLOY_HOST"
          opts=(-F /dev/null -i "$RUNNER_TEMP/tor_id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/tor_known_hosts" -o ConnectTimeout=5)
          inbox="/opt/tor/incoming/$TARGET_SHA"
          ssh "${opts[@]}" "$destination" \
            "test -d /opt/tor/incoming && test -w /opt/tor/incoming && mkdir -p '$inbox' && chmod 0700 '$inbox'" || {
              echo "TOR_ONE_CLICK_SETUP_REQUIRED: run the one-time VPS bootstrap first" >&2
              exit 1
            }
          scp -p "${opts[@]}" target/release/tor-web "$destination:$inbox/tor-web"
          scp -p "${opts[@]}" target/release/tor-migrate "$destination:$inbox/tor-migrate"
          scp -p "${opts[@]}" target/release/tor-trace-store "$destination:$inbox/tor-trace-store"
          scp -p "${opts[@]}" "$RUNNER_TEMP/tor-web.sha256" "$destination:$inbox/tor-web.sha256"
          scp -p "${opts[@]}" "$RUNNER_TEMP/tor-migrate.sha256" "$destination:$inbox/tor-migrate.sha256"
          scp -p "${opts[@]}" "$RUNNER_TEMP/tor-trace-store.sha256" "$destination:$inbox/tor-trace-store.sha256"
          scp -p "${opts[@]}" "$RUNNER_TEMP/tor-release-manifest" "$destination:$inbox/tor-release-manifest"
          scp -p "${opts[@]}" "$RUNNER_TEMP/tor-release-manifest.sig" "$destination:$inbox/tor-release-manifest.sig"
          ssh "${opts[@]}" "$destination" \
            "cd '$inbox' && sha256sum -c --status tor-web.sha256 && sha256sum -c --status tor-migrate.sha256 && sha256sum -c --status tor-trace-store.sha256"
          echo "TOR_RELEASE_STAGED $TARGET_SHA"

      - name: "Собрать и подписать весь комплект v2"
        if: env.TOR_RELEASE_PROTOCOL == 'v2'
        env:
          TOR_DEPLOY_SSH_KEY: ${{ secrets.TOR_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$RUNNER_TEMP/tor_id_ed25519"' EXIT
          test -n "$TOR_DEPLOY_SSH_KEY"
          printf '%s\n' "$TOR_DEPLOY_SSH_KEY" > "$RUNNER_TEMP/tor_id_ed25519"
          python3 tools/release_bundle_v2.py build --repo . --binaries target/release --directory "$RUNNER_TEMP/tor-v2" --sha "$TARGET_SHA"
          ssh-keygen -Y sign -f "$RUNNER_TEMP/tor_id_ed25519" -n tor-release-v2 "$RUNNER_TEMP/tor-v2/tor-release-manifest-v2" >/dev/null
          printf 'tor-release ' > "$RUNNER_TEMP/tor-v2-signers"
          ssh-keygen -y -f "$RUNNER_TEMP/tor_id_ed25519" >> "$RUNNER_TEMP/tor-v2-signers"
          python3 tools/release_bundle_v2.py verify --sha "$TARGET_SHA" --signers "$RUNNER_TEMP/tor-v2-signers" --directory "$RUNNER_TEMP/tor-v2"

      - name: "Передать подписанный комплект v2"
        if: env.TOR_RELEASE_PROTOCOL == 'v2' && inputs.export_v2 == false
        env:
          TOR_DEPLOY_SSH_KEY: ${{ secrets.TOR_DEPLOY_SSH_KEY }}
          TOR_DEPLOY_KNOWN_HOSTS: ${{ secrets.TOR_DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$TOR_DEPLOY_SSH_KEY" && -n "$TOR_DEPLOY_KNOWN_HOSTS" ]]
          trap 'rm -f "$RUNNER_TEMP/tor_id_ed25519" "$RUNNER_TEMP/tor_known_hosts"' EXIT
          printf '%s\n' "$TOR_DEPLOY_SSH_KEY" > "$RUNNER_TEMP/tor_id_ed25519"
          printf '%s\n' "$TOR_DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/tor_known_hosts"
          chmod 0600 "$RUNNER_TEMP/tor_id_ed25519" "$RUNNER_TEMP/tor_known_hosts"
          ssh-keygen -F "$TOR_DEPLOY_HOST" -f "$RUNNER_TEMP/tor_known_hosts" >/dev/null
          destination="$TOR_DEPLOY_USER@$TOR_DEPLOY_HOST"
          opts=(-F /dev/null -i "$RUNNER_TEMP/tor_id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/tor_known_hosts" -o ConnectTimeout=5)
          inbox="/opt/tor/incoming/v2/$TARGET_SHA"
          ssh "${opts[@]}" "$destination" "umask 077; test -d /opt/tor/incoming && test -w /opt/tor/incoming && mkdir -p '$inbox' && test ! -L '$inbox' && chmod 0700 '$inbox'"
          scp -p "${opts[@]}" "$RUNNER_TEMP/tor-v2/"* "$destination:$inbox/"
          echo "TOR_V2_STAGED $TARGET_SHA"

      - name: "Повторно проверить CI и принадлежность выпуска main"
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/check_one_click_release_ci.py \
            --repo ${{ github.repository }} --sha "$TARGET_SHA" \
            --timeout-seconds 0 --pinned-main

      - name: "Резервная копия PostgreSQL, миграции, обновление и откат при ошибке"
        if: inputs.prepare_v2 == false && inputs.export_v2 == false && inputs.stage_only == false
        env:
          TOR_DEPLOY_SSH_KEY: ${{ secrets.TOR_DEPLOY_SSH_KEY }}
          TOR_DEPLOY_KNOWN_HOSTS: ${{ secrets.TOR_DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$TOR_DEPLOY_SSH_KEY" && -n "$TOR_DEPLOY_KNOWN_HOSTS" ]]
          trap 'rm -f "$RUNNER_TEMP/tor_id_ed25519" "$RUNNER_TEMP/tor_known_hosts"' EXIT
          printf '%s\n' "$TOR_DEPLOY_SSH_KEY" > "$RUNNER_TEMP/tor_id_ed25519"
          printf '%s\n' "$TOR_DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/tor_known_hosts"
          chmod 0600 "$RUNNER_TEMP/tor_id_ed25519" "$RUNNER_TEMP/tor_known_hosts"
          ssh-keygen -F "$TOR_DEPLOY_HOST" -f "$RUNNER_TEMP/tor_known_hosts" >/dev/null
          destination="$TOR_DEPLOY_USER@$TOR_DEPLOY_HOST"
          opts=(-F /dev/null -i "$RUNNER_TEMP/tor_id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/tor_known_hosts" -o ConnectTimeout=5)
          if [[ "$TOR_RELEASE_PROTOCOL" == v2 ]]; then
            ssh "${opts[@]}" "$destination" "grep -Fxq '# TOR RELEASE PROTOCOL 2' /usr/local/sbin/tor-one-click-release && test \"\$(cat /var/lib/tor-release/release-format)\" = 2 && sudo -n /usr/local/sbin/tor-one-click-release '$TARGET_SHA'" | tee "$RUNNER_TEMP/tor-v2-deploy.log"
            grep -Fxq "TOR_ONE_CLICK_RELEASE_V2_OK $TARGET_SHA" "$RUNNER_TEMP/tor-v2-deploy.log" ||
              grep -Fxq "TOR_V2_ALREADY_ACTIVE $TARGET_SHA" "$RUNNER_TEMP/tor-v2-deploy.log"
          else
            ssh "${opts[@]}" "$destination" \
              "test -x /usr/local/sbin/tor-one-click-release || { echo TOR_ONE_CLICK_SETUP_REQUIRED; exit 2; }; sudo -n /usr/local/sbin/tor-one-click-release '$TARGET_SHA'"
          fi

      - name: "Проверить установленный SHA, службу и HTTPS"
        if: inputs.prepare_v2 == false && inputs.export_v2 == false && inputs.stage_only == false
        env:
          TOR_DEPLOY_SSH_KEY: ${{ secrets.TOR_DEPLOY_SSH_KEY }}
          TOR_DEPLOY_KNOWN_HOSTS: ${{ secrets.TOR_DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$TOR_DEPLOY_SSH_KEY" && -n "$TOR_DEPLOY_KNOWN_HOSTS" ]]
          trap 'rm -f "$RUNNER_TEMP/tor_id_ed25519" "$RUNNER_TEMP/tor_known_hosts"' EXIT
          printf '%s\n' "$TOR_DEPLOY_SSH_KEY" > "$RUNNER_TEMP/tor_id_ed25519"
          printf '%s\n' "$TOR_DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/tor_known_hosts"
          chmod 0600 "$RUNNER_TEMP/tor_id_ed25519" "$RUNNER_TEMP/tor_known_hosts"
          ssh-keygen -F "$TOR_DEPLOY_HOST" -f "$RUNNER_TEMP/tor_known_hosts" >/dev/null
          destination="$TOR_DEPLOY_USER@$TOR_DEPLOY_HOST"
          opts=(-F /dev/null -i "$RUNNER_TEMP/tor_id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/tor_known_hosts" -o ConnectTimeout=5)
          ssh "${opts[@]}" "$destination" \
            "test \"\$(readlink -f /opt/tor/current)\" = '/opt/tor/releases/$TARGET_SHA' &&
             systemctl is-active --quiet tor-web.service &&
             test \"\$(curl --disable -fsS --noproxy '*' --max-time 5 http://127.0.0.1:3000/readyz)\" = ok &&
             test \"\$(cat /var/lib/tor-release/pg-activated)\" = PG_ACTIVATED"
          if [[ "$TOR_RELEASE_PROTOCOL" == v2 ]]; then
            ssh "${opts[@]}" "$destination" "test \"\$(readlink -f /var/lib/tor-edge/current)\" = '/var/lib/tor-edge/releases/$TARGET_SHA' &&
             test \"\$(curl --disable -fsS --noproxy '*' --max-time 5 --resolve pandaolate.ru:443:127.0.0.1 https://pandaolate.ru/readyz)\" = ok"
          fi
          echo "TOR_DEPLOYED_OK $TARGET_SHA"

      - name: "Подтвердить подготовку без установки"
        if: inputs.stage_only == true
        run: echo "TOR_STAGE_ONLY_OK $TARGET_SHA (no deployment)"

      - name: "Подготовка v2 завершена без обновления"
        if: inputs.prepare_v2 == true && inputs.export_v2 == false
        run: echo "TOR_V2_PREPARED_ONLY $TARGET_SHA"

      - name: "Проверить автономный импорт подписанного выпуска"
        if: inputs.export_v2 == true
        shell: bash
        run: |
          set -euo pipefail
          pin=$(sha256sum "$RUNNER_TEMP/tor-v2/tor-release-manifest-v2" | cut -d' ' -f1)
          printf '%s\n' "$pin" > "$RUNNER_TEMP/tor-v2-manifest-pin"
          sha256sum "$RUNNER_TEMP/tor-v2-signers" | cut -d' ' -f1 > "$RUNNER_TEMP/tor-v2-signers-pin"
          python3 tools/import_offline_release.py --source "$RUNNER_TEMP/tor-v2" --directory "$RUNNER_TEMP/tor-offline-v2" --sha "$TARGET_SHA" --signers "$RUNNER_TEMP/tor-v2-signers" --manifest-sha256 "$pin"
          echo "TOR_V2_EXPORT_ONLY $TARGET_SHA manifest_sha256=$pin deployment=none"

      - name: "Сохранить полный автономный выпуск v2"
        if: inputs.export_v2 == true
        uses: actions/upload-artifact@v4
        with:
          name: tor-offline-v2-${{ github.sha }}
          path: ${{ runner.temp }}/tor-offline-v2/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

      - name: "Сохранить контрольные суммы выпуска"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tor-one-click-${{ github.sha }}
          path: |
            ${{ runner.temp }}/tor-web.sha256
            ${{ runner.temp }}/tor-migrate.sha256
            ${{ runner.temp }}/tor-trace-store.sha256
            ${{ runner.temp }}/tor-release-lock.sha256
            ${{ runner.temp }}/tor-v2/tor-release-manifest-v2
            ${{ runner.temp }}/tor-v2/tor-release-manifest-v2.sig
            ${{ runner.temp }}/tor-v2-edge.log
            ${{ runner.temp }}/tor-v2-manifest-pin
            ${{ runner.temp }}/tor-v2-signers
            ${{ runner.temp }}/tor-v2-signers-pin
          if-no-files-found: warn
          retention-days: 14
