name: Rust G image pipeline
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-g-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  select:
    uses: ./.github/workflows/ci-selection.yml
    with:
      caller: image
  image:
    needs: select
    if: ${{ !cancelled() && (needs.select.result != 'success' || fromJSON(needs.select.outputs.suites || '{"image":true}').image) }}
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format G image crate
        run: cargo fmt --package tor-ingest -- --check
      - name: Real JPEG/PNG/WebP + adversarial unit tests
        run: cargo test -p tor-ingest --all-targets
      - name: Clippy G only
        run: cargo clippy -p tor-ingest --all-targets -- -D warnings
      - name: Compile S3 adapter (AWS SDK, no credentials)
        run: cargo check -p tor-ingest --features s3
