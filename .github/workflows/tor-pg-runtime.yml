          cargo test -p tor-web --test chapter_thanks_http_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test book_stats_http_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test book_likes_http_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test book_comments_http_pg e_02_ -- --ignored --test-threads=1
          cargo test -p tor-web --test paid_grants_http_pg -- --ignored --nocapture --test-threads=1
          TOR_RIL_SINGLE_INSTANCE=1 TOR_FLOW_PUBLIC_OPT_IN_ENABLED=1 \
            TOR_RIL_HMAC_KEY="$(printf '4f%.0s' {1..32})" \
            cargo test -p tor-web --test ril_behavior_consent_pg -- --ignored --test-threads=1
          ci_pg_phase_done "http_security"

      - name: D-04 real HTTP and PostgreSQL sessions (flag off then on)
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          TOR_LISTEN_ADDR: 127.0.0.1:3098
          TOR_AUTH_ENABLED: '1'
          TOR_PUBLIC_ORIGIN: http://127.0.0.1:3098
        run: |
          set -euo pipefail
          cargo build -p tor-web
          TOR_PAID_CHECKOUT_ENABLED=0 ./target/debug/tor-web > "$RUNNER_TEMP/tor-d04-disabled.log" 2>&1 &
          disabled_pid=$!
          enabled_pid=""
          trap 'kill "$disabled_pid" "${enabled_pid:-}" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3098/readyz >/dev/null; then ready=1; break; fi
            if ! kill -0 "$disabled_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat "$RUNNER_TEMP/tor-d04-disabled.log"; exit 1; fi
          python3 tools/checkout_http_pg_smoke.py --mode disabled
          kill "$disabled_pid"
          wait "$disabled_pid" || true
          TOR_PAID_CHECKOUT_ENABLED=1 ./target/debug/tor-web > "$RUNNER_TEMP/tor-d04-enabled.log" 2>&1 &
          enabled_pid=$!
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3098/readyz >/dev/null; then ready=1; break; fi
            if ! kill -0 "$enabled_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat "$RUNNER_TEMP/tor-d04-enabled.log"; exit 1; fi
          python3 tools/checkout_http_pg_smoke.py --mode enabled
      - name: I-11 PostgreSQL outage, restart and durable public data
        env:
          GITHUB_ACTIONS: 'true'
        run: |
          # The D-04 step already built this exact debug binary in this job.
          test -x ./target/debug/tor-web
          bash tools/tor_pg_restart_smoke.sh
      - name: I-11 PostgreSQL 18 backup and clean restore drill
        env:
          GITHUB_ACTIONS: 'true'
        run: |
          # Reuse the verified binary without two additional Cargo invocations.
          test -x ./target/debug/tor-web
          bash tools/tor_pg_backup_restore_smoke.sh
      - name: S061 build previous binary (manual opt-in only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.s061_previous_sha != '' }}
        env:
          PREVIOUS_SHA: ${{ inputs.s061_previous_sha }}
        run: |
          set -euo pipefail
          [[ "$PREVIOUS_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PREVIOUS_SHA" != "$(git rev-parse HEAD)" ]]
          # Checkout uses a shallow clone. Restore ancestry only for this
          # optional manual drill; never pay this cost in normal CI.
          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
            git fetch --no-tags --unshallow origin main
          fi
          git fetch --no-tags origin "$PREVIOUS_SHA"
          git merge-base --is-ancestor "$PREVIOUS_SHA" "$(git rev-parse HEAD)"
          git worktree add --detach "$RUNNER_TEMP/s061-previous-source" "$PREVIOUS_SHA"
          CARGO_TARGET_DIR="$RUNNER_TEMP/s061-previous-target" \
            cargo build --manifest-path "$RUNNER_TEMP/s061-previous-source/Cargo.toml" \
            -p tor-web --bin tor-web
          install -m 700 "$RUNNER_TEMP/s061-previous-target/debug/tor-web" \
            "$RUNNER_TEMP/s061-previous-tor-web"
      - name: S061 real candidate cutover, rejection and rollback (disposable PostgreSQL)
        env:
          GITHUB_ACTIONS: 'true'
          TOR_S061_PREVIOUS_BINARY: ${{ github.event_name == 'workflow_dispatch' && inputs.s061_previous_sha != '' && format('{0}/s061-previous-tor-web', runner.temp) || '' }}
        run: |
          # Use the existing D-04 binary; build a second only for manual two-SHA tests.
          test -x ./target/debug/tor-web
          python3 tools/s061_cutover_pg_smoke.py
      - name: Preserve S061 real cutover evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s061-real-cutover-pg
          path: ${{ runner.temp }}/s061-real-cutover/report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Line A credential and login audit PostgreSQL checks
        run: |
          cargo test -p tor-web --test password_change_http_pg a_07_ -- --ignored --test-threads=1
          cargo test -p tor-social --test slices_pg e_08_ -- --ignored --test-threads=1
          cargo test -p tor-social --test chapter_release_notifications_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test mail_http_pg e_08_ -- --ignored --test-threads=1
          # All four test targets share the same crate and test flags;
          # Cargo still executes each complete target, with one frontend invocation.
          cargo test -p tor-accounts --test access_audit_pg --test auth_observation_pg --test credentials_pg --test slices_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test moderation_books_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test account_settings_http_pg -- --ignored --test-threads=1
          cargo test -p tor-reading --test notification_preferences_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test account_access_audit_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test account_sessions_http_pg a_03_ -- --ignored --test-threads=1
      - name: D-04 diagnostic HTTP logs
        if: failure()
        run: |
          tail -n 100 "$RUNNER_TEMP/tor-d04-disabled.log" 2>/dev/null || true
          tail -n 100 "$RUNNER_TEMP/tor-d04-enabled.log" 2>/dev/null || true
