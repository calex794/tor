name: TOR PostgreSQL runtime
on:
  workflow_dispatch:
    inputs:
      s061_previous_sha:
        description: 'Optional previous TOR SHA for the populated-schema upgrade and rollback drill'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  select:
    uses: ./.github/workflows/ci-selection.yml
    with:
      caller: postgres
  postgres-runtime:
    needs: select
    if: ${{ !cancelled() && (needs.select.result != 'success' || fromJSON(needs.select.outputs.suites || '{"postgres":true}').postgres) }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [foundation, reading, commerce]
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.s061_previous_sha != '' && 75 || 30 }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: tor-ci-postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI_PG_SHARD: ${{ matrix.shard }}
      # CI-only: full SQLx integration links many tor-web test binaries.
      # Avoid debug DWARF and incremental artifacts exhausting runner disk.
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: tor-ci-postgres
      TEST_DATABASE_URL: postgresql://tor_app:tor-ci-app@127.0.0.1:5432/tor_ci
      MIGRATOR_URL: postgresql://tor_migrator:tor-ci-migrate@127.0.0.1:5432/tor_ci
      LEGACY_ANALYTICS_DATABASE_URL: postgresql://tor_app:tor-ci-app@127.0.0.1:5432/tor_ci_legacy_analytics
      LEGACY_ANALYTICS_MIGRATOR_URL: postgresql://tor_migrator:tor-ci-migrate@127.0.0.1:5432/tor_ci_legacy_analytics
      COLLECTION_RETIREMENT_UPGRADE_DATABASE_URL: postgresql://tor_migrator:tor-ci-migrate@127.0.0.1:5432/tor_ci_collection_retirement_upgrade
      COLLECTION_RETIREMENT_APP_DATABASE_URL: postgresql://tor_app:tor-ci-app@127.0.0.1:5432/tor_ci_collection_retirement_upgrade
      COLLECTION_RETIREMENT_STARTUP_MIGRATOR_URL: postgresql://tor_migrator:tor-ci-migrate@127.0.0.1:5432/tor_ci_collection_retirement_startup
      COLLECTION_RETIREMENT_STARTUP_APP_DATABASE_URL: postgresql://tor_app:tor-ci-app@127.0.0.1:5432/tor_ci_collection_retirement_startup
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: postgres-runtime-no-debug-v1
      - name: Disk usage after cache restore
        run: |
          df -h . "$RUNNER_TEMP"
          du -sh target target/debug/deps target/debug/incremental 2>/dev/null || true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Chromium for S037 swap acceptance
        run: |
          # PG jobs use the default headless browser; unlike pixel-layout jobs,
          # they do not install headed Chromium or fetch optional font packs.
          # The full PostgreSQL/HTTP/Chromium regression still runs below.
          bash tools/ci_prepare_chromium.sh install
      - name: PostgreSQL client
        run: |
          # GitHub ubuntu-24.04 typically includes psql and pg_isready already.
          # Fall back to apt if a future runner image removes either binary.
          bash tools/ci_prepare_pg_client.sh
      - name: Create isolated roles and database
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE tor_migrator LOGIN PASSWORD 'tor-ci-migrate';
          CREATE ROLE tor_app LOGIN PASSWORD 'tor-ci-app';
          CREATE DATABASE tor_ci OWNER tor_migrator;
          SQL
          psql -X -v ON_ERROR_STOP=1 -d tor_ci <<'SQL'
          REVOKE ALL ON DATABASE tor_ci FROM PUBLIC;
          GRANT CONNECT ON DATABASE tor_ci TO tor_app;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          GRANT USAGE ON SCHEMA public TO tor_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE tor_migrator IN SCHEMA public
            GRANT SELECT,INSERT,UPDATE,DELETE ON TABLES TO tor_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE tor_migrator IN SCHEMA public
            GRANT USAGE,SELECT ON SEQUENCES TO tor_app;
          SQL
      - name: Feature boundary checks
        run: python3 tools/check_feature_layout.py
      # The Rust S0 suite owns automatic workspace fmt/test/Clippy for every main SHA.
      # Preserve the full workspace baseline for standalone manual dispatches.
      - name: Standalone manual workspace baseline
        if: ${{ github.event_name == 'workflow_dispatch' && matrix.shard == 'foundation' }}
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
      # Keep the same lint in standalone PostgreSQL and PG-only runs.
      # When Rust and PostgreSQL both run, Rust owns the single lint invocation.
      - name: Combined S3 feature Clippy
        if: ${{ (github.workflow != 'TOR integration CI' || needs.select.result != 'success' || !fromJSON(needs.select.outputs.suites || '{"rust":false}').rust) && matrix.shard == 'foundation' }}
        run: cargo clippy -p tor-web --all-targets --features 's3-covers,s3-paid,s3-free,s3-chapter-import' -- -D warnings
      - name: Apply SQLx migrations twice
        run: |
          DATABASE_URL="$MIGRATOR_URL" cargo run -p tor-migrations --bin tor-migrate
          DATABASE_URL="$MIGRATOR_URL" cargo run -p tor-migrations --bin tor-migrate
      - name: DROP-08b compile restored-PG historical pin export and refuse empty evidence
        if: ${{ matrix.shard == 'foundation' }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/drop08-pins.csv"
          psql -Xq --no-password --dbname "$TEST_DATABASE_URL" \
            -f tools/drop08_export_historical_free_pins.sql > "$out"
          test ! -s "$out"
          set +e
          python3 tools/drop08_verify_historical_free_pins.py < "$out" > "$RUNNER_TEMP/drop08-result" 2>&1
          code=$?
          set -e
          test "$code" -eq 2
          grep -q 'requires exercised saved and Layer' "$RUNNER_TEMP/drop08-result"
          bash tools/drop08_pg_fixture_ci.sh
      - name: Native HTML quality on the fresh schema
        if: ${{ matrix.shard == 'foundation' }}
        env:
          TOR_AUDIENCE_SHOTS: ${{ runner.temp }}/rec13-browser/shots
          TOR_HTML_HEALTH_LOG: ${{ runner.temp }}/rec13-browser/server-html-health.log
          TOR_FLOW_EMIT_SCREENSHOTS: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/rec13-browser"
          cargo build -p tor-web
          bash tools/flow_html_health_browser_acceptance.sh
      - name: FLOW catalogue index migration and recovery (disposable databases)
        if: ${{ matrix.shard == 'foundation' }}
        run: |
          psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          CREATE DATABASE tor_ci_flow_index_fresh OWNER tor_migrator;
          CREATE DATABASE tor_ci_flow_index_upgrade OWNER tor_migrator;
          CREATE DATABASE tor_ci_flow_index_invalid OWNER tor_migrator;
          CREATE DATABASE tor_ci_flow_index_unrecorded OWNER tor_migrator;
          SQL
          FLOW_BOOK_INDEX_MIGRATOR_URL="${MIGRATOR_URL%/tor_ci}/tor_ci_flow_index_fresh" \
            cargo test -p tor-migrations --test flow_book_indexes_pg -- --ignored --test-threads=1 --nocapture
      - name: E-08 baseline-to-Draft installed SQLx ledger upgrade (disposable database)
        if: ${{ matrix.shard == 'foundation' }}
        run: |
          psql -X -v ON_ERROR_STOP=1 -d postgres -c 'CREATE DATABASE tor_ci_e08_upgrade OWNER tor_migrator'
          E08_UPGRADE_DATABASE_URL='postgresql://tor_migrator:tor-ci-migrate@127.0.0.1:5432/tor_ci_e08_upgrade' \
            cargo test -p tor-migrations --test e08_installed_upgrade_pg -- --ignored --test-threads=1
      - name: REC explicit preferences installed upgrade (disposable database)
        if: ${{ matrix.shard == 'foundation' }}
        run: |
          psql -X -v ON_ERROR_STOP=1 -d postgres -c 'CREATE DATABASE tor_ci_rec_preferences_upgrade OWNER tor_migrator'
          REC_PREFERENCES_UPGRADE_DATABASE_URL='postgresql://tor_migrator:tor-ci-migrate@127.0.0.1:5432/tor_ci_rec_preferences_upgrade' \
            cargo test -p tor-migrations --test rec_preferences_installed_upgrade_pg -- --ignored --test-threads=1
      - name: Prepare explicit legacy and installed-upgrade analytics databases
        run: |
          bash tools/ci_prepare_legacy_analytics.sh
          cargo test -p tor-migrations --test legacy_analytics_baseline_pg -- --ignored --test-threads=1
          cargo test -p tor-migrations --test collection_retirement_startup_baseline_pg -- --ignored --test-threads=1
      - name: Installed 190 to current analytics retirement with canonical and preference preservation
        run: cargo test -p tor-migrations --test collection_retirement_installed_upgrade_pg -- --ignored --test-threads=1 --nocapture
      - name: Reject app role as migrator and DDL writer
        if: ${{ matrix.shard == 'foundation' }}
        run: |
          if DATABASE_URL="$TEST_DATABASE_URL" cargo run -p tor-migrations --bin tor-migrate; then exit 1; fi
          if PGPASSWORD=tor-ci-app PGUSER=tor_app PGDATABASE=tor_ci psql -X -v ON_ERROR_STOP=1 -c 'CREATE TABLE forbidden (x int)'; then exit 1; fi
      - name: Seed visible and hidden rows
        run: |
          PGPASSWORD=tor-ci-app PGUSER=tor_app PGDATABASE=tor_ci psql -X -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO books(id,source_identity,target_language,title,visibility,access_level)
          VALUES (1,'ci:1','ru','TOR CI public','public','basic'),
                 (2,'ci:2','ru','TOR CI hidden','draft','basic'),
                 (3,'ci:3','ru','TOR CI held','public','basic');
          UPDATE books SET admin_hold=true WHERE id=3;
          -- Author/genre fixtures cover public, hidden and held rows with identical metadata.
          UPDATE books SET author_name='Жюль', genres=ARRAY['фэнтези','приключения']
          WHERE id IN (1,2,3);
          SQL
      - name: Seed G-07/G-09 owned cover job fixtures
        run: |
          PGPASSWORD=tor-ci-app PGUSER=tor_app PGDATABASE=tor_ci psql -X -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO users(id,email_normalized,display_name,password_hash)
          OVERRIDING SYSTEM VALUE
          SELECT id,'cover-'||id||'@example.invalid','CI Cover Owner','$argon2id$test'
            FROM generate_series(901,905) AS id;
          INSERT INTO books(id,source_identity,target_language,title,visibility,owner_user_id,access_level)
          SELECT id,'ci:cover:'||id,'ru','CI owned cover book','public',id,'basic'
            FROM generate_series(901,905) AS id;
          SQL
      - name: Seed published free and protected chapters
        run: |
          PGPASSWORD=tor-ci-app PGUSER=tor_app PGDATABASE=tor_ci psql -X -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO chapters (id, book_id, chapter_no, title, visibility, access_level, price_amount, reader_released_at)
          VALUES
            (101, 1, 1, 'Начало истории', 'public', 'free', 0, NULL),
            (102, 1, 2, 'Секретный черновик', 'draft', 'free', 0, NULL),
            (103, 1, 3, 'Платная глава', 'public', 'paid', 250, NULL),
            (104, 2, 1, 'Глава скрытой книги', 'public', 'free', 0, NULL),
            (105, 3, 1, 'Глава заблокированной книги', 'public', 'free', 0, NULL),
            (106, 1, 4, 'Запланированная глава', 'public', 'free', 0, now() + INTERVAL '1 day'),
            (107, 1, 5, 'Глава на модерации', 'public', 'free', 0, NULL),
            (108, 1, 6, 'Продолжение', 'public', 'free', 0, NULL);
          UPDATE chapters SET admin_hold=true WHERE id=107;
          INSERT INTO chapter_versions (id, chapter_id, version_no, body_markdown)
          VALUES
            (201, 101, 1, '**Первая строка** и <script>alert(1)</script>'),
            (202, 102, 1, 'PRIVATE-DRAFT-MARKER'),
            (203, 103, 1, 'PRIVATE-PAID-MARKER'),
            (204, 104, 1, 'PRIVATE-BOOK-MARKER'),
            (205, 105, 1, 'PRIVATE-HOLD-MARKER'),
            (206, 106, 1, 'PRIVATE-FUTURE-MARKER'),
            (207, 107, 1, 'PRIVATE-MODERATED-MARKER'),
            (208, 108, 1, 'Текст следующей опубликованной главы');
          INSERT INTO chapter_publications(chapter_id, version_id)
          VALUES (101,201),(102,202),(103,203),(104,204),
                 (105,205),(106,206),(107,207),(108,208);
          SQL
      - name: Advance explicit-ID fixture sequences as schema owner
        run: |
          # Explicit IDs in CI fixtures do not advance PostgreSQL sequences.
          # Fix all seeded entities before running tests that INSERT default IDs.
          PGPASSWORD=tor-ci-migrate PGUSER=tor_migrator PGDATABASE=tor_ci psql -X -v ON_ERROR_STOP=1 <<'SQL'
          SELECT setval(pg_get_serial_sequence('users','id'), GREATEST((SELECT max(id) FROM users),1), true);
          SELECT setval(pg_get_serial_sequence('books','id'), GREATEST((SELECT max(id) FROM books),1), true);
          SELECT setval(pg_get_serial_sequence('chapters','id'), GREATEST((SELECT max(id) FROM chapters),1), true);
          SELECT setval(pg_get_serial_sequence('chapter_versions','id'), GREATEST((SELECT max(id) FROM chapter_versions),1), true);
          SQL
      - name: Database and HTTP integration
        run: bash tools/ci_pg_runtime_acceptance.sh

      - name: Disk usage after database and HTTP integration
        run: |
          df -h . "$RUNNER_TEMP"
          du -sh target target/debug/deps target/debug/incremental 2>/dev/null || true
      - name: D-04 real HTTP and PostgreSQL sessions (flag off then on)
        if: ${{ matrix.shard == 'foundation' }}
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          TOR_LISTEN_ADDR: 127.0.0.1:3098
          TOR_AUTH_ENABLED: '1'
          TOR_PUBLIC_ORIGIN: http://127.0.0.1:3098
        run: |
          set -euo pipefail
          test -x ./target/debug/tor-web
          TOR_PAID_CHECKOUT_ENABLED=0 ./target/debug/tor-web > "$RUNNER_TEMP/tor-d04-disabled.log" 2>&1 &
          disabled_pid=$!
          enabled_pid=""
          trap 'kill "$disabled_pid" "${enabled_pid:-}" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3098/readyz >/dev/null; then ready=1; break; fi
            if ! kill -0 "$disabled_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat "$RUNNER_TEMP/tor-d04-disabled.log"; exit 1; fi
          python3 tools/checkout_http_pg_smoke.py --mode disabled
          kill "$disabled_pid"
          wait "$disabled_pid" || true
          TOR_PAID_CHECKOUT_ENABLED=1 ./target/debug/tor-web > "$RUNNER_TEMP/tor-d04-enabled.log" 2>&1 &
          enabled_pid=$!
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3098/readyz >/dev/null; then ready=1; break; fi
            if ! kill -0 "$enabled_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat "$RUNNER_TEMP/tor-d04-enabled.log"; exit 1; fi
          python3 tools/checkout_http_pg_smoke.py --mode enabled
      - name: I-11 PostgreSQL outage, restart and durable public data
        if: ${{ matrix.shard == 'foundation' }}
        env:
          GITHUB_ACTIONS: 'true'
        run: |
          # Fresh-schema HTML acceptance already built this exact debug binary.
          test -x ./target/debug/tor-web
          bash tools/tor_pg_restart_smoke.sh
      - name: I-11 PostgreSQL 18 backup and clean restore drill
        if: ${{ matrix.shard == 'foundation' }}
        env:
          GITHUB_ACTIONS: 'true'
        run: |
          # Reuse the verified binary without two additional Cargo invocations.
          test -x ./target/debug/tor-web
          bash tools/tor_pg_backup_restore_smoke.sh
      - name: S061 build previous binary (manual opt-in only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.s061_previous_sha != '' && matrix.shard == 'foundation' }}
        env:
          PREVIOUS_SHA: ${{ inputs.s061_previous_sha }}
        run: |
          set -euo pipefail
          [[ "$PREVIOUS_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PREVIOUS_SHA" != "$(git rev-parse HEAD)" ]]
          # Checkout uses a shallow clone. Restore ancestry only for this
          # optional manual drill; never pay this cost in normal CI.
          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
            git fetch --no-tags --unshallow origin main
          fi
          git fetch --no-tags origin "$PREVIOUS_SHA"
          git merge-base --is-ancestor "$PREVIOUS_SHA" "$(git rev-parse HEAD)"
          git worktree add --detach "$RUNNER_TEMP/s061-previous-source" "$PREVIOUS_SHA"
          CARGO_TARGET_DIR="$RUNNER_TEMP/s061-previous-target" \
            cargo build --manifest-path "$RUNNER_TEMP/s061-previous-source/Cargo.toml" \
            -p tor-web --bin tor-web --features s3-free -p tor-migrations --bin tor-migrate
          install -m 700 "$RUNNER_TEMP/s061-previous-target/debug/tor-web" \
            "$RUNNER_TEMP/s061-previous-tor-web"
          install -m 700 "$RUNNER_TEMP/s061-previous-target/debug/tor-migrate" \
            "$RUNNER_TEMP/s061-previous-tor-migrate"
          test -x ./target/debug/tor-migrate
          cargo build -p tor-web --bin tor-web --features s3-free
      - name: S061 start private loopback MinIO for the saved reader
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.s061_previous_sha != '' && matrix.shard == 'foundation' }}
        run: bash tools/s061_start_minio.sh
      - name: S061 real candidate cutover, rejection and rollback (disposable PostgreSQL)
        if: ${{ matrix.shard == 'foundation' }}
        env:
          GITHUB_ACTIONS: 'true'
          TOR_S061_PREVIOUS_BINARY: ${{ github.event_name == 'workflow_dispatch' && inputs.s061_previous_sha != '' && format('{0}/s061-previous-tor-web', runner.temp) || '' }}
          TOR_S061_PREVIOUS_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.s061_previous_sha || '' }}
          TOR_S061_S3_ENDPOINT: ${{ github.event_name == 'workflow_dispatch' && inputs.s061_previous_sha != '' && 'http://127.0.0.1:9012' || '' }}
        run: |
          # Reuse this job's accepted binary; build a second only for manual two-SHA tests.
          test -x ./target/debug/tor-web
          python3 tools/s061_cutover_pg_smoke.py
      - name: Preserve S061 real cutover evidence
        if: ${{ always() && matrix.shard == 'foundation' }}
        uses: actions/upload-artifact@v4
        with:
          name: s061-real-cutover-pg
          path: ${{ runner.temp }}/s061-real-cutover/report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Line A credential and login audit PostgreSQL checks
        if: ${{ matrix.shard == 'foundation' }}
        run: |
          cargo test -p tor-web --test password_change_http_pg a_07_ -- --ignored --test-threads=1
          cargo test -p tor-social --test slices_pg e_08_ -- --ignored --test-threads=1
          cargo test -p tor-social --test chapter_release_notifications_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test mail_http_pg e_08_ -- --ignored --test-threads=1
          # All four test targets share the same crate and test flags;
          # Cargo still executes each complete target, with one frontend invocation.
          cargo test -p tor-accounts --test access_audit_pg --test auth_observation_pg --test credentials_pg --test slices_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test moderation_books_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test account_settings_http_pg -- --ignored --test-threads=1
          cargo test -p tor-reading --test notification_preferences_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test account_access_audit_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test account_sessions_http_pg a_03_ -- --ignored --test-threads=1
      - name: D-04 diagnostic HTTP logs
        if: ${{ failure() && matrix.shard == 'foundation' }}
        run: |
          tail -n 100 "$RUNNER_TEMP/tor-d04-disabled.log" 2>/dev/null || true
          tail -n 100 "$RUNNER_TEMP/tor-d04-enabled.log" 2>/dev/null || true
      - name: Final PostgreSQL runner disk usage
        if: ${{ always() }}
        run: |
          df -h . "$RUNNER_TEMP"
          du -sh target target/debug/deps target/debug/incremental 2>/dev/null || true
