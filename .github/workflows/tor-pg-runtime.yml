name: TOR PostgreSQL runtime
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  select:
    uses: ./.github/workflows/ci-selection.yml
    with:
      caller: postgres
  postgres-runtime:
    needs: select
    if: ${{ !cancelled() && (needs.select.result != 'success' || fromJSON(needs.select.outputs.suites || '{"postgres":true}').postgres) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: tor-ci-postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: tor-ci-postgres
      TEST_DATABASE_URL: postgresql://tor_app:tor-ci-app@127.0.0.1:5432/tor_ci
      MIGRATOR_URL: postgresql://tor_migrator:tor-ci-migrate@127.0.0.1:5432/tor_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Create isolated roles and database
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE tor_migrator LOGIN PASSWORD 'tor-ci-migrate';
          CREATE ROLE tor_app LOGIN PASSWORD 'tor-ci-app';
          CREATE DATABASE tor_ci OWNER tor_migrator;
          SQL
          psql -X -v ON_ERROR_STOP=1 -d tor_ci <<'SQL'
          REVOKE ALL ON DATABASE tor_ci FROM PUBLIC;
          GRANT CONNECT ON DATABASE tor_ci TO tor_app;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          GRANT USAGE ON SCHEMA public TO tor_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE tor_migrator IN SCHEMA public
            GRANT SELECT,INSERT,UPDATE,DELETE ON TABLES TO tor_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE tor_migrator IN SCHEMA public
            GRANT USAGE,SELECT ON SEQUENCES TO tor_app;
          SQL
      - name: Format and unit tests
        run: |
          python3 tools/check_feature_layout.py
          cargo fmt --all -- --check
          cargo test --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p tor-web --all-targets --features 's3-covers,s3-paid' -- -D warnings
      - name: Apply SQLx migrations twice
        run: |
          DATABASE_URL="$MIGRATOR_URL" cargo run -p tor-migrations --bin tor-migrate
          DATABASE_URL="$MIGRATOR_URL" cargo run -p tor-migrations --bin tor-migrate
      - name: Reject app role as migrator and DDL writer
        run: |
          if DATABASE_URL="$TEST_DATABASE_URL" cargo run -p tor-migrations --bin tor-migrate; then exit 1; fi
          if PGPASSWORD=tor-ci-app PGUSER=tor_app PGDATABASE=tor_ci psql -X -v ON_ERROR_STOP=1 -c 'CREATE TABLE forbidden (x int)'; then exit 1; fi
      - name: Seed visible and hidden rows
        run: |
          PGPASSWORD=tor-ci-app PGUSER=tor_app PGDATABASE=tor_ci psql -X -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO books(id,source_identity,target_language,title,visibility)
          VALUES (1,'ci:1','ru','TOR CI public','public'),
                 (2,'ci:2','ru','TOR CI hidden','draft'),
                 (3,'ci:3','ru','TOR CI held','public');
          UPDATE books SET admin_hold=true WHERE id=3;
          -- Author/genre fixtures cover public, hidden and held rows with identical metadata.
          UPDATE books SET author_name='Жюль', genres=ARRAY['фэнтези','приключения']
          WHERE id IN (1,2,3);
          SQL
      - name: Seed G-07/G-09 owned cover job fixtures
        run: |
          PGPASSWORD=tor-ci-app PGUSER=tor_app PGDATABASE=tor_ci psql -X -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO users(id,email_normalized,display_name,password_hash)
          OVERRIDING SYSTEM VALUE
          SELECT id,'cover-'||id||'@example.invalid','CI Cover Owner','$argon2id$test'
            FROM generate_series(901,905) AS id;
          INSERT INTO books(id,source_identity,target_language,title,visibility,owner_user_id)
          SELECT id,'ci:cover:'||id,'ru','CI owned cover book','public',id
            FROM generate_series(901,905) AS id;
          SQL
      - name: Seed published free and protected chapters
        run: |
          PGPASSWORD=tor-ci-app PGUSER=tor_app PGDATABASE=tor_ci psql -X -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO chapters (id, book_id, chapter_no, title, visibility, access_level, price_amount, reader_released_at)
          VALUES
            (101, 1, 1, 'Начало истории', 'public', 'free', 0, NULL),
            (102, 1, 2, 'Секретный черновик', 'draft', 'free', 0, NULL),
            (103, 1, 3, 'Платная глава', 'public', 'paid', 250, NULL),
            (104, 2, 1, 'Глава скрытой книги', 'public', 'free', 0, NULL),
            (105, 3, 1, 'Глава заблокированной книги', 'public', 'free', 0, NULL),
            (106, 1, 4, 'Запланированная глава', 'public', 'free', 0, now() + INTERVAL '1 day'),
            (107, 1, 5, 'Глава на модерации', 'public', 'free', 0, NULL),
            (108, 1, 6, 'Продолжение', 'public', 'free', 0, NULL);
          UPDATE chapters SET admin_hold=true WHERE id=107;
          INSERT INTO chapter_versions (id, chapter_id, version_no, body_markdown)
          VALUES
            (201, 101, 1, '**Первая строка** и <script>alert(1)</script>'),
            (202, 102, 1, 'PRIVATE-DRAFT-MARKER'),
            (203, 103, 1, 'PRIVATE-PAID-MARKER'),
            (204, 104, 1, 'PRIVATE-BOOK-MARKER'),
            (205, 105, 1, 'PRIVATE-HOLD-MARKER'),
            (206, 106, 1, 'PRIVATE-FUTURE-MARKER'),
            (207, 107, 1, 'PRIVATE-MODERATED-MARKER'),
            (208, 108, 1, 'Текст следующей опубликованной главы');
          INSERT INTO chapter_publications(chapter_id, version_id)
          VALUES (101,201),(102,202),(103,203),(104,204),
                 (105,205),(106,206),(107,207),(108,208);
          SQL
      - name: Advance explicit-ID book fixture sequence as schema owner
        run: |
          PGPASSWORD=tor-ci-migrate PGUSER=tor_migrator PGDATABASE=tor_ci psql -X -v ON_ERROR_STOP=1 -c "SELECT setval(pg_get_serial_sequence('books','id'), GREATEST((SELECT max(id) FROM books),1), true)"
      - name: Database and HTTP integration
        run: |
          cargo test -p tor-traffic_behavior --test ril_rollups_pg -- --ignored --test-threads=1
          cargo test -p tor-traffic_behavior --test ril_costs_pg -- --ignored --test-threads=1
          cargo test -p tor-traffic_behavior --test ril_sql_costs_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test ril_sqlx_http_pg -- --ignored --test-threads=1
          cargo test -p tor-storage --features pg --test storage_registry_pg -- --ignored --test-threads=1
          cargo test -p tor-storage --features pg --test keyring_rotation_pg -- --ignored --test-threads=1
          cargo test -p tor-storage --features pg --test storage_gc_pg -- --ignored --test-threads=1
          cargo test -p tor-storage --features pg --test storage_paid_grant_pg -- --ignored --test-threads=1
          cargo test -p tor-storage --features pg --test storage_paid_asset_pg -- --ignored --test-threads=1
          cargo test -p tor-ingest --test cover_jobs_pg -- --ignored
          cargo test -p tor-web --test cover_worker_pg -- --ignored
          cargo test -p tor-books --test postgres_catalog -- --ignored
          cargo test -p tor-search --test search_pg -- --ignored
          cargo test -p tor-search --test seo_pg -- --ignored --test-threads=1
          cargo test -p tor-search --test f03_unicode_pg -- --ignored
          cargo test -p tor-books --test authoring_pg -- --ignored
          cargo test -p tor-books --test book_members_pg b_09_ -- --ignored --test-threads=1
          cargo test -p tor-books --test revenue_shares_pg b_10_ -- --ignored --test-threads=1
          cargo test -p tor-books --lib b_09_pg_owner_swap -- --ignored --test-threads=1
          cargo test -p tor-accounts --lib a_b09_pg_user_tier -- --ignored --test-threads=1
          cargo test -p tor-books --lib b_09_pg_book_tier -- --ignored --test-threads=1
          cargo test -p tor-books --test seo_description_pg -- --ignored --test-threads=1
          cargo test -p tor-books --test free_immediate_publish_pg -- --ignored --test-threads=1
          cargo test -p tor-books --test free_published_edit_pg -- --ignored --test-threads=1
          cargo test -p tor-books --test chapter_release_pg -- --ignored
          cargo test -p tor-books --test paid_storage_pg -- --ignored --test-threads=1
          cargo test -p tor-books --test paid_assets_pg -- --ignored --test-threads=1
          cargo test -p tor-reading --test postgres_reading -- --ignored
          cargo test -p tor-reading --test seo_public_book_pg -- --ignored --test-threads=1
          cargo test -p tor-reading --test progress_postgres -- --ignored
          cargo test -p tor-reading --test slices_pg c_09_ -- --ignored --test-threads=1
          cargo test -p tor-reading --test completion_pg -- --ignored --test-threads=1
          cargo test -p tor-reading --test paid_completion_pg -- --ignored --test-threads=1
          cargo test -p tor-reading --test slices_pg c_10_ -- --ignored --test-threads=1
          cargo test -p tor-reading --test library_postgres -- --ignored
          cargo test -p tor-recommendations --test slices_pg f_05_ -- --ignored --test-threads=1
          cargo test -p tor-recommendations --test book_stars_pg -- --ignored --test-threads=1
          cargo test -p tor-recommendations --test completion_consumer_pg -- --ignored --test-threads=1
          cargo test -p tor-discussions --test slices_pg e_01_ -- --ignored --test-threads=1
          cargo test -p tor-discussions --test public_book_comments_pg e_02_ -- --ignored --test-threads=1
          cargo test -p tor-commerce --test slices_pg d_02_ -- --ignored --test-threads=1
          cargo test -p tor-commerce --test slices_pg d_03_ -- --ignored --test-threads=1
          cargo test -p tor-commerce --test layers_pg d_05_ -- --ignored --test-threads=1
          cargo test -p tor-commerce --test layers_pg d_08_ -- --ignored --test-threads=1
          TOR_LAYER_MANAGEMENT_ENABLED=1 cargo test -p tor-web --test layer_picker_http_pg d_05_ -- --ignored --test-threads=1
          TOR_PAID_CHECKOUT_ENABLED=1 TOR_LAYER_CHECKOUT_ENABLED=1 cargo test -p tor-web --test layer_checkout_http_pg d_05_ -- --ignored --test-threads=1
          cargo test -p tor-commerce --test slices_pg b_10_ -- --ignored --test-threads=1
          cargo test -p tor-web --test postgres_http -- --ignored
          cargo test -p tor-web --test auth_postgres -- --ignored
          cargo test -p tor-web --test free_save_browser_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test book_stars_http_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test book_comments_http_pg e_02_ -- --ignored --test-threads=1
          cargo test -p tor-web --test paid_grants_http_pg -- --ignored --test-threads=1
          TOR_RIL_SINGLE_INSTANCE=1 TOR_RIL_HMAC_KEY="$(printf '4f%.0s' {1..32})" \
            cargo test -p tor-web --test ril_behavior_consent_pg -- --ignored --test-threads=1

      - name: D-04 real HTTP and PostgreSQL sessions (flag off then on)
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          TOR_LISTEN_ADDR: 127.0.0.1:3098
          TOR_AUTH_ENABLED: '1'
          TOR_PUBLIC_ORIGIN: http://127.0.0.1:3098
        run: |
          set -euo pipefail
          cargo build -p tor-web
          TOR_PAID_CHECKOUT_ENABLED=0 ./target/debug/tor-web > "$RUNNER_TEMP/tor-d04-disabled.log" 2>&1 &
          disabled_pid=$!
          enabled_pid=""
          trap 'kill "$disabled_pid" "${enabled_pid:-}" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3098/readyz >/dev/null; then ready=1; break; fi
            if ! kill -0 "$disabled_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat "$RUNNER_TEMP/tor-d04-disabled.log"; exit 1; fi
          python3 tools/checkout_http_pg_smoke.py --mode disabled
          kill "$disabled_pid"
          wait "$disabled_pid" || true
          TOR_PAID_CHECKOUT_ENABLED=1 ./target/debug/tor-web > "$RUNNER_TEMP/tor-d04-enabled.log" 2>&1 &
          enabled_pid=$!
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3098/readyz >/dev/null; then ready=1; break; fi
            if ! kill -0 "$enabled_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat "$RUNNER_TEMP/tor-d04-enabled.log"; exit 1; fi
          python3 tools/checkout_http_pg_smoke.py --mode enabled
      - name: I-11 PostgreSQL outage, restart and durable public data
        env:
          GITHUB_ACTIONS: 'true'
        run: |
          cargo build -p tor-web
          bash tools/tor_pg_restart_smoke.sh
      - name: I-11 PostgreSQL 18 backup and clean restore drill
        env:
          GITHUB_ACTIONS: 'true'
        run: |
          cargo build -p tor-web
          bash tools/tor_pg_backup_restore_smoke.sh
      - name: D-04 diagnostic HTTP logs
        if: failure()
        run: |
          tail -n 100 "$RUNNER_TEMP/tor-d04-disabled.log" 2>/dev/null || true
          tail -n 100 "$RUNNER_TEMP/tor-d04-enabled.log" 2>/dev/null || true
