          TOR_PAID_CHECKOUT_ENABLED=1 TOR_DIRECT_REFUND_REQUESTS_ENABLED=1 TOR_REFUND_APPROVAL_HTTP_ENABLED=1 cargo test -p tor-web --test direct_refund_browser_http_pg s036_buyer_http_owner_csrf_policy_submit_replay_and_history -- --ignored --test-threads=1
