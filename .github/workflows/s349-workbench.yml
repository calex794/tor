name: S349 isolated workbench
on:
  push:
    branches: [feat/s349-free-chapter-s3-storage-20261109]
    paths: [tools/s349_workbench.py]
permissions:
  contents: write
concurrency:
  group: s349-isolated-workbench
  cancel-in-progress: false
jobs:
  apply-and-package:
    if: github.repository == 'calex794/tor' && github.ref == 'refs/heads/feat/s349-free-chapter-s3-storage-20261109'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply explicit source patch
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 tools/s349_workbench.py
          cargo fmt --all
          git diff --check
      - name: Commit to the same development branch only
        env:
          TASK_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && test -z "$(git ls-files --others --exclude-standard)"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'S349: apply explicit completion patch and Rust formatting'
          auth=$(printf 'x-access-token:%s' "$TASK_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/feat/s349-free-chapter-s3-storage-20261109
      - name: Export clean public PostgreSQL and MinIO tools (no data or secrets)
        if: hashFiles('tools/s349_export_toolchain') != ''
        run: |
          mkdir -p "$RUNNER_TEMP/services/pg/lib" "$RUNNER_TEMP/services/pg/share" "$RUNNER_TEMP/services/browser"
          docker pull postgres:18
          cid=$(docker create postgres:18)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/usr/lib/postgresql/18/bin" "$RUNNER_TEMP/services/pg/bin"
          docker cp "$cid:/usr/lib/postgresql/18/lib/." "$RUNNER_TEMP/services/pg/lib/"
          docker run --rm postgres:18 tar -ch -C /usr/share/postgresql/18 . | tar -x -C "$RUNNER_TEMP/services/pg/share"
          docker run --rm postgres:18 bash -c 'ldd /usr/lib/postgresql/18/bin/* /usr/lib/postgresql/18/lib/*.so 2>/dev/null | grep -Eo "/[^ ]+" | grep -v "^/usr/lib/postgresql" | sort -u' > "$RUNNER_TEMP/pg-libraries.txt"
          while read -r library; do docker cp -L "$cid:$library" "$RUNNER_TEMP/services/pg/lib/"; done < "$RUNNER_TEMP/pg-libraries.txt"
          release=minio.linux-amd64.RELEASE.2025-09-07T16-13-09Z
          url=https://github.com/minio/minio/releases/download/RELEASE.2025-09-07T16-13-09Z
          curl -fLsS --retry 3 "$url/$release" -o "$RUNNER_TEMP/services/minio"
          curl -fLsS --retry 3 "$url/$release.sha256sum" -o "$RUNNER_TEMP/minio.sha256"
          expected=$(grep -Eo '[0-9a-f]{64}' "$RUNNER_TEMP/minio.sha256" | head -n 1)
          test "$(sha256sum "$RUNNER_TEMP/services/minio" | cut -d ' ' -f1)" = "$expected"
          chmod 755 "$RUNNER_TEMP/services/minio"
          npm install --prefix "$RUNNER_TEMP/services/browser" --no-save playwright@1.56.1
          tar -czf "$RUNNER_TEMP/s349-services.tar.gz" -C "$RUNNER_TEMP/services" .
      - uses: actions/upload-artifact@v4
        if: hashFiles('tools/s349_export_toolchain') != ''
        with:
          name: s349-offline-services
          path: ${{ runner.temp }}/s349-services.tar.gz
          retention-days: 1
          if-no-files-found: error
      - name: Export committed source
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/s349-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: s349-workbench-source
          path: ${{ runner.temp }}/s349-source.tar.gz
          retention-days: 1
          if-no-files-found: error
