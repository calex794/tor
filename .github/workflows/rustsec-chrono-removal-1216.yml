name: RustSec chrono replacement experiment 1216
on:
  push:
    branches: ['tools/rustsec-chrono-removal-1216']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rustsec-chrono-removal-1216
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve candidate and record dependency graph
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/remediation"
          mkdir -p "$report"
          git rev-parse HEAD > "$report/head.txt"
          rustc --version
          cargo metadata --format-version 1 --all-features > "$report/metadata.json"
          cp Cargo.lock "$report/Cargo.lock"
          sha256sum Cargo.lock | tee "$report/lock.sha256"
          git diff --stat
          cargo tree --locked --workspace --all-features > "$report/tree.txt"
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          packages = tomllib.loads(Path("Cargo.lock").read_text())["package"]
          names = {"zip", "rsa", "chrono", "h2", "rustls", "rustls-webpki",
                   "libsqlite3-sys", "sqlx", "rusqlite", "aws-smithy-http-client", "time"}
          for p in packages:
              if p["name"] in names:
                  print("LOCK", p["name"], p["version"])
          assert not any(p["name"] == "chrono" for p in packages), "chrono remains in lockfile"
          PY
          if git grep -nE 'chrono::|use chrono|chrono[[:space:]]*=' -- '*.rs' '*Cargo.toml'; then
            echo "chrono source references remain"; exit 1
          fi
      - name: Publish candidate lockfile
        if: steps.resolve.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: remediation-lock
          path: ${{ runner.temp }}/remediation/
          retention-days: 14
      - name: Compile entire workspace including S3 and test targets
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo check --locked --workspace --all-targets --all-features --keep-going
      - name: Verify archive and observability unit tests
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: |
          cargo test --locked -p tor-books --lib
          cargo test --locked -p tor-observability
          cargo test --locked -p tor-ads --lib
          cargo test --locked -p tor-reading --lib
          cargo test --locked -p tor-reading --test paid_grant_contract
      - name: Install RustSec scanner
        id: audit_install
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo install --locked --version '=0.23.0' cargo-audit
      - name: Scan the candidate
        if: ${{ !cancelled() && steps.audit_install.outcome == 'success' }}
        shell: bash
        run: |
          rc=0
          cargo audit --json > "$RUNNER_TEMP/remediation/audit.json" 2> "$RUNNER_TEMP/remediation/audit.stderr" || rc=$?
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "remediation" / "audit.json"
          d = json.loads(p.read_text())
          for item in d["vulnerabilities"]["list"]:
              print(item["advisory"]["id"], item["package"]["name"], item["package"]["version"])
          for kind, items in d["warnings"].items():
              for item in items:
                  print("WARNING", kind, item["advisory"]["id"], item["package"]["name"], item["package"]["version"])
          print("VULNERABILITIES", d["vulnerabilities"]["count"])
          PY
          cat "$RUNNER_TEMP/remediation/audit.stderr"
          exit "$rc"
      - name: Install pinned cargo-deny
        id: deny_install
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo install --locked --version '=0.20.2' cargo-deny
      - name: Check existing dependency policy without exceptions
        if: ${{ !cancelled() && steps.deny_install.outcome == 'success' }}
        shell: bash
        run: |
          rc=0
          report="$RUNNER_TEMP/remediation"
          cargo deny --locked --all-features --format json check > "$report/deny.stdout" 2> "$report/deny.jsonl" || rc=$?
          cat "$report/deny.stdout"
          cat "$report/deny.jsonl"
          exit "$rc"
      - name: Preserve evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: remediation-report
          path: ${{ runner.temp }}/remediation/
          if-no-files-found: warn
          retention-days: 14
