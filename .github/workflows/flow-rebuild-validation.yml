name: FLOW rebuild targeted validation
on:
  push:
    branches: ['wip/flow-rebuild-*']
permissions:
  contents: read
concurrency:
  group: flow-rebuild-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust-and-disposable-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: tor-ci-postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: tor-ci-postgres
      TEST_DATABASE_URL: postgresql://tor_app:tor-ci-app@127.0.0.1:5432/tor_ci
      MIGRATOR_URL: postgresql://tor_migrator:tor-ci-migrate@127.0.0.1:5432/tor_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare verified Ubuntu mirror when stock DNS fails
        run: bash tools/ci_prepare_ubuntu_mirror.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format diagnostic candidates and emit exact changed source
        run: |
          cargo fmt --all
          git diff --check
          python3 <<'PY'
          import base64, hashlib, json, pathlib, subprocess
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "--", "*.rs"], text=True
          ).splitlines()
          for name in changed:
              data = pathlib.Path(name).read_bytes()
              digest = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
              print("FLOW_FMT_BEGIN " + json.dumps({"path": name, "git_blob": digest, "bytes": len(data)}))
              encoded = base64.b64encode(data).decode("ascii")
              for offset in range(0, len(encoded), 3000):
                  print("FLOW_FMT_DATA " + encoded[offset:offset + 3000])
              print("FLOW_FMT_END")
          print("FLOW_FMT_FILES " + str(len(changed)))
          PY
      - name: Unit tests for source owners and web composition
        run: |
          cargo test -p tor-recommendations -p tor-traffic_behavior \
            -p tor-search -p tor-reading -p tor-web --lib
      - name: PostgreSQL client
        run: |
          if command -v psql >/dev/null 2>&1; then
            psql --version
          else
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Create isolated validation roles and database
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE tor_migrator LOGIN PASSWORD 'tor-ci-migrate';
          CREATE ROLE tor_app LOGIN PASSWORD 'tor-ci-app';
          CREATE DATABASE tor_ci OWNER tor_migrator;
          SQL
          psql -X -v ON_ERROR_STOP=1 -d tor_ci <<'SQL'
          REVOKE ALL ON DATABASE tor_ci FROM PUBLIC;
          GRANT CONNECT ON DATABASE tor_ci TO tor_app;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          GRANT USAGE ON SCHEMA public TO tor_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE tor_migrator IN SCHEMA public
            GRANT SELECT,INSERT,UPDATE,DELETE ON TABLES TO tor_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE tor_migrator IN SCHEMA public
            GRANT USAGE,SELECT ON SEQUENCES TO tor_app;
          SQL
      - name: Apply all current migrations and replay
        run: |
          DATABASE_URL="$MIGRATOR_URL" cargo run -p tor-migrations --bin tor-migrate
          DATABASE_URL="$MIGRATOR_URL" cargo run -p tor-migrations --bin tor-migrate
      - name: Focused PostgreSQL and HTTP cases present in this development slice
        shell: bash
        run: |
          for flow_case in \
            tor-recommendations:flow_signals_pg:crates/recommendations \
            tor-recommendations:exposure_pg:crates/recommendations \
            tor-recommendations:exposure_health_pg:crates/recommendations \
            tor-recommendations:flow_genres_pg:crates/recommendations \
            tor-traffic_behavior:ril_rollups_pg:crates/traffic_behavior \
            tor-search:public_pages_pg:crates/search \
            tor-reading:audience_closed_pg:crates/reading \
            tor-web:audience_http_pg:crates/web \
            tor-web:exposure_http_pg:crates/web \
            tor-web:exposure_report_http_pg:crates/web; do
            IFS=: read -r flow_pkg flow_test flow_dir <<< "$flow_case"
            if test -f "$flow_dir/tests/$flow_test.rs"; then
              printf 'FLOW_TARGET package=%s test=%s\n' "$flow_pkg" "$flow_test"
              cargo test -p "$flow_pkg" --test "$flow_test" -- --ignored --test-threads=1
            else
              printf 'FLOW_PENDING_SOURCE package=%s test=%s\n' "$flow_pkg" "$flow_test"
            fi
          done
      - name: Closed exposure report native browser acceptance
        env:
          APP_URL: postgresql://tor_app:tor-ci-app@127.0.0.1:5432/tor_ci
          TOR_EXPOSURE_BASE: http://127.0.0.1:3113
          TOR_EXPOSURE_SHOTS: /tmp/flow-owner-browser-shots
        run: |
          npm install --prefix "$RUNNER_TEMP/flow-owner-browser" playwright@1.56.1
          export NODE_PATH="$RUNNER_TEMP/flow-owner-browser/node_modules"
          node "$RUNNER_TEMP/flow-owner-browser/node_modules/playwright/cli.js" install --with-deps chromium
          cargo build -p tor-web
          TOR_AUTH_ENABLED=1 TOR_PUBLIC_ORIGIN="$TOR_EXPOSURE_BASE" \
            TOR_LISTEN_ADDR=127.0.0.1:3113 DATABASE_URL="$TEST_DATABASE_URL" \
            target/debug/tor-web >/tmp/flow-owner-browser-server.log 2>&1 &
          owner_server_pid=$!
          trap 'kill "$owner_server_pid" 2>/dev/null || true; wait "$owner_server_pid" 2>/dev/null || true' EXIT
          for owner_attempt in $(seq 1 100); do
            if curl --fail --silent "$TOR_EXPOSURE_BASE/readyz" >/dev/null; then break; fi
            kill -0 "$owner_server_pid"
            sleep 0.2
          done
          curl --fail --silent "$TOR_EXPOSURE_BASE/readyz"
          node tools/exposure_report_pg_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flow-owner-report-browser
          path: |
            /tmp/flow-owner-browser-shots
            /tmp/flow-owner-browser-server.log
      - name: Strict owner and web Clippy
        run: |
          cargo clippy -p tor-recommendations -p tor-traffic_behavior \
            -p tor-search -p tor-reading -p tor-web --all-targets -- -D warnings
      - name: Require the checked-in source to match formatting
        if: always()
        run: |
          if ! git diff --quiet -- '*.rs'; then
            printf 'Formatted candidate source differs from this commit; commit and rerun it before acceptance.\n'
            git diff --name-only -- '*.rs'
            exit 1
          fi
