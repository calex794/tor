name: TOR PostgreSQL reader browser
on:
  pull_request:
    paths:
      - 'crates/reading/**'
      - 'crates/accounts/**'
      - 'crates/web/**'
      - 'crates/search/**'
      - 'tools/reader_visual_smoke.cjs'
      - 'tools/author_chapter_visual_smoke.cjs'
      - 'tools/search_visual_smoke.cjs'
      - '.github/workflows/tor-reader-visual.yml'
  push:
    branches: [main]
    paths:
      - 'crates/reading/**'
      - 'crates/accounts/**'
      - 'crates/web/**'
      - 'crates/search/**'
      - 'tools/reader_visual_smoke.cjs'
      - 'tools/search_visual_smoke.cjs'
      - '.github/workflows/tor-reader-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reader-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: tor-reader-ci-superuser
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: tor-reader-ci-superuser
      APP_URL: postgresql://tor_app:tor-reader-ci-app@127.0.0.1:5432/tor_ci
      MIGRATION_URL: postgresql://tor_migrator:tor-reader-ci-migrator@127.0.0.1:5432/tor_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PostgreSQL client and disposable roles
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE tor_migrator LOGIN PASSWORD 'tor-reader-ci-migrator';
          CREATE ROLE tor_app LOGIN PASSWORD 'tor-reader-ci-app';
          CREATE DATABASE tor_ci OWNER tor_migrator;
          SQL
          psql -X -v ON_ERROR_STOP=1 -d tor_ci <<'SQL'
          REVOKE ALL ON DATABASE tor_ci FROM PUBLIC;
          GRANT CONNECT ON DATABASE tor_ci TO tor_app;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          GRANT USAGE ON SCHEMA public TO tor_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE tor_migrator IN SCHEMA public
            GRANT SELECT,INSERT,UPDATE,DELETE ON TABLES TO tor_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE tor_migrator IN SCHEMA public
            GRANT USAGE,SELECT ON SEQUENCES TO tor_app;
          SQL
      - name: Real SQLx schema and public reading fixtures
        run: |
          DATABASE_URL="$MIGRATION_URL" cargo run -p tor-migrations --bin tor-migrate
          PGPASSWORD=tor-reader-ci-app PGUSER=tor_app PGDATABASE=tor_ci psql -X -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO books(id,source_identity,target_language,title,visibility)
          VALUES(1,'ci:visual:public','ru','Книга для браузерной приёмки','public'),
                (2,'ci:visual:private','ru','Закрытая книга','draft');
          INSERT INTO chapters(id,book_id,chapter_no,title,visibility,access_level,price_amount)
          VALUES(101,1,1,'Начало истории','public','free',0),
                (102,1,2,'Черновик','draft','free',0),
                (103,1,3,'Платная глава','public','paid',250);
          INSERT INTO chapter_versions(id,chapter_id,version_no,body_markdown)
          VALUES(201,101,1,'**Первая строка** и <script>alert(1)</script>' || repeat('д', 1200)),
                (202,102,1,'PRIVATE-DRAFT-MARKER'),
                (203,103,1,'PRIVATE-PAID-MARKER');
          INSERT INTO chapter_publications(chapter_id,version_id)
          VALUES(101,201),(102,202),(103,203);
          SQL
          # Fixed-ID book fixtures require a sequence correction by the migrator role.
          psql -X -v ON_ERROR_STOP=1 "$MIGRATION_URL" -c "SELECT setval(pg_get_serial_sequence('books','id'), GREATEST((SELECT max(id) FROM books),1), TRUE)"
      - name: Build the real PostgreSQL-backed server
        run: cargo build -p tor-web
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browse chapter, TOC, mobile layout and locked URLs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reader-shots"
          TOR_AUTH_ENABLED=1 TOR_PUBLIC_ORIGIN=http://127.0.0.1:3098 DATABASE_URL="$APP_URL" TOR_LISTEN_ADDR=127.0.0.1:3098 ./target/debug/tor-web > "$RUNNER_TEMP/tor-reader.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3098/readyz > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3098/readyz
          TOR_READER_SHOTS="$RUNNER_TEMP/reader-shots" node tools/reader_visual_smoke.cjs
          TOR_AUTHOR_SHOTS="$RUNNER_TEMP/reader-shots" node tools/author_chapter_visual_smoke.cjs
          TOR_SEARCH_SHOTS="$RUNNER_TEMP/reader-shots" node tools/search_visual_smoke.cjs
      - name: Preserve screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tor-real-pg-reader-desktop-mobile
          path: ${{ runner.temp }}/reader-shots/*.png
          if-no-files-found: warn
          retention-days: 14
