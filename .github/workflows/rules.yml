name: Repository rules
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Enforce required initial files
        run: |
          test -s README.md
          test -s AGENTS.md
          test -s docs/development.md
          test -s docs/contracts/README.md
          test -s docs/deployment.md
          test -s .github/PULL_REQUEST_TEMPLATE.md
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read-only I-06 main ruleset proof on trusted push
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/check_one_click_release_ci.py \
            --repo ${{ github.repository }} \
            --sha "${{ github.sha }}" --policy-only
      - name: Block duplicate SQLx migration versions in merged checkout
        run: python3 tools/check_sqlx_checkout_tree.py migrations
      - name: Enforce TOR feature-first boundaries
        run: python3 tools/check_feature_layout.py
      - name: Enforce executable TOR roadmap coverage
        run: python3 tools/check_roadmap.py
      - name: Enforce registered Axum/RIL route and method parity
        run: python3 tools/check_ril_routes.py
      - name: Enforce reviewed RIL auth, ownership, CSRF and rate guard parity
        run: python3 tools/check_ril_governance.py
      - name: Verify RIL external exposure contract and route fingerprint
        run: python3 tools/check_ril_exposure.py
      - name: Check locked NEwBOO HTTP routes and deferred handler coverage
        run: python3 tools/check_legacy_coverage.py
      - name: Enforce prelaunch API finance access S3 recommendations and release contracts
        run: python3 tools/check_contracts.py
      - name: Verify architecture guard catches regressions
        run: python3 -m unittest discover -s tests/architecture -v
      - name: Syntax-check read-only TOR RIL-09 VPS audit
        run: bash -n ops/audit-ril-exposure-vps.sh
      - name: Check TOR SSH bootstrap shell syntax
        run: bash -n ops/bootstrap-tor-deploy.sh
      - name: Check TOR rollback verification shell syntax
        run: bash -n ops/verify-tor-rollback.sh
      - name: Syntax-check TOR PostgreSQL bootstrap
        run: bash -n ops/bootstrap-postgresql-vps.sh
      - name: Check TOR database-role bootstrap syntax
        run: bash -n ops/init-tor-database.sh
      - name: Syntax-check first SQLx migrations operator script
        run: bash -n ops/apply-tor-migrations-vps.sh
      - name: Validate production activation shell syntax
        run: bash -n ops/go-live-postgres-vps.sh
      - name: Flag insecure deployment shortcuts
        run: |
          matches="$(find .github scripts deploy -type f ! -name 'rules.yml' \( -name '*.sh' -o -name '*.yaml' -o -name '*.yml' \) -print0 2>/dev/null | xargs -0 -r grep -nE 'StrictHostKeyChecking=no|--privileged|0\.0\.0\.0:5432' || true)"
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            echo 'Unsafe deployment shortcut in project rules'
            exit 1
          fi
          echo 'Repository documentation and architecture checks passed'
