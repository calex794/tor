name: Repository rules
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tor-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Enforce required initial files
        run: |
          test -s README.md
          test -s AGENTS.md
          test -s docs/development.md
          test -s docs/contracts/README.md
          test -s docs/deployment.md
          test -s .github/PULL_REQUEST_TEMPLATE.md
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce TOR feature-first boundaries
        run: python3 tools/check_feature_layout.py
      - name: Enforce executable TOR roadmap coverage
        run: python3 tools/check_roadmap.py
      - name: Enforce prelaunch API finance access S3 recommendations and release contracts
        run: python3 tools/check_contracts.py
      - name: Verify architecture guard catches regressions
        run: python3 -m unittest discover -s tests/architecture -v
      - name: Check TOR SSH bootstrap shell syntax
        run: bash -n ops/bootstrap-tor-deploy.sh
      - name: Check TOR rollback verification shell syntax
        run: bash -n ops/verify-tor-rollback.sh
      - name: Flag insecure deployment shortcuts
        run: |
          matches="$(find .github scripts deploy -type f ! -name 'rules.yml' \( -name '*.sh' -o -name '*.yaml' -o -name '*.yml' \) -print0 2>/dev/null | xargs -0 -r grep -nE 'StrictHostKeyChecking=no|--privileged|0\.0\.0\.0:5432' || true)"
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            echo 'Unsafe deployment shortcut in project rules'
            exit 1
          fi
          echo 'Repository documentation and architecture checks passed'
