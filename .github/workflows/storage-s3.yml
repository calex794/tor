name: TOR private chapter S3 provider
on:
  pull_request:
    paths:
      - 'crates/storage/src/repositories/**'
      - 'crates/storage/src/domain/provider.rs'
      - 'crates/storage/src/domain/mod.rs'
      - 'crates/storage/src/services/provider.rs'
      - 'crates/storage/src/services/mod.rs'
      - 'crates/storage/src/lib.rs'
      - 'crates/storage/Cargo.toml'
      - 'crates/storage/tests/s3_private_provider.rs'
      - '.github/workflows/storage-s3.yml'
  push:
    branches: [main]
    paths:
      - 'crates/storage/src/repositories/**'
      - 'crates/storage/src/domain/provider.rs'
      - 'crates/storage/src/domain/mod.rs'
      - 'crates/storage/src/services/provider.rs'
      - 'crates/storage/src/services/mod.rs'
      - 'crates/storage/src/lib.rs'
      - 'crates/storage/Cargo.toml'
      - 'crates/storage/tests/s3_private_provider.rs'
      - '.github/workflows/storage-s3.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tor-private-chapter-s3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  s3-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Boundary and formatting
        run: |
          python3 tools/check_feature_layout.py
          cargo fmt -p tor-storage -- --check
      - name: Start verified upstream MinIO on 127.0.0.1
        run: |
          release=minio.linux-amd64.RELEASE.2025-09-07T16-13-09Z
          url=https://github.com/minio/minio/releases/download/RELEASE.2025-09-07T16-13-09Z
          curl --fail --location --silent --show-error --retry 3 \
            "$url/$release" --output "$RUNNER_TEMP/$release"
          curl --fail --location --silent --show-error --retry 3 \
            "$url/$release.sha256sum" --output "$RUNNER_TEMP/$release.sha256sum"
          expected=$(grep -Eo '[0-9a-f]{64}' "$RUNNER_TEMP/$release.sha256sum" | head -n 1)
          test "${#expected}" -eq 64
          actual=$(sha256sum "$RUNNER_TEMP/$release" | cut -d ' ' -f1)
          test "$actual" = "$expected"
          chmod 700 "$RUNNER_TEMP/$release"
          mkdir -p "$RUNNER_TEMP/tor-chapter-minio"
          MINIO_ROOT_USER=tor-chapter-ci-user MINIO_ROOT_PASSWORD=tor-chapter-ci-secret-only \
            nohup "$RUNNER_TEMP/$release" server "$RUNNER_TEMP/tor-chapter-minio" \
              --address 127.0.0.1:9000 --console-address 127.0.0.1:9001 \
              > "$RUNNER_TEMP/tor-chapter-minio.log" 2>&1 &
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            tail -n 80 "$RUNNER_TEMP/tor-chapter-minio.log"
            exit 1
          fi
      - name: Test private PUT-if-absent, signed GET, anonymous deny, and actual hash
        env:
          TOR_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          TOR_TEST_S3_ACCESS_KEY: tor-chapter-ci-user
          TOR_TEST_S3_SECRET_KEY: tor-chapter-ci-secret-only
        run: |
          cargo test -p tor-storage --features s3 --test s3_private_provider -- --ignored --test-threads=1
          cargo test -p tor-storage --features s3 --lib g_s3_12_delete_claimed_private_object_and_repeat_safely -- --ignored --test-threads=1
          cargo clippy -p tor-storage --features s3 --all-targets -- -D warnings
      - name: MinIO diagnostics without signed URL on failure
        if: failure()
        run: tail -n 80 "$RUNNER_TEMP/tor-chapter-minio.log" || true
