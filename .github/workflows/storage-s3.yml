name: TOR private chapter S3 provider
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  select:
    uses: ./.github/workflows/ci-selection.yml
    with:
      caller: storage_s3
  s3-provider:
    needs: select
    if: ${{ !cancelled() && (needs.select.result != 'success' || fromJSON(needs.select.outputs.suites || '{"storage_s3":true}').storage_s3) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Boundary and formatting
        run: |
          python3 tools/check_feature_layout.py
          cargo fmt -p tor-storage -- --check
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.8'
          cache: false
      - name: Build verified upstream MinIO response fix
        run: bash tools/g09_build_minio_ci.sh
      - name: Start verified upstream MinIO on 127.0.0.1
        run: |
          release=minio-g09-fixed
          mkdir -p "$RUNNER_TEMP/tor-chapter-minio"
          MINIO_ROOT_USER=tor-chapter-ci-user MINIO_ROOT_PASSWORD=tor-chapter-ci-secret-only \
            nohup "$RUNNER_TEMP/$release" server "$RUNNER_TEMP/tor-chapter-minio" \
              --address 127.0.0.1:9000 --console-address 127.0.0.1:9001 \
              > "$RUNNER_TEMP/tor-chapter-minio.log" 2>&1 &
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            tail -n 80 "$RUNNER_TEMP/tor-chapter-minio.log"
            exit 1
          fi
      - name: Test private storage and S023 staging against disposable loopback MinIO
        env:
          TOR_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          TOR_TEST_S3_ACCESS_KEY: tor-chapter-ci-user
          TOR_TEST_S3_SECRET_KEY: tor-chapter-ci-secret-only
        run: |
          bash tools/g09_minio_tcp_metadata_ci.sh
          cargo test -p tor-storage --features s3 --test free_chapter_s3 -- --ignored --test-threads=1
          cargo test -p tor-storage --features s3 --test free_pack_range_s3 -- --ignored --test-threads=1
          cargo test -p tor-storage --features s3 --test drop_yandex_unversioned fnd02_yandex_scope_rejects_ci_and_unsafe_targets
          cargo test -p tor-storage --features s3 --lib g_s3_12_delete_claimed_private_object_and_repeat_safely -- --ignored --test-threads=1
          cargo test -p tor-imports --features s3 repositories::s3::tests::s023_private_source_put_get_conflict_and_delete -- --ignored --test-threads=1
          cargo fmt -p tor-imports -- --check
          cargo clippy -p tor-storage --features s3 --all-targets -- -D warnings
          cargo clippy -p tor-imports --features s3 --all-targets -- -D warnings
      - name: MinIO diagnostics without signed URL on failure
        if: failure()
        run: tail -n 80 "$RUNNER_TEMP/tor-chapter-minio.log" || true
