name: Prepare immutable REC integration objects
on:
  push:
    branches: ['integration/rec13-main-9e6a43b-objects']
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'calex794/tor' && github.ref == 'refs/heads/integration/rec13-main-9e6a43b-objects'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare only reviewed immutable tree; no tests or ref updates
        env:
          OBJECT_WRITE_TOKEN: ${{ github.token }}
        run: python3 .github/rec13_prepare_objects.py
      - uses: actions/upload-artifact@v4
        with:
          name: rec13-prepared-tree
          path: ${{ runner.temp }}/rec13-prepared-tree.json
          if-no-files-found: error
          retention-days: 3
