name: TOR disposable deployment VM
on:
  pull_request:
    paths:
      - 'ops/install/**'
      - 'ops/fallback/**'
      - 'ops/systemd/**'
      - 'ops/tor-web.service.example'
      - 'ops/init-tor-database.sh'
      - 'ops/apply-tor-migrations-vps.sh'
      - 'ops/go-live-postgres-vps.sh'
      - 'tools/prepare_clean_install.py'
      - 'tools/activate_clean_install.py'
      - 'tools/release_bundle_v2.py'
      - 'tools/managed_edge_release.py'
      - 'tools/managed_systemd_release.py'
      - 'tools/coordinated_release.py'
      - 'tools/release_executor_v2.py'
      - 'tools/adopt_edge_vhost.py'
      - 'tests/deploy/**'
      - '.github/workflows/tor-deploy-vm.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  vm:
    # Never a self-hosted runner, VPS, protected deploy environment or SSH job.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build real approved default-profile Rust executables
        run: |
          cargo build --locked --release -p tor-web
          cargo build --locked --release -p tor-migrations --bin tor-migrate
          cargo build --locked --release -p tor-observability --bin tor-trace-store
      - name: Prepare authenticated Ubuntu mirrors
        run: bash tools/ci_prepare_ubuntu_mirror.sh
      - name: Provision isolated disposable VM system services
        shell: bash
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,GITHUB_EVENT_NAME,GITHUB_SHA,GITHUB_WORKSPACE /usr/bin/bash tests/deploy/hosted_vm_setup.sh
      - name: Real first start, signed update, failure and interrupted release recovery
        shell: bash
        run: |
          set -euo pipefail
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,GITHUB_EVENT_NAME,GITHUB_SHA,GITHUB_WORKSPACE /usr/bin/python3 -I -B tests/deploy/hosted_vm_acceptance.py | tee "$RUNNER_TEMP/deploy-vm.log"
          grep -Fxq 'DEPLOY08A_VM_ACCEPTANCE_OK' "$RUNNER_TEMP/deploy-vm.log"
      - name: Retain sanitized fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tor-deploy-vm-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/deploy-vm.log
          if-no-files-found: warn
          retention-days: 10
