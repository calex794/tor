name: TOR paid S3 grant end-to-end
on:
  pull_request:
    paths:
      - 'crates/web/src/paid_grants_http.rs'
      - 'crates/web/src/main.rs'
      - 'crates/web/src/paid_author_publish.rs'
      - 'crates/web/src/paid_reader_router.rs'
      - 'crates/web/src/author_chapter_http.rs'
      - 'crates/web/src/author_chapter_pages.rs'
      - 'crates/web/templates/author_new_chapter.html'
      - 'crates/web/tests/paid_author_pg.rs'
      - 'crates/web/tests/paid_grants_s3_pg.rs'
      - 'crates/reading/src/services/paid_delivery.rs'
      - 'crates/books/src/repositories/paid_storage.rs'
      - 'crates/storage/**'
      - 'migrations/**'
      - 'tools/paid_grant_webcrypto_e2e.mjs'
      - 'tools/paid_reader_minio_chromium_e2e.cjs'
      - 'crates/web/assets/newboo-paid-reader.mjs'
      - 'crates/web/src/pages/reader_paid.rs'
      - 'crates/web/templates/layout.html'
      - 'crates/web/src/pages.rs'
      - 'crates/web/assets/site.css'
      - 'crates/web/assets/newboo-port.css'
      - 'crates/web/assets/newboo-book-detail.css'
      - 'crates/web/assets/newboo-reader.css'
      - 'crates/web/assets/newboo-cover-picker.css'
      - 'crates/web/assets/brand/**'
      - '.github/workflows/tor-paid-grant-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'crates/web/src/paid_grants_http.rs'
      - 'crates/web/src/main.rs'
      - 'crates/web/src/paid_author_publish.rs'
      - 'crates/web/src/paid_reader_router.rs'
      - 'crates/web/src/author_chapter_http.rs'
      - 'crates/web/src/author_chapter_pages.rs'
      - 'crates/web/templates/author_new_chapter.html'
      - 'crates/web/tests/paid_author_pg.rs'
      - 'crates/web/tests/paid_grants_s3_pg.rs'
      - 'crates/reading/src/services/paid_delivery.rs'
      - 'crates/books/src/repositories/paid_storage.rs'
      - 'crates/storage/**'
      - 'migrations/**'
      - 'tools/paid_grant_webcrypto_e2e.mjs'
      - 'tools/paid_reader_minio_chromium_e2e.cjs'
      - 'crates/web/assets/newboo-paid-reader.mjs'
      - 'crates/web/src/pages/reader_paid.rs'
      - 'crates/web/templates/layout.html'
      - 'crates/web/src/pages.rs'
      - 'crates/web/assets/site.css'
      - 'crates/web/assets/newboo-port.css'
      - 'crates/web/assets/newboo-book-detail.css'
      - 'crates/web/assets/newboo-reader.css'
      - 'crates/web/assets/newboo-cover-picker.css'
      - 'crates/web/assets/brand/**'
      - '.github/workflows/tor-paid-grant-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paid-private-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: tor-ci-postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: tor-ci-postgres
      TEST_DATABASE_URL: postgresql://tor_app:tor-ci-app@127.0.0.1:5432/tor_ci
      MIGRATOR_URL: postgresql://tor_migrator:tor-ci-migrate@127.0.0.1:5432/tor_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Prepare disposable tor_ci with separate app/migrator privileges
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE tor_migrator LOGIN PASSWORD 'tor-ci-migrate';
          CREATE ROLE tor_app LOGIN PASSWORD 'tor-ci-app';
          CREATE DATABASE tor_ci OWNER tor_migrator;
          SQL
          psql -X -v ON_ERROR_STOP=1 -d tor_ci <<'SQL'
          REVOKE ALL ON DATABASE tor_ci FROM PUBLIC;
          GRANT CONNECT ON DATABASE tor_ci TO tor_app;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          GRANT USAGE ON SCHEMA public TO tor_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE tor_migrator IN SCHEMA public
            GRANT SELECT,INSERT,UPDATE,DELETE ON TABLES TO tor_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE tor_migrator IN SCHEMA public
            GRANT USAGE,SELECT ON SEQUENCES TO tor_app;
          SQL
          DATABASE_URL="$MIGRATOR_URL" cargo run -p tor-migrations --bin tor-migrate
      - name: Start checksum-verified upstream MinIO on loopback
        run: |
          set -euo pipefail
          release=minio.linux-amd64.RELEASE.2025-09-07T16-13-09Z
          url=https://github.com/minio/minio/releases/download/RELEASE.2025-09-07T16-13-09Z
          curl --fail --location --silent --show-error --retry 3 \
            "$url/$release" --output "$RUNNER_TEMP/$release"
          curl --fail --location --silent --show-error --retry 3 \
            "$url/$release.sha256sum" --output "$RUNNER_TEMP/$release.sha256sum"
          expected=$(grep -Eo '[0-9a-f]{64}' "$RUNNER_TEMP/$release.sha256sum" | head -n 1)
          test "$(printf '%s' "$expected" | wc -c)" -eq 64
          actual=$(sha256sum "$RUNNER_TEMP/$release" | cut -d ' ' -f1)
          test "$actual" = "$expected"
          chmod 700 "$RUNNER_TEMP/$release"
          mkdir -p "$RUNNER_TEMP/tor-paid-minio"
          MINIO_API_CORS_ALLOW_ORIGIN=http://127.0.0.1:3098 \
          MINIO_ROOT_USER=tor-chapter-ci-user MINIO_ROOT_PASSWORD=tor-chapter-ci-secret-only \
            nohup "$RUNNER_TEMP/$release" server "$RUNNER_TEMP/tor-paid-minio" \
              --address 127.0.0.1:9000 --console-address 127.0.0.1:9001 \
              > "$RUNNER_TEMP/tor-paid-minio.log" 2>&1 &
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            tail -n 80 "$RUNNER_TEMP/tor-paid-minio.log"
            exit 1
          fi
      - name: Install real Chromium before issuing short-lived S3 URLs
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Actual purchase, authenticated grant, private S3 and WebCrypto
        env:
          TOR_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          TOR_TEST_S3_ACCESS_KEY: tor-chapter-ci-user
          TOR_TEST_S3_SECRET_KEY: tor-chapter-ci-secret-only
          TOR_PAID_READER_SHOTS: ${{ runner.temp }}/tor-paid-reader-visual
        run: |
          set -euo pipefail
          export TOR_PAID_GRANT_FIXTURE_PATH="$RUNNER_TEMP/paid-grant-e2e.json"
          trap 'rm -f "$TOR_PAID_GRANT_FIXTURE_PATH"' EXIT
          python3 tools/check_feature_layout.py
          cargo fmt -p tor-web -- --check
          node --check tools/paid_grant_webcrypto_e2e.mjs
          node --check tools/paid_reader_minio_chromium_e2e.cjs
          cargo test -p tor-web --features s3-paid --test paid_grants_s3_pg -- --ignored --test-threads=1
          cargo test -p tor-web --features s3-paid --test paid_author_pg -- --ignored --test-threads=1
          node tools/paid_grant_webcrypto_e2e.mjs
          node tools/paid_reader_minio_chromium_e2e.cjs
      - name: Save masked real NEwBOO reader screenshots (1440/390, light/dark)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tor-s034-real-rust-reader-newboo-1440-390
          path: ${{ runner.temp }}/tor-paid-reader-visual/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: MinIO diagnostics without signed credentials
        if: failure()
        run: tail -n 80 "$RUNNER_TEMP/tor-paid-minio.log" || true
