name: TOR paid S3 grant end-to-end
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  select:
    uses: ./.github/workflows/ci-selection.yml
    with:
      caller: paid_e2e
  paid-private-e2e:
    needs: select
    if: ${{ !cancelled() && (needs.select.result != 'success' || fromJSON(needs.select.outputs.suites || '{"paid_e2e":true}').paid_e2e) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      foundation_evidence: ${{ steps.foundation.outputs.foundation_evidence }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: tor-ci-postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: tor-ci-postgres
      TEST_DATABASE_URL: postgresql://tor_app:tor-ci-app@127.0.0.1:5432/tor_ci
      MIGRATOR_URL: postgresql://tor_migrator:tor-ci-migrate@127.0.0.1:5432/tor_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PostgreSQL client
        run: |
          bash tools/ci_prepare_pg_client.sh
      - name: Prepare disposable tor_ci with separate app/migrator privileges
        run: bash tools/ci_paid_e2e_prepare_pg.sh
      - name: Start checksum-verified upstream MinIO on loopback
        run: bash tools/ci_paid_e2e_start_minio.sh
      - name: Install real Chromium before issuing short-lived S3 URLs
        run: |
          # ubuntu-24.04 has the shared libraries required by default headless
          # Chromium. Avoid retrying optional fonts over apt mirrors.
          # Fail closed if the real browser cannot launch on this runner.
          bash tools/ci_prepare_chromium.sh install-and-probe
      - name: Actual purchase, authenticated grant, private S3 and WebCrypto
        id: foundation
        env:
          TOR_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          TOR_TEST_S3_ACCESS_KEY: tor-chapter-ci-user
          TOR_TEST_S3_SECRET_KEY: tor-chapter-ci-secret-only
          TOR_PAID_READER_SHOTS: ${{ runner.temp }}/tor-paid-reader-visual
        run: bash tools/ci_paid_e2e_acceptance.sh
      - name: Save masked real NEwBOO reader screenshots (1440/390, light/dark)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tor-s034-real-rust-reader-newboo-1440-390
          path: ${{ runner.temp }}/tor-paid-reader-visual/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: MinIO diagnostics without signed credentials
        if: failure()
        run: tail -n 80 "$RUNNER_TEMP/tor-paid-minio.log" || true
