name: One-time RustSec integration preflight 1216
on:
  push:
    branches: ['tools/rustsec-lock-bootstrap-1216']
    paths: ['.github/workflows/rustsec-lock-bootstrap-1216.yml']
permissions:
  contents: write
concurrency:
  group: rustsec-lock-bootstrap-1216
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'calex794/tor' && github.ref == 'refs/heads/tools/rustsec-lock-bootstrap-1216'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET: tools/rustsec-integrated-1216
      EXPECTED_HEAD: 3b03e55b90c1a5c4517b1b770e2dcc3adda83bac
      LOCK_SHA256: 7e677aa3da7d4b2a7c85f3c0af88cf4af8a49532231cccdc04b5bc2561d9ff47
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3b03e55b90c1a5c4517b1b770e2dcc3adda83bac
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and verify the combined candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          printf '%s  Cargo.lock\n' "$LOCK_SHA256" | sha256sum -c -
          cargo metadata --locked --all-features --format-version 1 > /dev/null
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          test -z "$(git diff --name-only | grep -vE '^crates/.*\.rs$' || true)"
          printf '%s  Cargo.lock\n' "$LOCK_SHA256" | sha256sum -c -
          git diff --stat
      - name: Commit rustfmt-only changes to the isolated candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            gh auth setup-git --hostname github.com
            test "$(git ls-remote origin "refs/heads/$TARGET" | cut -f1)" = "$EXPECTED_HEAD"
            git add -u -- crates
            test -z "$(git diff --cached --name-only | grep -vE '^crates/.*\.rs$' || true)"
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'I-07: rustfmt combined dependency-remediation candidate'
            git push origin "HEAD:refs/heads/$TARGET"
          fi
          printf 'TOR_FORMATTED_CANDIDATE %s\n' "$(git rev-parse HEAD)"
      - name: Feature boundaries and architecture guards
        run: |
          python3 tools/check_feature_layout.py
          python3 tools/check_contracts.py
          python3 -m unittest discover -s tests/architecture -v
