name: Rust S0 browser preview
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  select:
    uses: ./.github/workflows/ci-selection.yml
    with:
      caller: rust
  demo:
    needs: select
    if: ${{ !cancelled() && (needs.select.result != 'success' || fromJSON(needs.select.outputs.suites || '{"rust":true}').rust) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Architecture boundaries
        run: python3 tools/check_feature_layout.py
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust unit and HTTP integration
        run: cargo test --workspace --all-targets
      - name: Repeat trace writer crash recovery with CPU contention
        run: |
          python3 -c 'while True: pass' &
          load_pid=$!
          trap 'kill "$load_pid" 2>/dev/null || true; wait "$load_pid" 2>/dev/null || true' EXIT
          for attempt in 1 2 3; do
            echo "Trace crash recovery under CPU contention: attempt $attempt/3"
            cargo test -p tor-observability --test trace_store_daemon \
              writer_crash_does_not_block_publisher_and_restart_recovers_old_traces \
              -- --exact --test-threads=1
          done
      - name: Rust lints
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build release outside VPS
        run: cargo build --release -p tor-web
      - name: Real HTTP smoke (loopback only)
        run: |
          TOR_DEMO_MODE=1 TOR_LISTEN_ADDR=127.0.0.1:3099 ./target/release/tor-web > "$RUNNER_TEMP/tor-demo.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3099/readyz >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3099/ > "$RUNNER_TEMP/tor-home.html"
          grep -q 'Пандаолейт' "$RUNNER_TEMP/tor-home.html"
          curl --fail --silent http://127.0.0.1:3099/api/v1/books > "$RUNNER_TEMP/tor-books.json"
          grep -q 'Первое знакомство' "$RUNNER_TEMP/tor-books.json"
          if grep -q 'Закрытый черновик' "$RUNNER_TEMP/tor-books.json"; then exit 1; fi
          ! curl --fail --silent http://127.0.0.1:3099/books/3
      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: tor-demo-${{ github.sha }}
          path: target/release/tor-web
          if-no-files-found: error
          retention-days: 7
