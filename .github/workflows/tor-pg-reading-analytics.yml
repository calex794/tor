name: TOR PostgreSQL reading analytics
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  select:
    uses: ./.github/workflows/ci-selection.yml
    with:
      caller: reading_analytics
  pg-reading-analytics:
    needs: select
    if: ${{ !cancelled() && (needs.select.result != 'success' || fromJSON(needs.select.outputs.suites || '{"reading_analytics":true}').reading_analytics) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: isolated-ci-only
      TEST_DATABASE_URL: postgresql://tor_app:isolated-app@127.0.0.1:5432/tor_ci
      MIGRATOR_URL: postgresql://tor_migrator:isolated-migrate@127.0.0.1:5432/tor_ci
      LEGACY_ANALYTICS_DATABASE_URL: postgresql://tor_app:isolated-app@127.0.0.1:5432/tor_ci_legacy_analytics
      LEGACY_ANALYTICS_MIGRATOR_URL: postgresql://tor_migrator:isolated-migrate@127.0.0.1:5432/tor_ci_legacy_analytics
      COLLECTION_RETIREMENT_UPGRADE_DATABASE_URL: postgresql://tor_migrator:isolated-migrate@127.0.0.1:5432/tor_ci_collection_retirement_upgrade
      COLLECTION_RETIREMENT_APP_DATABASE_URL: postgresql://tor_app:isolated-app@127.0.0.1:5432/tor_ci_collection_retirement_upgrade
      COLLECTION_RETIREMENT_STARTUP_MIGRATOR_URL: postgresql://tor_migrator:isolated-migrate@127.0.0.1:5432/tor_ci_collection_retirement_startup
      COLLECTION_RETIREMENT_STARTUP_APP_DATABASE_URL: postgresql://tor_app:isolated-app@127.0.0.1:5432/tor_ci_collection_retirement_startup
      # Reuse the compact profiles already required by tor-integration.yml.
      # Analytics runs many Cargo targets, so retain compact disk settings.
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: postgres-runtime-no-debug-v1
      - name: Feature boundary checks
        run: python3 tools/check_feature_layout.py
      - name: Prepare isolated database
        run: bash tools/ci_prepare_isolated_pg.sh
      - name: Apply real SQLx migrations twice
        run: |
          DATABASE_URL="$MIGRATOR_URL" cargo run -p tor-migrations --bin tor-migrate
          DATABASE_URL="$MIGRATOR_URL" cargo run -p tor-migrations --bin tor-migrate
      - name: Enable bounded lock diagnostics only on disposable analytics DB
        run: |
          # Existing synthetic tor_ci service, never an operational database.
          # Capture lock owner/waiter PIDs before the application's 50ms timeout.
          # This changes the logging/deadlock check threshold, NOT lock_timeout.
          psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          ALTER DATABASE tor_ci SET log_lock_waits = on;
          ALTER DATABASE tor_ci SET deadlock_timeout = '20ms';
          ALTER DATABASE tor_ci SET log_error_verbosity = 'verbose';
          ALTER DATABASE tor_ci SET log_parameter_max_length = 0;
          ALTER DATABASE tor_ci SET log_parameter_max_length_on_error = 0;
          SQL
          observed="$(psql -X -v ON_ERROR_STOP=1 -At "$TEST_DATABASE_URL" <<'SQL'
          SELECT current_database() = 'tor_ci' AND current_user = 'tor_app'
            AND current_setting('log_lock_waits') = 'on'
            AND current_setting('deadlock_timeout') = '20ms'
            AND current_setting('log_error_verbosity') = 'verbose'
            AND current_setting('log_parameter_max_length') = '0'
            AND current_setting('log_parameter_max_length_on_error') = '0';
          SQL
          )"
          test "$observed" = t
          echo CI_PG_LOCK_DIAGNOSTICS_ENABLED
      - name: Prepare explicit legacy and installed-upgrade analytics databases
        run: |
          bash tools/ci_prepare_legacy_analytics.sh
          cargo test -p tor-migrations --test legacy_analytics_baseline_pg -- --ignored --test-threads=1
          cargo test -p tor-migrations --test collection_retirement_startup_baseline_pg -- --ignored --test-threads=1
      - name: Installed 190 to current analytics retirement with canonical and preference preservation
        run: cargo test -p tor-migrations --test collection_retirement_installed_upgrade_pg -- --ignored --test-threads=1 --nocapture
      - name: Reader audience, FLOW and SEO PostgreSQL acceptance
        run: |
          set -euo pipefail
          started=$SECONDS
          cargo test -p tor-reading --test audience_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test audience_http_pg -- --ignored --test-threads=1
          cargo test -p tor-recommendations --test audience_sources_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test audience_sources_http_pg -- --ignored --test-threads=1
          cargo test -p tor-recommendations --test audience_books_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test audience_books_http_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test continuation_stats_http_pg -- --ignored --test-threads=1
          cargo test -p tor-recommendations --test audience_groups_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test audience_groups_http_pg -- --ignored --test-threads=1
          cargo test -p tor-reading --test audience_returns_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test audience_returns_http_pg -- --ignored --test-threads=1
          cargo test -p tor-reading --test audience_book_returns_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test audience_book_returns_http_pg -- --ignored --test-threads=1
          cargo test -p tor-reading --test audience_group_returns_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test audience_group_returns_http_pg -- --ignored --test-threads=1
          cargo test -p tor-traffic_behavior --test flow_audience_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test audience_hours_http_pg -- --ignored --test-threads=1
          cargo test -p tor-recommendations --test flow_visits_pg -- --ignored --test-threads=1
          cargo test -p tor-recommendations --test exposure_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test exposure_http_pg -- --ignored --test-threads=1
          cargo test -p tor-recommendations --test flow_signals_pg -- --ignored --test-threads=1
          cargo test -p tor-recommendations --test exposure_health_pg -- --ignored --test-threads=1
          cargo test -p tor-recommendations --test flow_genres_pg -- --ignored --test-threads=1
          cargo test -p tor-search --test public_pages_pg -- --ignored --test-threads=1
          cargo test -p tor-reading --test audience_closed_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test exposure_report_http_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test flow_signals_http_pg -- --ignored --test-threads=1
          cargo test -p tor-ads --test editorial_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test editorial_http_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test recommendation_share_admin_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test recommendations_admin_policy_http_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test flow_visits_http_pg -- --ignored --test-threads=1
          cargo test -p tor-reading --test flow_capture_pg -- --ignored --test-threads=1
          cargo test -p tor-reading --test collection_retirement_pg -- --ignored --test-threads=1
          cargo test -p tor-recommendations --test flow_funnel_pg -- --ignored --test-threads=1
          cargo test -p tor-web --test flow_funnel_http_pg -- --ignored --test-threads=1
          cargo test -p tor-search --test seo_pg -- --ignored --test-threads=1
          echo "CI_PG_ANALYTICS_TEST_SECONDS seconds=$((SECONDS-started))"
      - name: Confirm committed source was tested
        if: always()
        run: git diff --exit-code
