name: TOR isolated encrypted S3 backup recovery
on:
  pull_request:
    paths:
      - '.github/workflows/tor-disaster-recovery.yml'
      - 'tools/tor_dr_archive_crypto.cjs'
      - 'tools/tor_dr_s3_backup_smoke.sh'
      - 'crates/web/src/**'
      - 'crates/books/src/**'
      - 'migrations/**'
      - 'crates/migrations/**'
      - 'Cargo.toml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/tor-disaster-recovery.yml'
      - 'tools/tor_dr_archive_crypto.cjs'
      - 'tools/tor_dr_s3_backup_smoke.sh'
      - 'crates/web/src/**'
      - 'crates/books/src/**'
      - 'migrations/**'
      - 'crates/migrations/**'
      - 'Cargo.toml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tor-disaster-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  sealed-remote-copy:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: tor-ci-postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: tor-ci-postgres
      TEST_DATABASE_URL: postgresql://tor_app:tor-ci-app@127.0.0.1:5432/tor_ci
      MIGRATOR_URL: postgresql://tor_migrator:tor-ci-migrate@127.0.0.1:5432/tor_ci
      TOR_DR_S3_ENDPOINT: http://127.0.0.1:9010
      TOR_DR_S3_ACCESS_KEY: tor-dr-ci-user
      TOR_DR_S3_SECRET_KEY: tor-dr-ci-secret-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Validate repository boundaries and test-only helper syntax
        run: |
          python3 tools/check_feature_layout.py
          bash -n tools/tor_dr_s3_backup_smoke.sh
          node --check tools/tor_dr_archive_crypto.cjs
      - name: Start pinned MinIO backup vault on loopback with verified SHA-256
        run: |
          set -euo pipefail
          release=minio.linux-amd64.RELEASE.2025-09-07T16-13-09Z
          url=https://github.com/minio/minio/releases/download/RELEASE.2025-09-07T16-13-09Z
          curl --fail --location --silent --show-error --retry 3 \
            "$url/$release" --output "$RUNNER_TEMP/$release"
          curl --fail --location --silent --show-error --retry 3 \
            "$url/$release.sha256sum" --output "$RUNNER_TEMP/$release.sha256sum"
          expected=$(grep -Eo '[0-9a-f]{64}' "$RUNNER_TEMP/$release.sha256sum" | head -n 1)
          test "${#expected}" -eq 64
          test "$(sha256sum "$RUNNER_TEMP/$release" | cut -d ' ' -f1)" = "$expected"
          chmod 700 "$RUNNER_TEMP/$release"
          mkdir -p "$RUNNER_TEMP/tor-dr-vault-data"
          MINIO_ROOT_USER=tor-dr-ci-user MINIO_ROOT_PASSWORD=tor-dr-ci-secret-only \
            nohup "$RUNNER_TEMP/$release" server "$RUNNER_TEMP/tor-dr-vault-data" \
              --address 127.0.0.1:9010 --console-address 127.0.0.1:9011 \
              > "$RUNNER_TEMP/tor-dr-vault-minio.log" 2>&1 &
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9010/minio/health/ready >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            tail -n 50 "$RUNNER_TEMP/tor-dr-vault-minio.log"
            exit 1
          fi
      - name: Create disposable PostgreSQL roles, database and SQLx schema
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE tor_migrator LOGIN PASSWORD 'tor-ci-migrate';
          CREATE ROLE tor_app LOGIN PASSWORD 'tor-ci-app';
          CREATE DATABASE tor_ci OWNER tor_migrator;
          SQL
          psql -X -v ON_ERROR_STOP=1 -d tor_ci <<'SQL'
          REVOKE ALL ON DATABASE tor_ci FROM PUBLIC;
          GRANT CONNECT ON DATABASE tor_ci TO tor_app;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          GRANT USAGE ON SCHEMA public TO tor_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE tor_migrator IN SCHEMA public
            GRANT SELECT,INSERT,UPDATE,DELETE ON TABLES TO tor_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE tor_migrator IN SCHEMA public
            GRANT USAGE,SELECT ON SEQUENCES TO tor_app;
          SQL
          DATABASE_URL="$MIGRATOR_URL" cargo run -p tor-migrations --bin tor-migrate
      - name: Build real TOR binary off VPS
        run: cargo build -p tor-web
      - name: Encrypted archive to independent MinIO, destroy local copy and restore
        run: bash tools/tor_dr_s3_backup_smoke.sh
      - name: Diagnostic service state without backup contents or keys
        if: failure()
        run: |
          curl -fsS --max-time 3 http://127.0.0.1:9010/minio/health/ready || true
          echo "TOR recovery CI failed; no secret, archive or database files are published"
