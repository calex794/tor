name: "TOR S3 candidate build (NO DEPLOY)"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tor-s3-candidate-build-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  s3-build-only:
    name: "Build FREE S3 runtime without credentials or deployment"
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Enforce feature boundaries
        run: python3 tools/check_feature_layout.py
      - name: Compile S3-enabled TOR without paid or runtime opt-in
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --error-unmatch Cargo.lock
          test -s Cargo.lock
          git diff --exit-code HEAD -- Cargo.lock
          cp Cargo.lock "$RUNNER_TEMP/tor-release-input.lock"
          cargo build --release --locked -p tor-web --features "s3-free,s3-chapter-import,s3-covers"
          cmp Cargo.lock "$RUNNER_TEMP/tor-release-input.lock"
          git ls-files --error-unmatch Cargo.lock
          git diff --exit-code HEAD -- Cargo.lock
          sha256sum Cargo.lock > "$RUNNER_TEMP/tor-release-lock.sha256"
          test -x target/release/tor-web
          sha256sum target/release/tor-web | sed 's#target/release/##' > "$RUNNER_TEMP/tor-s3-build.sha256"
          {
            printf 'TOR_S3_BUILD_ONLY=1\n'
            printf 'TOR_COMMIT_SHA=%s\n' "$(git rev-parse HEAD)"
            printf 'TOR_S3_FEATURES=s3-free,s3-chapter-import,s3-covers\n'
            printf 'TOR_S3_PAID=OFF\n'
            printf 'TOR_PROVIDER_ACCEPTED=NO\n'
            printf 'TOR_DATA_READY=NO\n'
            printf 'TOR_DEPLOYMENT=NONE\n'
          } > "$RUNNER_TEMP/tor-s3-build-evidence.txt"
      - name: Store checksums and profile only (no binaries or secrets)
        uses: actions/upload-artifact@v4
        with:
          name: tor-s3-build-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/tor-s3-build.sha256
            ${{ runner.temp }}/tor-s3-build-evidence.txt
            ${{ runner.temp }}/tor-release-lock.sha256
          if-no-files-found: error
          retention-days: 7
