name: "TOR — Старый способ (не использовать после настройки одной кнопки)"
on:
  workflow_dispatch:
    inputs:
      install:
        description: "Activate only after successful staging, schema checks and exact SHA confirmation"
        type: boolean
        required: false
        default: false
      confirm_sha:
        description: "For install=true: paste the full 40-character current main SHA; otherwise leave blank"
        type: string
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: tor-vps-staging-single-flight
  cancel-in-progress: false
jobs:
  stage:
    # I-10: Retired. This old SSH/install path bypasses the new main-protection
    # I-06 release gate. Keep as an inert test fixture for rollback regression.
    # The only permitted production updater is tor-one-click-release.yml.
    if: ${{ false }}
    environment: tor-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_SHA: ${{ github.sha }}
      AUTO_INSTALL: ${{ inputs.install }}
      INSTALL_CONFIRM_SHA: ${{ inputs.confirm_sha }}
      TOR_DEPLOY_HOST: ${{ vars.TOR_DEPLOY_HOST }}
      TOR_DEPLOY_USER: ${{ vars.TOR_DEPLOY_USER }}
      TOR_DEPLOY_SSH_KEY: ${{ secrets.TOR_DEPLOY_SSH_KEY }}
      TOR_DEPLOY_KNOWN_HOSTS: ${{ secrets.TOR_DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Validate target and explicit installation approval
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$AUTO_INSTALL" == "true" ]]; then
            if [[ "$INSTALL_CONFIRM_SHA" != "$TARGET_SHA" ]]; then
              echo "REFUSE_INSTALL: enter the exact current main SHA in confirm_sha" >&2
              exit 1
            fi
          elif [[ -n "$INSTALL_CONFIRM_SHA" ]]; then
            echo "REFUSE_STAGE: confirm_sha must be empty for install=false" >&2
            exit 1
          fi
          [[ -n "$TOR_DEPLOY_HOST" && -n "$TOR_DEPLOY_USER" && -n "$TOR_DEPLOY_SSH_KEY" && -n "$TOR_DEPLOY_KNOWN_HOSTS" ]]
          [[ "$TOR_DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$TOR_DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$TOR_DEPLOY_USER" != "root" ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Verify current main is the selected release
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$TARGET_SHA"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify architecture before packaging
        run: python3 tools/check_feature_layout.py
      - name: Build release and embedded SQLx migrator on runner, never on 1-vCPU VPS
        run: |
          cargo build --release -p tor-web
          cargo build --release -p tor-migrations --bin tor-migrate
          sha256sum target/release/tor-web > "$RUNNER_TEMP/tor-web.sha256"
          sha256sum target/release/tor-migrate | sed 's#target/release/##' > "$RUNNER_TEMP/tor-migrate.sha256"
      - name: Set up verified SSH identity
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$TOR_DEPLOY_SSH_KEY" > "$RUNNER_TEMP/tor_id_ed25519"
          printf '%s\n' "$TOR_DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/tor_known_hosts"
          chmod 600 "$RUNNER_TEMP/tor_id_ed25519" "$RUNNER_TEMP/tor_known_hosts"
          ssh-keygen -F "$TOR_DEPLOY_HOST" -f "$RUNNER_TEMP/tor_known_hosts" >/dev/null
      - name: Transfer verified production binaries (no RAM demo candidate)
        shell: bash
        run: |
          set -euo pipefail
          destination="$TOR_DEPLOY_USER@$TOR_DEPLOY_HOST"
          opts=(-i "$RUNNER_TEMP/tor_id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/tor_known_hosts")
          ssh "${opts[@]}" "$destination" "test -d /opt/tor/releases && test -w /opt/tor/releases"
          ssh "${opts[@]}" "$destination" "mkdir -p /opt/tor/releases/$TARGET_SHA"
          scp -p "${opts[@]}" target/release/tor-web "$destination:/opt/tor/releases/$TARGET_SHA/tor-web"
          scp -p "${opts[@]}" target/release/tor-migrate "$destination:/opt/tor/releases/$TARGET_SHA/tor-migrate"
          scp -p "${opts[@]}" "$RUNNER_TEMP/tor-migrate.sha256" "$destination:/opt/tor/releases/$TARGET_SHA/tor-migrate.sha256"
          local_sha="$(sha256sum target/release/tor-web | awk '{print $1}')"
          remote_sha="$(ssh "${opts[@]}" "$destination" "sha256sum /opt/tor/releases/$TARGET_SHA/tor-web | awk '{print \$1}'")"
          test "$local_sha" = "$remote_sha"
          ssh "${opts[@]}" "$destination" "cd /opt/tor/releases/$TARGET_SHA && sha256sum -c --status tor-migrate.sha256"
          echo "SQLx migrator delivered and checksum verified, not executed on the VPS"
          ssh "${opts[@]}" "$destination" "test -x /opt/tor/releases/$TARGET_SHA/tor-web && test -x /opt/tor/releases/$TARGET_SHA/tor-migrate"
          echo "Production release staged; PostgreSQL integration was tested in GitHub Actions"
      - name: Check root-verified SQLx schema before auto activation
        id: schema_guard
        if: env.AUTO_INSTALL == 'true'
        shell: bash
        run: |
          set -euo pipefail
          required="$(find migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' |
            sed -n 's/^\([0-9]\{12\}\)_.*/\1/p' | sort -n | tail -1)"
          [[ "$required" =~ ^[0-9]{12}$ ]]
          destination="$TOR_DEPLOY_USER@$TOR_DEPLOY_HOST"
          opts=(-i "$RUNNER_TEMP/tor_id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/tor_known_hosts")
          installed="$(ssh "${opts[@]}" "$destination" 'test -r /var/lib/tor-release/schema-version && cat /var/lib/tor-release/schema-version' || true)"
          # A successful migrator alone cannot authorize a new server binary.
          # Go-live creates the root-owned marker ONLY after PG-backed HTTPS
          # and authentication pages passed; verify its service configuration.
          pg_ready="$(ssh "${opts[@]}" "$destination" '
            set -e
            test -r /var/lib/tor-release/pg-activated
            test "$(cat /var/lib/tor-release/pg-activated)" = PG_ACTIVATED
            conf=/etc/systemd/system/tor-web.service.d/20-postgres.conf
            test -f "$conf" && test ! -L "$conf"
            grep -Fxq "Environment=TOR_DEMO_MODE=0" "$conf"
            grep -Fxq "Environment=TOR_AUTH_ENABLED=1" "$conf"
            grep -Fxq "EnvironmentFile=/etc/tor/tor-app.env" "$conf"
            curl -fsS --max-time 4 http://127.0.0.1:3000/readyz | grep -qx ok
            printf verified
          ' || true)"
          if [[ "$installed" != "$required" || "$pg_ready" != verified ]]; then
            echo "SKIP_AUTO_ACTIVATION: verified schema is ${installed:-unknown}, candidate requires $required; PG-live proof is ${pg_ready:-missing}"
            echo "Stage completed; root must run pinned go-live-postgres-vps.sh to apply migrations before activation"
            echo "can_activate=false" >> "$GITHUB_OUTPUT"
          else
            echo "Verified SQLx schema $required matches release"
            echo "can_activate=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Refuse obsolete main release before switching active binary
        if: env.AUTO_INSTALL == 'true' && steps.schema_guard.outputs.can_activate == 'true'
        run: |
          set -euo pipefail
          current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$current_main" != "$TARGET_SHA" ]]; then
            echo "Refusing obsolete TOR release: main changed after staging" >&2
            exit 1
          fi
      - name: Activate verified release only when explicitly permitted
        if: env.AUTO_INSTALL == 'true' && steps.schema_guard.outputs.can_activate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          destination="$TOR_DEPLOY_USER@$TOR_DEPLOY_HOST"
          opts=(-i "$RUNNER_TEMP/tor_id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/tor_known_hosts")
          ssh "${opts[@]}" "$destination" 'bash -s' -- "$TARGET_SHA" <<'REMOTE'
          set -euo pipefail
          release_sha="$1"
          previous="$(readlink /opt/tor/current || true)"
          # Automated updates must not replace an already broken or unknown site.
          # Recovery of an unhealthy server is an operator-only procedure.
          if [[ -z "$previous" || ! -x "$previous/tor-web" ]] ||
             ! systemctl is-active --quiet tor-web.service ||
             [[ "$(curl -fsS --max-time 3 http://127.0.0.1:3000/readyz 2>/dev/null || true)" != ok ]]; then
            echo "REFUSING_AUTO_ACTIVATION: previous TOR server is unhealthy" >&2
            exit 1
          fi
          test -x "/opt/tor/releases/$release_sha/tor-web"
          ln -s "/opt/tor/releases/$release_sha" "/opt/tor/.candidate-$release_sha"
          mv -Tf "/opt/tor/.candidate-$release_sha" /opt/tor/current
          success=0
          if sudo -n /usr/bin/systemctl restart tor-web.service; then
            for i in $(seq 1 20); do
              ready="$(curl -fsS --max-time 3 http://127.0.0.1:3000/readyz 2>/dev/null || true)"
              if [[ "$ready" == ok ]]; then
                # Demo /readyz cannot substitute for real PG + auth readiness.
                register="$(curl -fsS --max-time 3 http://127.0.0.1:3000/register 2>/dev/null || true)"
                if [[ "$register" == *'name="csrf_token"'* ]]; then success=1; break; fi
              fi
              sleep 1
            done
          fi
          if test "$success" -ne 1; then
            echo "ACTIVATION_FAILED: candidate did not pass PG-backed /readyz and CSRF registration" >&2
            # Emit service state, not raw journal lines or environment secrets.
            systemctl show tor-web.service --no-pager \
              -p ActiveState -p SubState -p Result -p ExecMainCode -p ExecMainStatus || true
            # A restored symlink is not proof that the old process recovered.
            if ! ln -s "$previous" "/opt/tor/.rollback-$release_sha" ||
               ! mv -Tf "/opt/tor/.rollback-$release_sha" /opt/tor/current; then
              echo "ROLLBACK_UNVERIFIED: unable to restore previous release symlink" >&2
              exit 1
            fi
            sudo -n /usr/bin/systemctl restart tor-web.service || true
            rollback_ok=0
            for i in $(seq 1 15); do
              if [[ "$(curl -fsS --max-time 3 http://127.0.0.1:3000/readyz 2>/dev/null || true)" == ok ]]; then
                rollback_ok=1
                break
              fi
              sleep 1
            done
            if [[ "$rollback_ok" == 1 ]]; then
              echo "ROLLBACK_VERIFIED: previous TOR release $previous responds to /readyz" >&2
            else
              echo "ROLLBACK_UNVERIFIED: previous binary restored but HTTP did not recover" >&2
              systemctl show tor-web.service --no-pager \
                -p ActiveState -p SubState -p Result -p ExecMainCode -p ExecMainStatus || true
            fi
            exit 1
          fi
          echo "Active tor commit: $release_sha"
          REMOTE
      - name: Upload release trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tor-release-${{ env.TARGET_SHA }}
          path: ${{ runner.temp }}/tor-web.sha256
          if-no-files-found: warn
          retention-days: 14
