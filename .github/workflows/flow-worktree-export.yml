name: FLOW isolated validation worktree
on:
  push:
    branches: [qa/flow-worktree-export-20261111]
permissions:
  contents: write
concurrency:
  group: flow-observed-source-publication
  cancel-in-progress: false
jobs:
  worktree:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: payload
          persist-credentials: false
      - name: Check complete payload
        id: payload
        shell: bash
        run: |
          if test -f payload/.qa/flow-observed-3.txt; then echo 'ready=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.payload.outputs.ready == 'true'
        with:
          ref: 7b922159c48ea74ff5fcf2f4763c71964e940b69
          path: tor
      - name: Apply exact patch only to new feature branch
        if: steps.payload.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,lzma,pathlib
          data=''.join(pathlib.Path(f'payload/.qa/flow-observed-{i}.txt').read_text().strip() for i in range(4))
          patch=lzma.decompress(base64.b64decode(data,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='aed76374f3292265efeeae9df8818f93e2c88fdb1364a132bb26fe7aa0475ea7'
          pathlib.Path('observation.patch').write_bytes(patch)
          PY
          cd tor
          test "$(git rev-parse HEAD)" = 7b922159c48ea74ff5fcf2f4763c71964e940b69
          git apply --check ../observation.patch
          git apply --index ../observation.patch
          test "$(git write-tree)" = ee8a70bf15f224f6cbd46d79703873013743db31
          git diff --check --cached
          git config user.name 'FLOW QA'
          git config user.email 'flow-qa@users.noreply.github.com'
          git commit -m 'FLOW-02/04: anonymous observation-hour reports with real PG HTTP and browser acceptance'
          test -z "$(git ls-remote --heads origin refs/heads/feat/flow-observed-hours-20261111)"
          git push origin HEAD:refs/heads/feat/flow-observed-hours-20261111
          mkdir -p "$RUNNER_TEMP/flow-export"
          git rev-parse HEAD > "$RUNNER_TEMP/flow-export/COMMIT"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/flow-export/TREE"
      - uses: actions/upload-artifact@v4
        if: steps.payload.outputs.ready == 'true'
        with:
          name: flow-observed-publication-${{ github.sha }}
          path: ${{ runner.temp }}/flow-export/
          retention-days: 1
