name: FLOW isolated validation worktree
on:
  push:
    branches: [qa/flow-worktree-export-20261111]
permissions:
  contents: write
concurrency:
  group: flow-completion-source-publication
  cancel-in-progress: false
jobs:
  worktree:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: efd00da1e0b14bc81ba7b287efdf29359c8f7e8e
          fetch-depth: 0
      - name: Apply verified narrow fixture fixes and merge pinned integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,lzma,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'flow-fixed';root.mkdir()
          items=[(812,'efd00da1e0b14bc81ba7b287efdf29359c8f7e8e','bda3371e7b56f2134e34961d448029062ab340e1e10a7ddd1a6a5b85ff315ab8','b1ba6eafde1bb33096cbc2d9bda5d581dc94e7fd',''),(810,'112a5c4ae1930aad6cbc10533acab5690148dc96','904888526205cf6a3a43e8f69320be2a6406bb735578558d9dbac411cfe2ed30','c7e9fa2851e4fe543961a63d9833adf35f381ffe','')]
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          subprocess.run(['git','config','user.name','FLOW QA'],check=True)
          subprocess.run(['git','config','user.email','flow-qa@users.noreply.github.com'],check=True)
          refs=[]
          for number,base,digest,expected,payload in items:
              patch=lzma.decompress(base64.b64decode(payload,validate=True))
              assert hashlib.sha256(patch).hexdigest()==digest
              path=root/f'{number}.patch';path.write_bytes(patch)
              branch=f'qa/flow{number}-compile-main-20261111'
              assert not git('ls-remote','--heads','origin','refs/heads/'+branch)
              subprocess.run(['git','switch','-c',branch,base],check=True)
              subprocess.run(['git','apply','--check',str(path)],check=True)
              subprocess.run(['git','apply','--index',str(path)],check=True)
              subprocess.run(['git','diff','--check','--cached'],check=True)
              subprocess.run(['git','commit','-m',f'FLOW #{number}: keep real database fixture outside web SQLx boundary'],check=True)
              subprocess.run(['git','merge','--no-ff','-m','Integrate pinned current main and anonymous observation hours','e2bc9e421233267b0b8821eb11da99c52852b3ca'],check=True)
              assert git('rev-parse','HEAD^{tree}')==expected
              subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
              (root/f'{number}-COMMIT').write_text(git('rev-parse','HEAD'))
              refs.append(branch)
          subprocess.run(['git','bundle','create',str(root/'fixes.bundle'),*refs],check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: flow-fixed-integration-${{ github.sha }}
          path: ${{ runner.temp }}/flow-fixed/
          retention-days: 2
