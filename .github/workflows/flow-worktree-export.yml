name: FLOW isolated validation worktree
on:
  push:
    branches: [qa/flow-worktree-export-20261111]
permissions:
  contents: read
  actions: read
concurrency:
  group: flow-diagnostics-export
  cancel-in-progress: false
jobs:
  worktree:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 352062300d280755a94a52a8cfaa612bc3b7d000
          persist-credentials: false
      - name: Export tracked source and bounded diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/flow-export"
          git archive HEAD | gzip > "$RUNNER_TEMP/flow-export/flow-source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/flow-export/COMMIT"
          gh api --allow-escape-sequences repos/calex794/tor/actions/jobs/130178565934/logs > "$RUNNER_TEMP/flow-job.log"
          python3 - <<'PY'
          import os,pathlib,re
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          text=re.sub(r'\x1b\[[0-9;]*[a-zA-Z]','',(root/'flow-job.log').read_text())
          lines=text.splitlines()
          hits=[i for i,s in enumerate(lines) if re.search(r'FAILED|panicked at|error\[|##\[error\]|AssertionError',s)]
          indices=set()
          for i in hits[-12:]:
              indices.update(range(max(0,i-8),min(len(lines),i+18)))
          text='\n'.join(f'{i+1}: {lines[i]}' for i in sorted(indices))
          if not text: text='\n'.join(lines[-100:])
          (root/'flow-export/failure.txt').write_text(text)
          print(text[:28000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flow-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/flow-export/
          retention-days: 1
