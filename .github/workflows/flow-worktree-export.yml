name: FLOW isolated validation worktree
on:
  push:
    branches: [qa/flow-worktree-export-20261111]
permissions:
  contents: read
  actions: read
concurrency:
  group: flow-completion-source-export
  cancel-in-progress: false
jobs:
  worktree:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: efd00da1e0b14bc81ba7b287efdf29359c8f7e8e
          persist-credentials: false
      - name: Export bounded diagnostics without forwarding authorization to storage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,re,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'flow-evidence';root.mkdir()
          def get(path):
              return subprocess.check_output(['gh','api','--allow-escape-sequences','repos/calex794/tor/'+path],timeout=90)
          for run in [42919918051,42917952502,42917952427]:
              try:
                  jobs=json.loads(get(f'actions/runs/{run}/jobs?per_page=100'))['jobs']
                  (root/f'jobs-{run}.json').write_text(json.dumps(jobs,indent=2))
                  for job in jobs:
                      if job['conclusion'] not in ('failure','timed_out','cancelled'):continue
                      lines=get(f"actions/jobs/{job['id']}/logs").decode('utf-8-sig').splitlines()
                      lines=[re.sub(r'\x1b\[[0-9;]*m','',s) for s in lines]
                      hits=[i for i,s in enumerate(lines) if re.search(r'FAILED|panicked at|error\[|##\[error\]|AssertionError',s)]
                      indices=set()
                      for i in hits[-16:]:indices.update(range(max(0,i-8),min(len(lines),i+28)))
                      text='\n'.join(f'{i+1}: {lines[i]}' for i in sorted(indices)) or '\n'.join(lines[-100:])
                      (root/f"failure-{run}-{job['id']}.txt").write_text(text)
                      print(job['name'],job['conclusion'],text[-16000:])
              except Exception as e:
                  (root/f'error-{run}.txt').write_text(type(e).__name__)
                  print('Diagnostics unavailable',run,type(e).__name__)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: flow-completion-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/flow-evidence/
          retention-days: 2
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch offline compilation inputs
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch
          mkdir -p "$RUNNER_TEMP/flow-deps"
          cp Cargo.lock "$RUNNER_TEMP/flow-deps/Cargo.lock"
          tar -czf "$RUNNER_TEMP/flow-deps/registry.tar.gz" -C "$HOME/.cargo" registry
      - uses: actions/upload-artifact@v4
        with:
          name: flow-completion-cargo-${{ github.sha }}
          path: ${{ runner.temp }}/flow-deps/
          retention-days: 2
