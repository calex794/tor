name: FLOW isolated validation worktree
on:
  push:
    branches: [qa/flow-worktree-export-20261111]
permissions:
  contents: write
concurrency:
  group: flow-selector-fix-publication
  cancel-in-progress: false
jobs:
  worktree:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 352062300d280755a94a52a8cfaa612bc3b7d000
      - name: Apply bounded test-selector fix to staging only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 352062300d280755a94a52a8cfaa612bc3b7d000
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crates/web/tests/audience_hours_http_pg.rs')
          s=p.read_text()
          old='        assert!(!html.contains("audience-hours-table"));'
          new='''        // Both projections share presentation classes; only the legacy table
                  // is absent for long periods. The observation-hour report stays live.
                  assert!(!html.contains("data-testid=\\"audience-hours-table\\""));
                  assert!(html.contains("data-testid=\\"audience-observed-table\\""));
                  assert_eq!(html.matches("data-observed-hour=").count(), 168);'''
          assert s.count(old)==1
          s=s.replace(old,new)
          old='    assert!(html.contains("audience-hours-unavailable"));'
          assert s.count(old)==1
          s=s.replace(old,old+'\n    assert!(html.contains("data-testid=\\"audience-observed-current\\""));')
          p.write_text(s)
          PY
          rustfmt --edition 2021 crates/web/tests/audience_hours_http_pg.rs
          git diff --check
          test "$(git diff --name-only)" = crates/web/tests/audience_hours_http_pg.rs
          test "$(git hash-object crates/web/tests/audience_hours_http_pg.rs)" = f5046e4bdd4b2720fd4dc9486e5e0b46b9158ecc
          git add crates/web/tests/audience_hours_http_pg.rs
          git config user.name 'FLOW QA'
          git config user.email 'flow-qa@users.noreply.github.com'
          git commit -m 'FLOW: distinguish legacy and observed hour tables in HTTP acceptance'
          test -z "$(git ls-remote --heads origin refs/heads/qa/flow808-selector-fix-20261111)"
          git push origin HEAD:refs/heads/qa/flow808-selector-fix-20261111
          mkdir -p "$RUNNER_TEMP/flow-export"
          git rev-parse HEAD > "$RUNNER_TEMP/flow-export/COMMIT"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/flow-export/TREE"
      - uses: actions/upload-artifact@v4
        with:
          name: flow-selector-fix-${{ github.sha }}
          path: ${{ runner.temp }}/flow-export/
          retention-days: 1
