name: FLOW isolated validation worktree
on:
  push:
    branches: [qa/flow-worktree-export-20261111]
permissions:
  contents: write
concurrency:
  group: flow05-intents-publication
  cancel-in-progress: false
jobs:
  worktree:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: payload
          persist-credentials: false
      - name: Check complete payload
        id: payload
        shell: bash
        run: |
          if test -f payload/.qa/flow05-intents-2.txt; then echo 'ready=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.payload.outputs.ready == 'true'
        with:
          ref: 81ea311158f3c4a600b7c13262ced0da6d29349e
          path: tor
      - name: Apply verified patch to new feature branch only
        if: steps.payload.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,lzma,pathlib
          data=''.join(pathlib.Path(f'payload/.qa/flow05-intents-{i}.txt').read_text().strip() for i in range(3))
          patch=lzma.decompress(base64.b64decode(data,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='d7a39d407b72bc73ab9764546c782e26f4ceb73366f11dfd2844ba4b6d1f8ba4'
          pathlib.Path('flow05.patch').write_bytes(patch)
          PY
          cd tor
          test "$(git rev-parse HEAD)" = 81ea311158f3c4a600b7c13262ced0da6d29349e
          git apply --check ../flow05.patch
          git apply --index ../flow05.patch
          test "$(git write-tree)" = e850cfbe8833b39a12715f49a2940a83b3b474d7
          git diff --cached --check
          git config user.name 'FLOW QA'
          git config user.email 'flow-qa@users.noreply.github.com'
          git commit -m 'FLOW-05: read-only explicit library and book-follow snapshots with real acceptance'
          test -z "$(git ls-remote --heads origin refs/heads/feat/flow-explicit-choices-20261111)"
          git push origin HEAD:refs/heads/feat/flow-explicit-choices-20261111
          mkdir -p "$RUNNER_TEMP/flow-export"
          git rev-parse HEAD > "$RUNNER_TEMP/flow-export/COMMIT"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/flow-export/TREE"
      - uses: actions/upload-artifact@v4
        if: steps.payload.outputs.ready == 'true'
        with:
          name: flow05-publication-${{ github.sha }}
          path: ${{ runner.temp }}/flow-export/
          retention-days: 1
