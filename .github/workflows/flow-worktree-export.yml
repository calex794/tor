name: FLOW isolated validation worktree
on:
  push:
    branches: [qa/flow-worktree-export-20261111]
permissions:
  contents: write
concurrency:
  group: flow-completion-source-publication
  cancel-in-progress: false
jobs:
  worktree:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: payload
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: tor
          ref: 54d89a331a396c613dee85a57c84d4473a53e98b
          fetch-depth: 0
      - name: Publish only verified source fixes to new QA branches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,subprocess
          items=json.loads(pathlib.Path('payload/.qa/flow-completion-fixes-2.json').read_text())
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'flow-fixed';root.mkdir()
          def run(*args):return subprocess.check_output(['git','-C','tor',*args],text=True).strip()
          run('config','user.name','FLOW QA')
          run('config','user.email','flow-qa@users.noreply.github.com')
          refs=[]
          for item in items:
              patch=lzma.decompress(base64.b64decode(item['patch'],validate=True))
              assert hashlib.sha256(patch).hexdigest()==item['sha256']
              path=root/str(item['number']);path.write_bytes(patch)
              assert not run('ls-remote','--heads','origin','refs/heads/'+item['branch'])
              run('switch','-c',item['branch'],item['base'])
              run('apply','--check',str(path));run('apply','--index',str(path))
              assert run('write-tree')==item['tree']
              run('diff','--check','--cached')
              run('commit','-m',f"FLOW #{item['number']}: preserve anonymous observations and exact fixture cleanup")
              run('push','origin','HEAD:refs/heads/'+item['branch'])
              (root/(str(item['number'])+'-COMMIT')).write_text(run('rev-parse','HEAD'))
              refs.append(item['branch'])
          run('bundle','create',str(root/'fixes.bundle'),*refs)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: flow-corrected-fixtures-${{ github.sha }}
          path: ${{ runner.temp }}/flow-fixed/
          retention-days: 2
