name: FLOW isolated validation worktree
on:
  push:
    branches: [qa/flow-worktree-export-20261111]
permissions:
  contents: read
jobs:
  worktree:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive pinned tracked source only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/flow-export"
          for sha in 028f94d9651deca4a69d9d385531dba9e3a62bbc 311c7f4000c31ab2fad8160eaf40d8c34d0df2be; do
            git fetch --no-tags --depth=1 origin "$sha"
            git archive --format=tar.gz "$sha" > "$RUNNER_TEMP/flow-export/$sha.tar.gz"
          done
          cd "$RUNNER_TEMP/flow-export"
          sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: flow-merge-source-${{ github.sha }}
          path: ${{ runner.temp }}/flow-export/
          retention-days: 1
