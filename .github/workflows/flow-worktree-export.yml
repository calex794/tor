name: FLOW isolated validation worktree
on:
  push:
    branches: [qa/flow-worktree-export-20261111]
permissions:
  contents: read
jobs:
  worktree:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Export referenced upstream sample without test data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pg-common"
          docker run --rm --entrypoint cat postgres@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42 /usr/share/postgresql/postgresql.conf.sample > "$RUNNER_TEMP/pg-common/postgresql.conf.sample"
          sha256sum "$RUNNER_TEMP/pg-common/postgresql.conf.sample" > "$RUNNER_TEMP/pg-common/SHA256"
      - uses: actions/upload-artifact@v4
        with:
          name: flow-pg-common-${{ github.sha }}
          path: ${{ runner.temp }}/pg-common/
          retention-days: 1
