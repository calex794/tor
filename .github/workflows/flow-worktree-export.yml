name: FLOW isolated validation worktree
on:
  push:
    branches: [qa/flow-worktree-export-20261111]
permissions:
  contents: write
jobs:
  worktree:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 874ab9c284f1054cfc77620062180d5772ecdda9
          fetch-depth: 0
      - name: Reproduce reviewed merge without changing main or PR refs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FLOW QA'
          git config user.email 'flow-qa@users.noreply.github.com'
          git merge --no-commit --no-ff 311c7f4000c31ab2fad8160eaf40d8c34d0df2be || test "$(git diff --name-only --diff-filter=U)" = 'crates/web/src/auth/audience_http/render.rs'
          python3 - <<'PY'
          import pathlib,re
          p=pathlib.Path('crates/web/src/auth/audience_http/render.rs')
          s=p.read_text()
          s,n=re.subn(r'^<<<<<<<[^\n]*\n(.*?)^=======\n(.*?)^>>>>>>>[^\n]*\n',lambda m:m[1]+m[2],s,flags=re.M|re.S)
          if n not in (0,2): raise SystemExit('Unexpected merge shape')
          p.write_text(s)
          PY
          git add crates/web/src/auth/audience_http/render.rs
          test "$(git write-tree)" = 524276ec3d4f69fc3ef793ef4ae6a53675fd1735
          git diff --check --cached
          git commit -m 'Merge REC runtime retirement into FLOW-06 without restoring collection'
          test -z "$(git ls-remote --heads origin refs/heads/qa/flow-06-retirement-stage-20261111)"
          git push origin HEAD:refs/heads/qa/flow-06-retirement-stage-20261111
          mkdir -p "$RUNNER_TEMP/flow-export"
          git rev-parse HEAD > "$RUNNER_TEMP/flow-export/COMMIT"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/flow-export/TREE"
      - uses: actions/upload-artifact@v4
        with:
          name: flow-reviewed-merge-${{ github.sha }}
          path: ${{ runner.temp }}/flow-export/
          retention-days: 1
