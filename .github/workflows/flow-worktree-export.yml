name: REC contextual model publication
on:
  push:
    branches: [qa/rec-contextual-publish-20261111]
permissions:
  contents: write
concurrency:
  group: rec-contextual-model-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: payload
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: tor
          ref: 045279d794b3936148b4e73fb68251929d346d76
          fetch-depth: 0
      - name: Validate transport and apply verified feature tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,lzma,pathlib
          chunks=[pathlib.Path(f'payload/.qa/contextual-model-{i}.txt').read_text().strip() for i in range(3)]
          # Correct the identified one-character transport transcription, then
          # require the original patch digest and exact complete Git tree.
          wrong='AAHbruAYr4B1Wa//mxxGf7AgAAAAAEWVo='
          right='AAbruAYr4B1Wa//mxxGf7AgAAAAAEWVo='
          if chunks[2].endswith(wrong):
              chunks[2]=chunks[2][:-len(wrong)]+right
          data=''.join(chunks)
          assert len(data)==40748, len(data)
          patch=lzma.decompress(base64.b64decode(data,validate=True))
          assert len(patch)==130058
          assert hashlib.sha256(patch).hexdigest()=='aace3bff49fdbeac28e0f909d1fdf047791330ee60a153c4517b9f040b11ecbf'
          pathlib.Path('contextual.patch').write_bytes(patch)
          PY
          cd tor
          test "$(git rev-parse HEAD)" = 045279d794b3936148b4e73fb68251929d346d76
          test "$(git ls-remote --heads origin refs/heads/feat/rec-contextual-model-20261111 | cut -f1)" = 045279d794b3936148b4e73fb68251929d346d76
          git apply --check ../contextual.patch
          git apply --index ../contextual.patch
          python3 - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert len(paths)==45, paths
          assert all(p.startswith(('crates/','docs/contracts/','migrations/','tests/architecture/','tools/')) for p in paths)
          assert not any(p.startswith(('.github/','.qa/')) or p.endswith('Cargo.lock') for p in paths)
          assert [p for p in paths if p.startswith('migrations/')]==['migrations/202611198437_rec_contextual_model.sql']
          PY
          test "$(git write-tree)" = a465d33ad1414522491ee792c9ec670ab35ac24c
          git diff --cached --check
          git config user.name 'FLOW QA'
          git config user.email 'flow-qa@users.noreply.github.com'
          git commit -m 'REC P2b2: metadata/manual contextual model with isolated lifecycle and live access checks'
          git push origin HEAD:refs/heads/feat/rec-contextual-model-20261111
          mkdir -p "$RUNNER_TEMP/contextual-publication"
          git rev-parse HEAD > "$RUNNER_TEMP/contextual-publication/COMMIT"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/contextual-publication/TREE"
          git branch exported-contextual HEAD
          git bundle create "$RUNNER_TEMP/contextual-publication/contextual.bundle" exported-contextual
      - uses: actions/upload-artifact@v4
        with:
          name: rec-contextual-publication-${{ github.sha }}
          path: ${{ runner.temp }}/contextual-publication/
          retention-days: 2
