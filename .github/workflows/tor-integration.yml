          message = sys.stdin.read()
          recipient = next(line[4:].strip() for line in message.splitlines() if line.startswith('To: '))
          if not recipient.endswith('@example.invalid'):
              sys.exit(2)
          dest = pathlib.Path(os.environ['TOR_RESET_TEST_MAIL_DIR']) / hashlib.sha256(recipient.encode()).hexdigest()
          fd = os.open(dest, os.O_CREAT | os.O_WRONLY | os.O_TRUNC, 0o600)
