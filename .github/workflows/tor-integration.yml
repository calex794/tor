            node -e 'const p=require("playwright"); if(require("playwright/package.json").version !== "1.56.1") process.exit(1); p.chromium.launch({headless:true}).then(browser=>browser.close()).catch(error=>{console.error(error);process.exit(1)})'
          }
          if ! chromium_probe; then
