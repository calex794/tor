[workspace]
members = ["crates/contracts", "crates/storage", "crates/books", "crates/web", "crates/migrations", "crates/reading", "crates/accounts", "crates/ingest", "crates/route_intelligence", "crates/traffic_behavior", "crates/search", "crates/observability"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
axum = "0.8"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros","rt-multi-thread","net","sync"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros"] }
